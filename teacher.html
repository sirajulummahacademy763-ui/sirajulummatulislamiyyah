<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.ad{max-width:900px}
.cd{background:#fff;border:1.5px solid var(--line,#cfe0d6);border-radius:14px;padding:18px;margin-bottom:20px}
.cd h2{margin-top:0}
.cd label{display:block;font-size:.88rem;font-weight:500;margin:10px 0 3px}
.cd input,.cd select,.cd textarea{width:100%;padding:10px;border:1.5px solid var(--line,#cfe0d6);border-radius:8px;font:inherit;background:#fff}
.cd .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:var(--night,#0a4535);color:#fff;cursor:pointer;margin-top:14px}
.cd button.sm{padding:6px 12px;font-size:.84rem;margin:0 4px 0 0;background:#fff;color:var(--night,#0a4535);border:1.5px solid var(--line,#cfe0d6)}
.cd button.dg{color:#b3261e}
.cd button.ln{background:#fff;color:var(--night,#0a4535);border:1.5px solid var(--night,#0a4535)}
.hint{color:#4b6358;font-size:.92rem;margin:0 0 10px}
.cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cc{color:#0a2e24;border:2px solid var(--line,#cfe0d6);border-radius:14px;padding:14px;background:#fbfdfb;cursor:pointer;text-align:left;font:inherit;display:block;width:100%}
.cc.on{border-color:#f0be4d;background:#fffaf0;box-shadow:0 0 0 3px rgba(240,190,77,.25)}
.cd button.cc{background:#fbfdfb;color:#0a2e24;margin:0;padding:14px;border:2px solid var(--line,#cfe0d6);font-weight:400;border-radius:14px}
.cd button.cc.on{background:#fffaf0;border-color:#f0be4d}
.cc .sec{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0d6a50}
.cc .lv{font-family:Amiri,serif;font-size:1.45rem;font-weight:700;color:var(--night,#0a4535);margin:2px 0 6px}
.cc .ct{font-size:.82rem;color:#4b6358;margin-top:8px}
.ch{display:inline-block;background:#e4f0e9;color:var(--night,#0a4535);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;margin:2px 4px 2px 0}
.ch.all{background:#fdf1d4;color:#8a5a00}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line,#cfe0d6)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.74rem;font-weight:700;margin-right:6px}
.pill.t{background:#e4f0e9;color:var(--night,#0a4535)}.pill.e{background:#fdf1d4;color:#8a5a00}
.pill.o{background:#dff3e7;color:#1c7a4d}.pill.u{background:#e6eefc;color:#2a4c8f}.pill.c{background:#eee;color:#555}
.sb{border-top:1px solid var(--line,#cfe0d6);padding:12px 0}
.sb pre{white-space:pre-wrap;font:inherit;background:#f4f5fb;padding:10px;border-radius:8px;margin:6px 0}
.ok{color:#1c7a4d;font-weight:500}.er{color:#b3261e;font-weight:500}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
@media(max-width:600px){.cd .row{grid-template-columns:1fr}}
</style></head><body>
<main class="page ad" id="app"><p>Checking access...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc, addDoc, setDoc, updateDoc, deleteDoc, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const say = (id, t, ok) => { const e = $(id); if (!e) return; e.textContent = t; e.className = ok ? "ok" : "er"; };
const SN = { islamic: "Arabic and Islamic", western: "Western", tech: "Technology" };
const FORMAT = "Question | option 1 | option 2 | option 3 | number of the correct option";
let uid = "", myName = "", items = [], all = [], selKey = "", exs = [], openForm = false;
const keyOf = i => i.section + "|" + i.level;
const fmt = t => t && t.toDate ? t.toDate().toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";

onAuthStateChanged(auth, async u => {
  if (!u) return;
  uid = u.uid;
  let t = null;
  try { const s = await getDoc(doc(db, "teachers", u.uid)); if (s.exists()) t = s.data(); } catch (e) {}
  if (!t) return $("app").innerHTML = "<h1>Teacher</h1><p>You do not have access to this page.</p>";
  myName = t.name || "";
  try { const a = await getDoc(doc(db, "teacherAssign", u.uid)); items = a.exists() ? (a.data().items || []) : []; } catch (e) {}
  if (items.length) selKey = keyOf(items[0]);
  await loadAll(); draw();
});

async function loadAll() {
  try { all = (await getDocs(query(collection(db, "classExams"), where("teacherId", "==", uid)))).docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) { all = []; }
  exs = all.filter(x => x.classKey === selKey).sort((a, b) => ((b.opensAt && b.opensAt.seconds) || 0) - ((a.opensAt && a.opensAt.seconds) || 0));
}
const cur = () => items.find(i => keyOf(i) === selKey);

function draw() {
  let h = `<h1>Teacher dashboard</h1><p class="lead">Welcome ${esc(myName)}</p>`;
  if (!items.length) { $("app").innerHTML = h + '<div class="cd"><h2>My classes and subjects</h2><p>No class has been assigned to you yet. Please contact the admin.</p></div>'; return; }
  h += `<div class="cd"><h2>My classes and subjects</h2><p class="hint">Tap a class to manage its tests and exams.</p><div class="cls">` +
    items.map(i => { const n = all.filter(x => x.classKey === keyOf(i)).length; const subs = (i.subjects || []).length ? i.subjects.map(s => `<span class="ch">${esc(s)}</span>`).join("") : '<span class="ch all">All subjects</span>';
      return `<button type="button" class="cc ${keyOf(i) === selKey ? "on" : ""}" data-k="${esc(keyOf(i))}"><div class="sec">${esc(SN[i.section] || i.section)}</div><div class="lv">${esc(i.level)}</div><div>${subs}</div><div class="ct">${n} test${n === 1 ? "" : "s"} / exam${n === 1 ? "" : "s"} created</div></button>`; }).join("") + `</div></div>`;
  const c = cur();
  h += `<div class="cd"><h2>Tests and exams · ${esc(c.level)}</h2><div class="bar"><button class="ln" id="nw" type="button" style="margin-top:0">${openForm ? "Close the form" : "+ New test or exam"}</button></div>
    <p class="hint">Students of this class can start only between the opening and closing time, and then have the minutes you set.</p>`;
  if (openForm) {
    const subs = c.subjects || [];
    h += `<div style="border:1.5px dashed var(--line,#cfe0d6);border-radius:12px;padding:12px;margin:8px 0 14px">
      <label>Subject</label>${subs.length ? `<select id="xs">${subs.map(s => `<option>${esc(s)}</option>`).join("")}</select>` : '<input id="xs" placeholder="Write the subject, for example Tajweed">'}
      <label>Title</label><input id="xt">
      <div class="row"><div><label>Kind</label><select id="xk"><option value="test">Test</option><option value="exam">Exam</option></select></div>
      <div><label>Type</label><select id="xy"><option value="mcq">Multiple choice (marked automatically)</option><option value="written">Written (you mark it)</option></select></div></div>
      <div class="row"><div><label>Opens</label><input id="xo" type="datetime-local"></div><div><label>Closes</label><input id="xc" type="datetime-local"></div></div>
      <div class="row"><div><label>Duration (minutes)</label><input id="xd" type="number" min="1" value="30"></div><div><label>Total marks</label><input id="xmk" type="number" min="1" value="20"></div></div>
      <label>Pass mark</label><input id="xp" type="number" min="0" value="10">
      <label id="xl">Questions: one per line, like this: ${FORMAT}</label>
      <textarea id="xq" rows="6" placeholder="What is 2+2? | 3 | 4 | 5 | 2"></textarea>
      <button id="xb" type="button">Create</button> <span id="xm2"></span></div>`;
  }
  const now = Date.now();
  h += exs.length ? exs.map(x => { const o = x.opensAt.toMillis(), cl = x.closesAt.toMillis(), st = now < o ? ["Upcoming", "u"] : now <= cl ? ["Open now", "o"] : ["Closed", "c"];
    return `<div class="it"><div><span class="pill ${x.kind === "exam" ? "e" : "t"}">${x.kind === "exam" ? "Exam" : "Test"}</span><span class="pill ${st[1]}">${st[0]}</span><b>${esc(x.title)}</b><br><small>${esc(x.subject || "General")} · ${fmt(x.opensAt)} to ${fmt(x.closesAt)} · ${x.durationMin} min · ${x.maxScore} marks · pass ${x.passMark}</small></div>
      <div><button class="sm" data-xv="${x.id}" type="button">Results</button><button class="sm dg" data-xd="${x.id}" type="button">Delete</button></div></div>`; }).join("") : "<p>No tests or exams for this class yet.</p>";
  h += `</div><div class="cd" id="rc"><h2>Results</h2><div id="xr"><p>Choose a test or exam above and tap Results.</p></div></div>`;
  $("app").innerHTML = h;
  $("app").querySelectorAll(".cc").forEach(b => b.onclick = async () => { selKey = b.dataset.k; await loadAll(); draw(); });
  $("nw").onclick = () => { openForm = !openForm; draw(); };
  if ($("xb")) { $("xb").onclick = addExam; $("xy").onchange = () => { $("xl").textContent = $("xy").value === "mcq" ? "Questions: one per line, like this: " + FORMAT : "Write the question or task for students"; }; }
  $("app").querySelectorAll("[data-xv]").forEach(b => b.onclick = () => { showRes(b.dataset.xv); $("rc").scrollIntoView({ behavior: "smooth" }); });
  $("app").querySelectorAll("[data-xd]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this test or exam?")) return;
    for (const k of ["classExamQuestions", "classExamKeys"]) { try { await deleteDoc(doc(db, k, b.dataset.xd)); } catch (e) {} }
    try { await deleteDoc(doc(db, "classExams", b.dataset.xd)); } catch (e) { return alert("Could not delete: " + (e.code || e.message)); }
    await loadAll(); draw();
  });
}

async function addExam() {
  const c = cur(), subject = ($("xs").value || "").trim(), title = $("xt").value.trim(), kind = $("xk").value, type = $("xy").value, o = $("xo").value, cl = $("xc").value;
  const dur = parseInt($("xd").value, 10), max = Math.max(1, parseInt($("xmk").value, 10) || 20), pass = Math.max(0, parseInt($("xp").value, 10) || 0), txt = $("xq").value.trim();
  if (!subject || !title || !o || !cl || !(dur > 0) || !txt) return say("xm2", "Please fill in every box, including the subject and the opening and closing time.");
  const od = new Date(o), cd = new Date(cl);
  if (!(cd > od)) return say("xm2", "The closing time must be after the opening time.");
  let qdoc, key = null;
  if (type === "mcq") {
    const qs = [], ans = [];
    for (const line of txt.split("\n").map(x => x.trim()).filter(Boolean)) {
      const p = line.split("|").map(x => x.trim()), n = parseInt(p[p.length - 1], 10), opts = p.slice(1, -1);
      if (p.length < 4 || !p[0] || opts.length < 2 || !(n >= 1 && n <= opts.length)) return say("xm2", "Check this line: " + line);
      qs.push({ q: p[0], options: opts }); ans.push(n - 1);
    }
    qdoc = { questions: qs }; key = ans;
  } else qdoc = { prompt: txt };
  try {
    const r = await addDoc(collection(db, "classExams"), { title, kind, type, subject, classKey: selKey, section: c.section, level: c.level, opensAt: Timestamp.fromDate(od), closesAt: Timestamp.fromDate(cd), durationMin: dur, maxScore: max, passMark: pass, teacherId: uid, teacherName: myName, createdAt: serverTimestamp() });
    await setDoc(doc(db, "classExamQuestions", r.id), qdoc);
    if (key) await setDoc(doc(db, "classExamKeys", r.id), { answers: key });
    openForm = false; await loadAll(); draw();
  } catch (e) { say("xm2", "Failed: " + (e.code || e.message)); }
}

async function showRes(eid) {
  const x = exs.find(e => e.id === eid);
  const s = await getDocs(query(collection(db, "classExamResults"), where("classKey", "==", selKey), where("examId", "==", eid)));
  const subs = s.docs.map(d => ({ id: d.id, ...d.data() }));
  let qs = [];
  if (x.type === "mcq") { try { qs = (await getDoc(doc(db, "classExamQuestions", eid))).data().questions || []; } catch (e) {} }
  const passed = r => r.status === "graded" && r.score >= x.passMark;
  const show = r => x.type === "mcq" ? qs.map((q, i) => `${i + 1}. ${esc(q.q)}\n   Answer: ${esc((q.options || [])[(r.answers || [])[i]] || "-")}`).join("\n") : esc(r.text);
  const done = subs.filter(r => r.status === "graded").length;
  $("xr").innerHTML = `<h3 style="margin-top:0">${esc(x.title)} <small>· ${esc(x.subject || "")}</small></h3><p class="hint">${subs.length} submitted · ${done} marked</p>` + (x.type === "mcq" && subs.length ? '<button id="xauto" type="button" style="margin-top:0">Mark all automatically</button> <span id="xmsg"></span>' : "") +
    (subs.length ? subs.map(r => `<div class="sb"><b>${esc(r.studentName || "Student")}</b> · ${r.status === "graded" ? "Score: " + r.score + " / " + x.maxScore + (passed(r) ? " (passed)" : " (not passed)") : "Not marked"}
      <pre>${show(r)}</pre>
      <div class="row"><div><label>Score (out of ${x.maxScore})</label><input type="number" min="0" max="${x.maxScore}" id="xs-${r.id}" value="${r.score == null ? "" : r.score}"></div>
      <div><label>Comment</label><input id="xf-${r.id}" value="${esc(r.feedback || "")}"></div></div>
      <button class="sm" data-xs="${r.id}" type="button">Save mark</button> <span id="xx-${r.id}"></span></div>`).join("") : "<p>No submissions yet.</p>");
  $("xr").querySelectorAll("[data-xs]").forEach(b => b.onclick = async () => {
    const id = b.dataset.xs, v = parseInt($("xs-" + id).value, 10);
    if (!(v >= 0 && v <= x.maxScore)) return say("xx-" + id, "Enter a score from 0 to " + x.maxScore);
    try { await updateDoc(doc(db, "classExamResults", id), { score: v, feedback: $("xf-" + id).value.trim(), status: "graded", gradedAt: serverTimestamp() }); showRes(eid); }
    catch (e) { say("xx-" + id, "Failed: " + (e.code || e.message)); }
  });
  if ($("xauto")) $("xauto").onclick = async () => {
    try {
      const key = (await getDoc(doc(db, "classExamKeys", eid))).data().answers, n = key.length;
      for (const r of subs) {
        if (r.status === "graded") continue;
        const right = (r.answers || []).filter((v, i) => v === key[i]).length;
        await updateDoc(doc(db, "classExamResults", r.id), { score: Math.round(right / n * x.maxScore), status: "graded", gradedAt: serverTimestamp() });
      }
      showRes(eid);
    } catch (e) { say("xmsg", "Failed: " + (e.code || e.message)); }
  };
}
</script>
</body></html>
