<!DOCTYPE html>
<html lang="en"><head>
<!-- sec-v1 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://www.recaptcha.net https://js.paystack.co https://checkout.flutterwave.com https://meet.jit.si https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://www.google.com https://www.recaptcha.net https://*.googleapis.com https://www.gstatic.com https://*.workers.dev https://api.alquran.cloud https://cdn.mp3quran.net https://archive.org https://*.archive.org https://*.flutterwave.com https://api.paystack.co https://meet.jit.si wss://meet.jit.si; frame-src https://www.google.com https://www.recaptcha.net https://www.youtube-nocookie.com https://drive.google.com https://meet.jit.si https://checkout.flutterwave.com https://checkout.paystack.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parents | Sirajul Ummah Madrasah</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#f1f3fa;color:#12163a}
header{background:#12163a;color:#fff;text-align:center;padding:22px 16px 26px}
header .ar{font-family:Amiri,serif;font-size:1.7rem;color:#e6c55a}
header h1{margin:2px 0 0;font-size:1.15rem}header p{margin:6px 0 0;opacity:.85;font-size:.92rem}
main{max-width:640px;margin:-14px auto 40px;padding:0 14px}
.cd{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(18,22,58,.08)}
label{font-weight:700;display:block;margin-bottom:6px}
input{width:100%;padding:13px;border:1.5px solid #cfd3e8;border-radius:10px;font:inherit;font-size:1.05rem}
.b{display:block;text-align:center;text-decoration:none;width:100%;margin-top:10px;font:inherit;font-weight:800;font-size:1.05rem;padding:13px;border:0;border-radius:10px;background:#12163a;color:#fff;cursor:pointer}
.b.g{background:#fff;color:#12163a;border:1.5px solid #12163a}
.fa{display:block;width:100%;text-align:left;font:inherit;padding:13px;margin-top:8px;border:1.5px solid #cfd3e8;border-radius:10px;background:#fff;cursor:pointer}
.fa small{display:block;color:#4b5072}
.er{color:#b3261e;font-weight:700;margin:10px 0 0}.hint{color:#4b5072;font-size:.92rem}
.kid h2{margin:0;font-size:1.25rem}.kid .cl{color:#4b5072;margin-bottom:8px}
.sec{font-weight:800;margin:14px 0 6px;font-size:.98rem}
.att{display:flex;gap:8px;text-align:center}.att div{flex:1;border-radius:10px;padding:8px 2px;font-size:.8rem}.att b{display:block;font-size:1.25rem}
.p{background:#e3f4ea;color:#1c7a4d}.a{background:#fbe4e2;color:#b3261e}.l{background:#fdf0d2;color:#9a6a00}
.days{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.days span{font-size:.72rem;font-weight:700;padding:3px 7px;border-radius:7px}
.fee{border:1.5px solid #e1e4f3;border-radius:12px;padding:11px;margin-top:8px}
.fee.done{border-color:#1c7a4d;background:#f3fbf6}
.fh{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.tag{background:#1c7a4d;color:#fff;border-radius:999px;font-size:.75rem;padding:2px 10px}
.bar{height:14px;border-radius:8px;background:#e5534b;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#1c9a5d}
.nm{display:flex;justify-content:space-between;font-weight:800}.gr{color:#1c7a4d}.rd{color:#d03a32}
.pays{font-size:.8rem;color:#4b5072;margin-top:4px}
.note{border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92rem;font-weight:600;line-height:1.35}
.note.good{background:#e3f4ea;color:#14633c}.note.warn{background:#fdf0d2;color:#7a5300}.note.bad{background:#fbe4e2;color:#a3221b}
.big{position:relative;overflow:hidden;text-align:center;border-radius:18px;padding:22px 16px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#0f7a4a,#1fa869);box-shadow:0 6px 18px rgba(15,122,74,.35)}
.big .em{font-size:2.6rem;line-height:1}.big h2{margin:6px 0 4px;font-size:1.35rem}.big p{margin:0;opacity:.95}
.big .ar{font-family:Amiri,serif;font-size:1.5rem;color:#ffe9a6;margin-top:6px}
.big i{position:absolute;top:-20px;font-style:normal;animation:fall 3.6s linear infinite;opacity:.9}
@keyframes fall{to{transform:translateY(240px) rotate(300deg);opacity:0}}
.late{border-radius:18px;padding:16px;margin-bottom:14px;background:#fbe4e2;border:2px solid #d03a32;color:#8c1d17}
.late h2{margin:0 0 4px;font-size:1.1rem}.late p{margin:0;font-weight:600}
.lq{border-left:4px solid #cfd3e8;background:#f6f7fc;border-radius:8px;padding:7px 10px;margin-top:6px;font-size:.93rem}.lq.E{border-color:#1c9a5d}.lq.G{border-color:#e8a317}.lq.P{border-color:#d03a32}.lq .mk{float:right;font-weight:800;font-size:.8rem}.lq.E .mk{color:#1c7a4d}.lq.G .mk{color:#9a6a00}.lq.P .mk{color:#b3261e}
.sj{background:linear-gradient(135deg,#12163a,#2a3170);color:#fff;text-align:center;text-decoration:none;display:block;border-radius:16px;padding:18px;margin-bottom:14px}
.sj .ar{font-family:Amiri,serif;font-size:1.6rem;color:#e6c55a}.sj b{display:block;font-size:1.05rem}.sj small{opacity:.85}
</style></head><body>
<header><div class="ar">بسم الله الرحمن الرحيم</div><h1>Sirajul Ummah Madrasah</h1><p>Parents' page &mdash; attendance, fees and Sadaqah Jariyah</p></header>
<main id="app"></main>
<script type="module">
import { WORKER_URL } from "./notice-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const N = x => "₦" + Number(x || 0).toLocaleString();
const SUR = ["Al-Fatihah", "Al-Baqarah", "Ali 'Imran", "An-Nisa", "Al-Ma'idah", "Al-An'am", "Al-A'raf", "Al-Anfal", "At-Tawbah", "Yunus", "Hud", "Yusuf", "Ar-Ra'd", "Ibrahim", "Al-Hijr", "An-Nahl", "Al-Isra", "Al-Kahf", "Maryam", "Ta-Ha", "Al-Anbiya", "Al-Hajj", "Al-Mu'minun", "An-Nur", "Al-Furqan", "Ash-Shu'ara", "An-Naml", "Al-Qasas", "Al-'Ankabut", "Ar-Rum", "Luqman", "As-Sajdah", "Al-Ahzab", "Saba", "Fatir", "Ya-Sin", "As-Saffat", "Sad", "Az-Zumar", "Ghafir", "Fussilat", "Ash-Shura", "Az-Zukhruf", "Ad-Dukhan", "Al-Jathiyah", "Al-Ahqaf", "Muhammad", "Al-Fath", "Al-Hujurat", "Qaf", "Adh-Dhariyat", "At-Tur", "An-Najm", "Al-Qamar", "Ar-Rahman", "Al-Waqi'ah", "Al-Hadid", "Al-Mujadila", "Al-Hashr", "Al-Mumtahanah", "As-Saff", "Al-Jumu'ah", "Al-Munafiqun", "At-Taghabun", "At-Talaq", "At-Tahrim", "Al-Mulk", "Al-Qalam", "Al-Haqqah", "Al-Ma'arij", "Nuh", "Al-Jinn", "Al-Muzzammil", "Al-Muddaththir", "Al-Qiyamah", "Al-Insan", "Al-Mursalat", "An-Naba", "An-Nazi'at", "'Abasa", "At-Takwir", "Al-Infitar", "Al-Mutaffifin", "Al-Inshiqaq", "Al-Buruj", "At-Tariq", "Al-A'la", "Al-Ghashiyah", "Al-Fajr", "Al-Balad", "Ash-Shams", "Al-Layl", "Ad-Duha", "Ash-Sharh", "At-Tin", "Al-'Alaq", "Al-Qadr", "Al-Bayyinah", "Az-Zalzalah", "Al-'Adiyat", "Al-Qari'ah", "At-Takathur", "Al-'Asr", "Al-Humazah", "Al-Fil", "Quraysh", "Al-Ma'un", "Al-Kawthar", "Al-Kafirun", "An-Nasr", "Al-Masad", "Al-Ikhlas", "Al-Falaq", "An-Nas"];
const FEES = [["tuition", "Tuition (Tira fees)"], ["madrasah", "Madrasah fees"], ["uniform", "Uniform fees"]];
const TODAY = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
const pretty = d => { const t = new Date(d + "T00:00:00"); return isNaN(t) ? d : t.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" }); };
let step = "search", results = [], pick = null, err = "";
async function call(path, body) {
  const r = await fetch(WORKER_URL + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
// ---- what each fee says to the parent ----
function feeInfo(fe) {
  const due = Number(fe.due || 0);
  if (!due) return null;
  const pd = (fe.pays || []).reduce((s, p) => s + Number(p.amt || 0), 0), bal = Math.max(0, due - pd);
  const by = fe.by || "", overdue = bal > 0 && by && by < TODAY;
  return { due, pd, bal, by, overdue, done: bal === 0, none: pd === 0 };
}
function attMsg(c) {
  const r = c.att.recent || [];
  if (!r.length) return "";
  const [d, m] = r[0], n = esc(c.name);
  if (m === "A") return `<div class="note bad">&#128222; <b>${n}</b> was <b>absent</b> on ${esc(pretty(d))}. Please follow up and let the madrasah know the reason.</div>`;
  if (m === "L") return `<div class="note warn">&#9200; <b>${n}</b> came <b>late</b> on ${esc(pretty(d))}. Please help him/her adjust and arrive on time, in shaa Allah.</div>`;
  let s = 0; for (const x of r) { if (x[1] === "P") s++; else break; }
  return `<div class="note good">&#127775; Masha Allah! <b>${n}</b> was <b>present</b> on ${esc(pretty(d))}${s >= 3 ? " &mdash; " + s + " days in a row" : ""}. Keep it up!</div>`;
}
function lesHtml(c) {
  const L = c.les || [];
  if (!L.length) return '<p class="hint">No Qur\'an lesson recorded yet.</p>';
  const T = { H: "Hifz (new)", R: "Revision" }, M = { E: "Excellent", G: "Good", P: "Needs practice" };
  const line = e => `<div class="lq ${e.m}"><b>${T[e.t] || ""}:</b> ${esc(SUR[e.s - 1] || "")} ${e.a}${e.b !== e.a ? "&ndash;" + e.b : ""} <span class="mk">${M[e.m] || ""}</span>${e.n ? `<div class="hint">${esc(e.n)}</div>` : ""}</div>`;
  const last = L[0], ms = last.items.map(e => e.m);
  const msg = ms.includes("P") ? `<div class="note warn">&#128214; Please help ${esc(c.name)} revise this at home tonight, in shaa Allah.</div>` : `<div class="note good">&#127775; Masha Allah! ${esc(c.name)} is doing well. Keep encouraging him/her.</div>`;
  return `<div class="hint" style="margin-bottom:4px">Latest: ${esc(pretty(last.date))}</div>${last.items.map(line).join("")}${msg}` + (L.length > 1 ? `<div class="sec" style="font-size:.88rem">Earlier this week</div>` + L.slice(1).map(d => `<div class="hint" style="margin-top:6px"><b>${esc(pretty(d.date))}</b></div>${d.items.map(line).join("")}`).join("") : "");
}
function confetti() { const e = ["&#127881;", "&#11088;", "&#10024;", "&#127882;"]; let h = ""; for (let i = 0; i < 14; i++) h += `<i style="left:${(i * 7.3 + 3) % 96}%;animation-delay:${(i % 7) * .5}s;font-size:${14 + (i % 4) * 5}px">${e[i % 4]}</i>`; return h; }
function draw(data) {
  let h = "";
  if (step === "search") {
    h = `<div class="cd"><label for="fn">Father's name</label><input id="fn" placeholder="Type your name, e.g. Abdullah" autocomplete="off"><button class="b" id="go">Search</button>${err ? `<p class="er">${esc(err)}</p>` : ""}${results.length ? '<p class="hint">Tap your name:</p>' + results.map((r, i) => `<button class="fa" data-i="${i}"><b>${esc(r.father)}</b>${r.hint ? `<small>Phone starts with ${esc(r.hint)}…</small>` : ""}</button>`).join("") : ""}</div><a class="sj" href="donate.html"><div class="ar">الصدقة الجارية</div><b>Sadaqah Jariyah</b><small>Tap to give &mdash; your currency shows automatically</small></a>`;
  } else if (step === "code") {
    h = `<div class="cd"><b>${esc(pick.father)}</b><p class="hint">To keep your children's information private, type the <b>last 4 digits</b> of the phone number you gave the madrasah.</p><input id="cd" inputmode="numeric" maxlength="4" placeholder="Last 4 digits" autocomplete="off"><button class="b" id="ok">Show my children</button><button class="b g" id="back">Back</button>${err ? `<p class="er">${esc(err)}</p>` : ""}</div>`;
  } else {
    const kids = data.children;
    let allDone = false, anyLate = [], anyPaidSome = false;
    kids.forEach(c => { let tot = 0, dn = 0; FEES.forEach(f => { const i = feeInfo((c.fees && c.fees[f[0]]) || {}); if (!i) return; tot++; if (i.done) dn++; if (i.pd > 0) anyPaidSome = true; if (i.overdue || (i.none && !i.done)) anyLate.push({ c, f: f[1], i }); }); if (tot && tot === dn) allDone = true; });
    h = `<div class="cd"><b>Assalamu alaikum, ${esc(data.father)}</b><p class="hint" style="margin:4px 0 0">${kids.length ? "Here are your children." : "No child has been added yet. Please contact the madrasah."}</p></div>`;
    const full = kids.filter(c => { const l = FEES.map(f => feeInfo((c.fees && c.fees[f[0]]) || {})).filter(Boolean); return l.length && l.every(i => i.done); });
    if (full.length) h += `<div class="big">${confetti()}<div class="em">&#127881;</div><h2>Jazakumullahu khairan!</h2><p>All fees for <b>${full.map(c => esc(c.name)).join(", ")}</b> are fully paid. May Allah bless your wealth and your family.</p><div class="ar">جَزَاكُمُ اللهُ خَيْرًا</div></div>`;
    else if (anyPaidSome) h += `<div class="big">${confetti()}<div class="em">&#128154;</div><h2>Thank you, jazakumullahu khairan!</h2><p>We appreciate every payment you have made. May Allah reward you.</p></div>`;
    const od = anyLate.filter(x => x.i.overdue), np = anyLate.filter(x => !x.i.overdue);
    if (od.length) h += `<div class="late"><h2>&#9888;&#65039; Late payment reminder</h2><p>${od.map(x => `${esc(x.c.name)}: ${esc(x.f)} &mdash; ${N(x.i.bal)} was due on ${esc(pretty(x.i.by))}`).join("<br>")}</p><p style="margin-top:6px">Please complete it as soon as you can. Jazakumullahu khairan.</p></div>`;
    else if (np.length) h += `<div class="late" style="background:#fdf0d2;border-color:#e8a317;color:#7a5300"><h2>&#128276; Payment reminder</h2><p>${np.map(x => `${esc(x.c.name)}: ${esc(x.f)} &mdash; no payment yet (${N(x.i.bal)})`).join("<br>")}</p></div>`;
    h += kids.map(c => {
      const a = c.att, tot = a.P + a.A + a.L, pct = tot ? Math.round((a.P + a.L) / tot * 100) : null;
      let k = `<div class="cd kid"><h2>${esc(c.name)}</h2><div class="cl">${esc(c.cls)}</div><div class="sec">Attendance${pct == null ? "" : " &middot; " + pct + "%"}</div>
      ${tot ? `<div class="att"><div class="p"><b>${a.P}</b>Present</div><div class="a"><b>${a.A}</b>Absent</div><div class="l"><b>${a.L}</b>Late</div></div>${attMsg(c)}<div class="days">${a.recent.map(r => `<span class="${r[1].toLowerCase()}">${esc(r[0].slice(5))} ${r[1] === "P" ? "Present" : r[1] === "A" ? "Absent" : "Late"}</span>`).join("")}</div>` : '<p class="hint">No attendance recorded yet.</p>'}
      <div class="sec">Qur'an lessons (Hifz and Revision)</div>${lesHtml(c)}<div class="sec">Fees</div>`;
      k += FEES.map(f => {
        const fe = (c.fees && c.fees[f[0]]) || {}, i = feeInfo(fe);
        if (!i) return `<div class="fee"><div class="fh">${f[1]}<span class="hint">not set</span></div></div>`;
        let msg = "";
        if (i.done) msg = '<div class="note good">&#127775; Jazakumullahu khairan, this is fully paid.</div>';
        else if (i.overdue) msg = `<div class="note bad">&#9888;&#65039; Late: ${N(i.bal)} was due on ${esc(pretty(i.by))}. Please complete it soon.</div>`;
        else if (i.none) msg = `<div class="note warn">&#128276; No payment yet. Please pay ${N(i.bal)}${i.by ? " by " + esc(pretty(i.by)) : ""}.</div>`;
        else msg = `<div class="note warn">&#128154; Jazakallahu khairan for paying ${N(i.pd)}. Please complete the remaining ${N(i.bal)}${i.by ? " by " + esc(pretty(i.by)) : ""}.</div>`;
        return `<div class="fee ${i.done ? "done" : ""}"><div class="fh">${f[1]}${i.done ? '<span class="tag">COMPLETED ✓</span>' : ""}</div><div class="bar"><i style="width:${Math.min(100, i.pd / i.due * 100)}%"></i></div>
          <div class="nm"><span class="gr">Paid ${N(i.pd)}</span><span class="rd">${i.done ? "Remaining ₦0" : "Remaining " + N(i.bal)}</span></div><div class="hint">Total ${N(i.due)}${i.by ? " &middot; pay by " + esc(pretty(i.by)) : ""}</div>
          ${(fe.pays || []).length ? `<div class="pays">${fe.pays.map(p => esc(p.date) + ": " + N(p.amt)).join(" &middot; ")}</div>` : ""}${msg}</div>`;
      }).join("");
      return k + "</div>";
    }).join("") + '<a class="sj" href="donate.html"><div class="ar">الصدقة الجارية</div><b>Sadaqah Jariyah</b><small>Give for the sake of Allah &mdash; your currency shows automatically</small></a><button class="b g" id="done">Close</button>';
  }
  $("app").innerHTML = h;
  const on = (id, f) => { const n = $(id); if (n) n.onclick = f; };
  const fn = $("fn"); if (fn) fn.onkeydown = e => { if (e.key === "Enter") $("go").click(); };
  const cd = $("cd"); if (cd) { cd.focus(); cd.onkeydown = e => { if (e.key === "Enter") $("ok").click(); }; }
  on("go", async () => {
    err = ""; results = []; const v = fn.value.trim();
    if (v.length < 3) { err = "Type at least 3 letters of your name."; draw(); return; }
    $("go").textContent = "Searching..."; $("go").disabled = true;
    try { results = (await call("/mad/search", { name: v })).results; if (!results.length) err = "No one found with that name. Check the spelling or ask the madrasah."; } catch (e) { err = e.message; }
    draw(); const n = $("fn"); if (n) n.value = v;
  });
  document.querySelectorAll(".fa").forEach(b => b.onclick = () => { pick = results[Number(b.dataset.i)]; step = "code"; err = ""; draw(); });
  on("back", () => { step = "search"; err = ""; draw(); });
  on("ok", async () => {
    const c = $("cd").value.replace(/\D/g, "");
    if (c.length !== 4) { err = "Type the last 4 digits."; draw(); return; }
    $("ok").textContent = "Please wait..."; $("ok").disabled = true;
    try { const d = await call("/mad/view", { id: pick.id, code: c }); step = "view"; err = ""; draw(d); window.scrollTo(0, 0); }
    catch (e) { err = e.message; draw(); }
  });
  on("done", () => { step = "search"; results = []; pick = null; err = ""; draw(); });
}
draw();
</script></body></html>
