<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My wallet | Sirajul Ummah Islamic Institute</title>
<link rel="icon" href="logo.svg">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
:root{--night:#12163a;--deep:#1c2150;--lamp:#f5b94a;--mist:#eef0f8;--ink:#171a33;--line:#cfd3e8}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--mist)}
header{background:var(--night);color:#fff;padding:18px clamp(18px,5vw,64px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header a{color:#fff;text-decoration:none;font-weight:700}
button{padding:10px 18px;border:0;border-radius:8px;background:var(--lamp);color:var(--night);font:700 1rem Figtree,sans-serif;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:40px clamp(18px,5vw,40px)}
h1{font-family:Amiri,serif;font-size:2.2rem;margin:0 0 24px}
h2{font-family:Amiri,serif;font-size:1.6rem;margin:0 0 6px}
.coins{background:radial-gradient(circle at 85% 30%,rgba(245,185,74,.45),transparent 50%),var(--night);color:#fff;border-radius:14px;padding:30px;margin-bottom:28px}
.coins b{display:block;font-family:Amiri,serif;font-size:4.5rem;line-height:1;color:var(--lamp)}
.buy{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:28px}
.buy p{margin:0 0 16px;color:#4b5072}
.chooser{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.chooser select{flex:1 1 160px;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--mist);color:var(--ink);font:500 1.1rem Figtree,sans-serif}
.price{flex:1 1 120px;display:flex;align-items:center;justify-content:center;border:2px solid var(--lamp);border-radius:8px;padding:12px 14px;font:700 1.5rem Figtree,sans-serif;background:#fff}
#pay{margin-top:14px;width:100%;padding:14px}
#msg{margin:14px 0 0;font-weight:500}
dl{margin:0;border-top:2px solid var(--line)}
dl div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
dt{color:#4b5072}dd{margin:0;font-weight:500;text-align:right}
#load{padding:40px;text-align:center}
</style>
</head>
<body>
<header><a href="index.html" style="display:flex;align-items:center;gap:10px"><img src="logo.svg" alt="" width="36" height="36"><span style="display:block;line-height:1.25"><span dir="rtl" lang="ar" style="display:block;font-family:Amiri,serif;font-size:1.15em">معهد سراج الأمة الإسلامية</span>Sirajul Ummah Islamic Institute</span></a><div><a href="courses.html" style="margin-right:16px">Courses</a><button id="out" type="button">Log out</button></div></header>
<main id="app"><div id="load">Loading your wallet...</div></main>
<script type="module">
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";

const PAYSTACK_PUBLIC_KEY = "pk_test_f004927fe211194d074b709728d8114c558131ff"; // public key only. Never put the secret key here.
const const NAIRA_PER_10_COINS = 1300;;
const MIN_COINS = 10, MAX_COINS = 1000, STEP = 10; // list: 10, 20, 30 ... 1000

function coinOptions() {
  let html = "";
  for (let c = MIN_COINS; c <= MAX_COINS; c += STEP) html += `<option value="${c}">${c} coins</option>`;
  return html;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("out").onclick = async () => { await signOut(auth); location.href = "login.html"; };

function buyCoins(user, usd) {
  const msg = document.getElementById("msg");
  if (!window.PaystackPop) { msg.textContent = "Payment system did not load. Check your internet and refresh."; return; }
  const handler = PaystackPop.setup({
    key: PAYSTACK_PUBLIC_KEY,
    email: user.email,
    amount: naira * 100,
    currency: "NGN",
    ref: "coin_" + user.uid.slice(0, 8) + "_" + Date.now(),
    metadata: { uid: user.uid },
    callback: () => {
      // Coins are added by the server after Paystack confirms. Never here.
      msg.textContent = "Payment received. Your " + (naira * COINS_PER_NGN) + " coins will appear in a few seconds.";
    },
    onClose: () => {}
  });
  handler.openIframe();
}

function renderInfo(user, d) {
  return `
    <div><dt>Email</dt><dd>${esc(user.email)}</dd></div>
    <div><dt>Phone</dt><dd>${esc(d.phone || "Not added")}</dd></div>
    <div><dt>Country</dt><dd>${esc(d.country || "Not added")}</dd></div>
    <div><dt>Qur'an and Islamic</dt><dd>${esc(d.madrasah ? [d.madrasah.quran, d.madrasah.level, (d.madrasah.tracks||[]).join(", ")].filter(Boolean).join(" · ") : "Not joined")}</dd></div>
    <div><dt>Western studies</dt><dd>${esc(d.western ? [d.western.level, d.western.track].filter(Boolean).join(" · ") : "Not joined")}</dd></div>
    <div><dt>Technology</dt><dd>${esc(d.technology ? [d.technology.level, (d.technology.areas||[]).join(", ")].filter(Boolean).join(" · ") : "Not joined")}</dd></div>`;
}

onAuthStateChanged(auth, user => {
  if (!user) return location.href = "login.html";
  const app = document.getElementById("app");

  // Page layout is drawn once so the buy buttons keep working
  app.innerHTML = `<h1 id="hello">Assalamu alaikum</h1>
    <div class="coins"><span>My coins</span><b id="bal">0</b></div>
    <section class="buy">
      <h2>Buy coins</h2>
      <p>10 coins = $1. Coins are added automatically after payment.</p>
      <div class="chooser">
        <select id="coinSelect" aria-label="Number of coins">${coinOptions()}</select>
        <div class="price" id="price">$1</div>
      </div>
      <button type="button" id="pay">Buy coins</button>
      <p id="msg" role="status"></p>
    </section>
    <dl id="info"></dl>`;

  const sel = document.getElementById("coinSelect");
  const priceBox = document.getElementById("price");
  const showPrice = () => { priceBox.textContent = "$" + (Number(sel.value) / COINS_PER_USD); };
  sel.onchange = showPrice;
  showPrice();
  document.getElementById("pay").onclick = () => buyCoins(user, Number(sel.value) / COINS_PER_USD);

  // Live updates: the balance changes the moment the server adds coins
  onSnapshot(doc(db, "students", user.uid), snap => {
    const d = snap.exists() ? snap.data() : {};
    document.getElementById("hello").textContent = "Assalamu alaikum, " + (d.name || user.displayName || "student");
    document.getElementById("bal").textContent = d.coins ?? 0;
    document.getElementById("info").innerHTML = renderInfo(user, d);
  }, err => {
    console.error(err);
    app.innerHTML = `<p>Could not load your wallet (${esc(err.code || err.message)}). Check your Firestore rules and try again.</p>`;
  });
});
</script>
</body>
</html>
