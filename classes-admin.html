<!DOCTYPE html>
<html lang="en"><head>
<!-- sec-v1 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://www.recaptcha.net https://js.paystack.co https://checkout.flutterwave.com https://meet.jit.si https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://www.google.com https://www.recaptcha.net https://*.googleapis.com https://www.gstatic.com https://*.workers.dev https://api.alquran.cloud https://cdn.mp3quran.net https://archive.org https://*.archive.org https://*.flutterwave.com https://api.paystack.co https://meet.jit.si wss://meet.jit.si; frame-src https://www.google.com https://www.recaptcha.net https://www.youtube-nocookie.com https://drive.google.com https://meet.jit.si https://checkout.flutterwave.com https://checkout.paystack.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">

<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classes and Timetable (admin) | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.ca{max-width:960px}
.cd{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.cd h2{margin:0 0 6px;font-size:1.15rem}
.cd label{display:block;font-size:.85rem;font-weight:700;margin:8px 0 3px}
.cd input,.cd select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rw{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:8px}
.g3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.rw.sub{grid-template-columns:1.2fr 1.2fr 1fr 1.4fr auto;align-items:end}
.rw.slot{grid-template-columns:repeat(4,1fr);align-items:end}
.rw label{margin:0 0 2px;font-size:.74rem}
.hint{color:#555;font-size:.88rem;margin:2px 0 8px}
.b{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:var(--night);color:#fff;cursor:pointer}
.b.sm{padding:8px 12px;font-size:.85rem;background:#fff;color:var(--night);border:1.5px solid var(--line)}
.b.rm{padding:8px 12px;font-size:.85rem;background:#fff;color:#b3261e;border:1.5px solid #e8c4c1}
.ok{color:#1c7a4d;font-weight:500}.er{color:#b3261e;font-weight:500}
.bar{position:sticky;bottom:0;background:#fff;border-top:1.5px solid var(--line);padding:10px 0;margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}.rw.sub,.rw.slot{grid-template-columns:1fr 1fr}.rw .full{grid-column:1/-1}}
</style></head><body>
<main class="page ca" id="app"><p>Checking access...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
// same section keys and class names that students choose (students/{uid}.classes.islamic / western / tech)
const BC = {
  islamic: ["Rawdatul Atfal 1", "Rawdatul Atfal 2", "Ibtidai 1", "Ibtidai 2", "Ibtidai 3", "I'dadi 1", "I'dadi 2", "I'dadi 3", "Thanawi 1", "Thanawi 2", "Thanawi 3"],
  western: ["Kindergarten (KG)", "Primary 1", "Primary 2", "Primary 3", "Primary 4", "Primary 5", "Primary 6", "JSS 1", "JSS 2", "JSS 3", "SSS 1", "SSS 2", "SSS 3"],
  tech: ["Beginner", "Intermediate", "Advanced"]
};
const SN = { islamic: "Arabic and Islamic", western: "Western", tech: "Technology" };
const DAYS = [[1, "Monday"], [2, "Tuesday"], [3, "Wednesday"], [4, "Thursday"], [5, "Friday"], [6, "Saturday"], [0, "Sunday"]];
const planId = (sec, lvl) => sec + "__" + lvl.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
const TZS = (() => { let l = []; try { l = Intl.supportedValuesOf("timeZone"); } catch (e) {} if (!l.length) l = ["Africa/Lagos", "Africa/Accra", "Africa/Cairo", "Africa/Johannesburg", "Africa/Nairobi", "Europe/London", "Europe/Paris", "Asia/Riyadh", "Asia/Dubai", "Asia/Karachi", "Asia/Kolkata", "Asia/Kuala_Lumpur", "America/New_York", "America/Chicago", "America/Los_Angeles", "America/Toronto", "Australia/Sydney"]; if (!l.includes("UTC")) l.push("UTC"); return l; })();
const offLabel = tz => { try { const p = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "longOffset" }).formatToParts(new Date()).find(x => x.type === "timeZoneName"); return (p ? p.value : "").replace("GMT", "UTC") || "UTC"; } catch (e) { return ""; } };
const tzOpts = cur => TZS.map(z => `<option value="${esc(z)}"${z === cur ? " selected" : ""}>${esc(z.replace(/_/g, " "))} (${esc(offLabel(z))})</option>`).join("");
let lastTerm = {}; try { lastTerm = JSON.parse(localStorage.getItem("lastTerm") || "{}"); } catch (e) {}
function blank() { return { subjects: [], slots: [], tzId: "Africa/Lagos", term: { name: lastTerm.name || "", start: lastTerm.start || "", end: lastTerm.end || "" } }; }

let sec = "islamic", lvl = BC.islamic[0], books = [], plan = blank();

onAuthStateChanged(auth, async u => {
  if (!u) return $("app").innerHTML = '<h1>Classes and Timetable</h1><p>Please <a href="login.html">log in</a> first.</p>';
  let ok = false;
  try { ok = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch (e) {}
  if (!ok) return $("app").innerHTML = "<h1>Classes and Timetable</h1><p>You do not have access to this page.</p>";
  try { await loadBooks(); await loadPlan(); draw(); }
  catch (e) { $("app").innerHTML = '<h1>Classes and Timetable</h1><p class="er">Could not load: ' + esc(e.code || e.message) + "</p>"; }
});

async function loadBooks() {
  const s = await getDocs(query(collection(db, "courses"), where("kind", "==", "book")));
  books = s.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function loadPlan() {
  const s = await getDoc(doc(db, "classPlans", planId(sec, lvl)));
  plan = blank();
  if (s.exists()) { const d = s.data(); plan = { subjects: d.subjects || [], slots: d.slots || [], tzId: d.tzId || "Africa/Lagos", term: Object.assign({ name: "", start: "", end: "" }, d.term || {}) }; }
}
const bookOpts = cur => `<option value="">No book yet</option>` + books
  .slice().sort((a, b) => (a.section === sec ? 0 : 1) - (b.section === sec ? 0 : 1) || String(a.title).localeCompare(String(b.title)))
  .map(b => `<option value="${esc(b.id)}"${b.id === cur ? " selected" : ""}>${esc(b.title || b.id)} (${esc(b.section || "?")} · ${esc(b.level || "?")})</option>`).join("");

function draw(msg, good) {
  const subOpts = cur => `<option value="">Choose subject</option>` + plan.subjects.filter(s => s.name).map(s => `<option${s.name === cur ? " selected" : ""}>${esc(s.name)}</option>`).join("");
  let h = `<h1>Classes and Timetable · الفصول والجدول</h1>
  <p class="hint">Fill in each class by hand. Students see the subjects on their <b>Subjects</b> page and the times on their <b>Timetable</b> page. Pick a section and a class, edit, then tap Save. Do each class one at a time.</p>
  <div class="cd"><div class="g2">
    <div><label>Section</label><select id="sec">${Object.keys(BC).map(k => `<option value="${k}"${k === sec ? " selected" : ""}>${SN[k]}</option>`).join("")}</select></div>
    <div><label>Class</label><select id="lvl">${BC[sec].map(l => `<option${l === lvl ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></div>
  </div></div>
  <div class="cd"><h2>Subjects · المواد</h2><p class="hint">The subjects of this class. The book is optional: choose one of the books already in the library.</p>`;
  plan.subjects.forEach((s, i) => {
    h += `<div class="rw sub">
      <div><label>Subject name</label><input data-k="subjects.${i}.name" value="${esc(s.name)}" placeholder="Qur'an"></div>
      <div><label>Arabic name (optional)</label><input data-k="subjects.${i}.nameAr" dir="rtl" value="${esc(s.nameAr)}" placeholder="القرآن الكريم"></div>
      <div><label>Teacher (optional)</label><input data-k="subjects.${i}.teacher" value="${esc(s.teacher)}"></div>
      <div><label>Book</label><select data-k="subjects.${i}.bookId">${bookOpts(s.bookId)}</select></div>
      <div><button class="b rm" type="button" data-rm="subjects.${i}">Remove</button></div></div>`;
  });
  h += `<p><button class="b sm" type="button" id="addSub">+ Add subject</button></p></div>
  <div class="cd"><h2>Timetable · الجدول</h2><p class="hint">The timetable is for one <b>term</b>. Give the term a name and its start and end dates. Each lesson row below is repeated every week until the term ends. Use 24-hour times (for example 16:30). Next term, change the term and the lessons, then Save.</p>
    <div class="g3">
      <div><label>Term name</label><input id="tn" value="${esc(plan.term.name)}" placeholder="First Term 2026/2027"></div>
      <div><label>Term starts</label><input id="ts" type="date" value="${esc(plan.term.start)}"></div>
      <div><label>Term ends</label><input id="te" type="date" value="${esc(plan.term.end)}"></div>
    </div>
    <label>Time zone of this class (country time)</label><select id="tz">${tzOpts(plan.tzId)}</select>
    <p class="hint">Pick the city or country whose time you are using. Students see the time in this zone and also in their own local time. If one lesson uses a different country's time, change it on that lesson.</p>`;
  plan.slots.forEach((s, i) => {
    h += `<div class="rw slot">
      <div><label>Day</label><select data-k="slots.${i}.day">${DAYS.map(([v, n]) => `<option value="${v}"${Number(s.day) === v ? " selected" : ""}>${n}</option>`).join("")}</select></div>
      <div><label>From</label><input type="time" data-k="slots.${i}.start" value="${esc(s.start)}"></div>
      <div><label>To</label><input type="time" data-k="slots.${i}.end" value="${esc(s.end)}"></div>
      <div><label>Subject</label><select data-k="slots.${i}.subject">${subOpts(s.subject)}</select></div>
      <div><label>Teacher</label><input data-k="slots.${i}.teacher" value="${esc(s.teacher)}"></div>
      <div><label>Class link (Zoom, Meet...)</label><input data-k="slots.${i}.where" value="${esc(s.where)}" placeholder="https://..."></div>
      <div><label>Time zone of this lesson</label><select data-k="slots.${i}.tz"><option value="">Same as class</option>${tzOpts(s.tz)}</select></div>
      <div><button class="b rm" type="button" data-rm="slots.${i}">Remove</button></div></div>`;
  });
  h += `<p><button class="b sm" type="button" id="addSlot">+ Add lesson time</button></p></div>
  <div class="cd"><h2>Copy from another class</h2><p class="hint">Saves time: copy the subjects and times of another class into this one, then change what is different. Nothing is saved until you tap Save.</p>
    <div class="g2"><div><label>Section</label><select id="csec">${Object.keys(BC).map(k => `<option value="${k}">${SN[k]}</option>`).join("")}</select></div><div><label>Class</label><select id="clvl">${BC.islamic.map(l => `<option>${esc(l)}</option>`).join("")}</select></div></div>
    <p><button class="b sm" type="button" id="cp">Copy into this class</button></p></div>
  <div class="bar"><button class="b" type="button" id="sv">Save ${esc(lvl)}</button><span id="sm" class="${good ? "ok" : "er"}">${esc(msg || "")}</span></div>`;
  $("app").innerHTML = h;
  $("sec").onchange = async e => { sec = e.target.value; lvl = BC[sec][0]; await loadPlan(); draw(); };
  $("lvl").onchange = async e => { lvl = e.target.value; await loadPlan(); draw(); };
  $("tz").onchange = e => { plan.tzId = e.target.value; };
  [["tn", "name"], ["ts", "start"], ["te", "end"]].forEach(([id, k]) => $(id).oninput = e => { plan.term[k] = e.target.value; });
  $("addSub").onclick = () => { plan.subjects.push({ name: "", nameAr: "", teacher: "", bookId: "" }); draw(); };
  $("addSlot").onclick = () => { plan.slots.push({ day: 1, start: "", end: "", subject: "", teacher: "", where: "", tz: "" }); draw(); };
  $("app").querySelectorAll("[data-k]").forEach(el => el.oninput = el.onchange = () => {
    const [arr, i, f] = el.dataset.k.split("."); plan[arr][+i][f] = el.value;
  });
  // changing a subject's name should refresh the subject lists in the timetable
  $("app").querySelectorAll('[data-k$=".name"]').forEach(el => el.onchange = () => { const [, i] = el.dataset.k.split("."); plan.subjects[+i].name = el.value; draw(); });
  $("app").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { const [arr, i] = b.dataset.rm.split("."); plan[arr].splice(+i, 1); draw(); });
  $("csec").onchange = e => { $("clvl").innerHTML = BC[e.target.value].map(l => `<option>${esc(l)}</option>`).join(""); };
  $("cp").onclick = copyPlan;
  $("sv").onclick = save;
}

async function copyPlan() {
  const s2 = $("csec").value, l2 = $("clvl").value;
  if (planId(s2, l2) === planId(sec, lvl)) return draw("That is the same class.", false);
  try {
    const s = await getDoc(doc(db, "classPlans", planId(s2, l2)));
    if (!s.exists()) return draw("That class has nothing saved yet.", false);
    const d = s.data();
    plan.subjects = JSON.parse(JSON.stringify(d.subjects || []));
    plan.slots = JSON.parse(JSON.stringify(d.slots || []));
    plan.tzId = d.tzId || plan.tzId;
    draw("Copied from " + l2 + ". Check it, then tap Save.", true);
  } catch (e) { draw("Could not copy: " + (e.code || e.message), false); }
}

async function save() {
  $("sv").disabled = true;
  const subjects = plan.subjects.filter(s => String(s.name || "").trim()).map(s => ({
    name: String(s.name).trim(), nameAr: String(s.nameAr || "").trim(), teacher: String(s.teacher || "").trim(), bookId: s.bookId || ""
  }));
  const slots = plan.slots.filter(s => s.start && s.end && s.subject).map(s => ({
    day: Number(s.day), start: s.start, end: s.end, subject: s.subject, teacher: String(s.teacher || "").trim(), where: String(s.where || "").trim(), tz: s.tz || ""
  }));
  const dropped = plan.slots.length - slots.length;
  const term = { name: String(plan.term.name || "").trim(), start: plan.term.start || "", end: plan.term.end || "" };
  if (!term.name) { $("sv").disabled = false; return draw("Please give the term a name (for example First Term 2026/2027).", false); }
  if (term.start && term.end && term.end < term.start) { $("sv").disabled = false; return draw("The term end date is before the start date.", false); }
  try {
    await setDoc(doc(db, "classPlans", planId(sec, lvl)), { section: sec, level: lvl, subjects, slots, tzId: plan.tzId || "Africa/Lagos", term, updatedAt: serverTimestamp() });
    plan.subjects = subjects; plan.slots = slots; plan.term = term;
    try { localStorage.setItem("lastTerm", JSON.stringify(term)); } catch (e) {}
    draw("Saved." + (dropped > 0 ? " " + dropped + " lesson row(s) were left out because the time or subject was empty." : ""), true);
  } catch (e) { $("sv").disabled = false; $("sm").textContent = "Failed: " + (e.code || e.message); $("sm").className = "er"; }
}
</script>
</body></html>
