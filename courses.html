<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.pg{max-width:1000px}
.bal{display:inline-block;background:var(--night);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;margin-bottom:14px}
.bal b{color:var(--lamp)}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tb button{font:inherit;padding:8px 16px;border:1.5px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}
.tb button.on{background:var(--night);color:#fff;border-color:var(--night)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cc{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.cc h3{font-family:Amiri,serif;font-size:1.5rem;margin:0}
.cc small{color:#8a5a00;font-weight:700}
.cc p{margin:0;color:#4b5072;flex:1}
.cc .pr{font-weight:700}
.cc button,.cc .btn{font:inherit;font-weight:700;padding:10px;border:0;border-radius:10px;background:var(--night);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
.cc .btn{background:var(--lamp);color:var(--night)!important}
.cc button:disabled{opacity:.55;cursor:not-allowed}
</style></head><body>
<main class="page pg">
<h1>Courses</h1>
<p class="lead">Unlock a course with coins and learn at your own pace.</p>
<div class="bal">Your coins: <b id="coins">...</b></div>
<div class="tb" id="tabs"></div>
<div class="grid" id="list"><p>Loading courses...</p></div>
</main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const TABS = [["all", "All"], ["islamic", "Qur'an and Islamic"], ["western", "Western studies"], ["tech", "Technology"], ["mine", "My courses"]];
let user, coins = 0, courses = [], mine = new Set(), tab = "all";

onAuthStateChanged(auth, u => { if (u) { user = u; load(); } });

async function load() {
  try {
    const [cs, es, st] = await Promise.all([
      getDocs(query(collection(db, "courses"), where("published", "==", true))),
      getDocs(query(collection(db, "enrollments"), where("uid", "==", user.uid))),
      getDoc(doc(db, "students", user.uid))
    ]);
    courses = cs.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
    mine = new Set(es.docs.map(d => d.data().courseId));
    coins = st.exists() ? (st.data().coins || 0) : 0;
    draw();
  } catch (e) { console.error(e); $("list").innerHTML = `<p>Could not load courses (${esc(e.code || e.message)}).</p>`; }
}

function draw() {
  $("coins").textContent = coins;
  $("tabs").innerHTML = TABS.map(t => `<button type="button" data-t="${t[0]}" class="${t[0] === tab ? "on" : ""}">${t[1]}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
  const r = courses.filter(c => tab === "all" || (tab === "mine" ? mine.has(c.id) : c.section === tab));
  if (!r.length) { $("list").innerHTML = `<p>${tab === "mine" ? "You have not unlocked any course yet." : "No courses here yet. Please check back soon."}</p>`; return; }
  $("list").innerHTML = r.map(c => {
    const p = Number(c.price) || 0, own = mine.has(c.id);
    return `<div class="cc"><small>${esc(c.level || "")}</small><h3>${esc(c.title)}</h3><p>${esc(c.description || "")}</p>
      <div class="pr">${p ? p + " coins" : "Free"}</div>
      ${own ? `<a class="btn" href="course.html?id=${encodeURIComponent(c.id)}">Open course</a>`
        : `<button type="button" data-u="${esc(c.id)}" ${coins < p ? "disabled" : ""}>${p ? (coins < p ? "Not enough coins" : "Unlock for " + p + " coins") : "Join for free"}</button>`}</div>`;
  }).join("");
  $("list").querySelectorAll("[data-u]").forEach(b => b.onclick = () => unlock(b.dataset.u, b));
}

async function unlock(id, btn) {
  const c = courses.find(x => x.id === id), p = Number(c.price) || 0;
  if (coins < p) return alert("You do not have enough coins.");
  if (!confirm(p ? `Unlock "${c.title}" for ${p} coins?` : `Join "${c.title}" for free?`)) return;
  btn.disabled = true; btn.textContent = "Please wait...";
  try {
    const b = writeBatch(db);
    b.update(doc(db, "students", user.uid), { coins: coins - p, lastPurchase: id });
    b.set(doc(db, "enrollments", user.uid + "_" + id), { uid: user.uid, courseId: id, createdAt: serverTimestamp() });
    await b.commit();
    location.href = "course.html?id=" + encodeURIComponent(id);
  } catch (e) {
    console.error(e);
    alert("Could not unlock this course. Refresh the page and try again. (" + (e.code || e.message) + ")");
    load();
  }
}
</script>
</body></html>
