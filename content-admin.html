<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Website content | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><link rel="stylesheet" href="pub.css?v=1"><script src="site.js" defer></script>
<style>
.ca{max-width:860px}
.ca label{display:block;font-weight:700;margin:12px 0 4px}
.ca input[type=text],.ca input[type=number],.ca textarea{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px;border:1.5px solid var(--line,#cfe0d6);border-radius:10px;background:#fff;color:inherit}
.ca textarea{min-height:110px}
.ca .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ca button.p{font:inherit;font-weight:800;padding:12px 20px;border-radius:10px;border:0;background:#f0be4d;color:#0b3a2b;cursor:pointer;min-height:44px}
.ca button.s{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line,#cfe0d6);background:#fff;color:inherit;cursor:pointer;min-height:44px}
.ca button.d{color:#b3261e}
.ca .it{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1.5px solid var(--line,#cfe0d6)}
.ca .it img{width:46px;height:46px;border-radius:50%;object-fit:cover;margin-right:10px;vertical-align:middle}
.ca .ok{color:#17623a;font-weight:700}.ca .er{color:#b3261e;font-weight:700}
.ca .hint{color:#4b5a53;font-size:.88rem;margin:4px 0 0}
</style></head><body>
<main class="page ca" id="app"><h1>Website content</h1><p>Loading...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, getDocs, getDoc, doc, addDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const TABS = {
  faculty: { title: "Teachers", col: "faculty", add: "Add a teacher", name: r => r.name, fields: [
    ["name", "Name", "text", 1], ["role", "Role (for example: Qur'an teacher)", "text"], ["subjects", "Subjects they teach (separate with commas)", "list"],
    ["bio", "Short biography (optional)", "area"], ["order", "Order on the page (1 shows first)", "num"], ["photo", "Photo (optional)", "photo"]] },
  testimonials: { title: "Student stories", col: "testimonials", add: "Add a story", name: r => r.name, fields: [
    ["name", "Name of the student or parent", "text", 1], ["role", "Where they are from (optional)", "text"], ["text", "What they said (use their real words, with their permission)", "area", 1], ["order", "Order on the page (1 shows first)", "num"]] },
  articles: { title: "Articles", col: "articles", add: "Write an article", name: r => r.title, fields: [
    ["title", "Title", "text", 1], ["author", "Written by", "text"], ["body", "Article", "area", 1], ["published", "Show it on the website", "bool"]] }
};
let tab = "faculty", rows = [], editId = null, msg = "";
const SOC = [["facebook", "Facebook page link"], ["youtube", "YouTube channel link"], ["whatsapp", "WhatsApp link (for example https://wa.me/234...)"], ["instagram", "Instagram link"], ["x", "X (Twitter) link"], ["telegram", "Telegram link"]];

onAuthStateChanged(auth, async u => {
  if (!u) return $("app").innerHTML = '<h1>Website content</h1><p>Please <a href="login.html">log in</a> first.</p>';
  let ok = false;
  try { ok = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch (e) {}
  if (!ok) return $("app").innerHTML = '<h1>Website content</h1><p>This page is for the admin only.</p>';
  show("faculty");
});

async function show(t) {
  tab = t; editId = null; msg = "";
  if (t !== "site") { try { rows = (await getDocs(collection(db, TABS[t].col))).docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) { rows = []; msg = "Could not load: " + (e.code || e.message); } }
  draw();
}

function draw() {
  let h = `<h1>Website content<small style="display:block;font:500 .5em Figtree,sans-serif;color:#4b5a53">Teachers, student stories, articles and site details shown on the public pages</small></h1>
  <div class="tabs2">${Object.entries(TABS).map(([k, v]) => `<button type="button" data-t="${k}" class="${tab === k ? "on" : ""}">${v.title}</button>`).join("")}<button type="button" data-t="site" class="${tab === "site" ? "on" : ""}">Vision, about &amp; social links</button></div>`;
  h += `<p id="mm" class="${/^Could|Error/.test(msg) ? "er" : "ok"}">${esc(msg)}</p><div id="body"></div>`;
  $("app").innerHTML = h;
  $("app").querySelectorAll("[data-t]").forEach(b => b.onclick = () => show(b.dataset.t));
  if (tab === "site") return drawSite();
  const T = TABS[tab];
  const cur = editId ? rows.find(r => r.id === editId) : null;
  let f = `<div class="cdp"><h3>${cur ? "Edit" : T.add}</h3><form id="fm">`;
  T.fields.forEach(([k, l, ty, req]) => {
    const v = cur ? cur[k] : "";
    if (ty === "area") f += `<label for="f_${k}">${l}</label><textarea id="f_${k}" ${req ? "required" : ""}>${esc(v)}</textarea>`;
    else if (ty === "bool") f += `<label><input type="checkbox" id="f_${k}" ${(!cur || cur[k] !== false) ? "checked" : ""}> ${l}</label>`;
    else if (ty === "photo") f += `<label for="f_${k}">${l}</label><input type="file" id="f_${k}" accept="image/*"><p class="hint">${cur && cur.photo ? "A photo is saved. Choose another to replace it." : "A square photo of the face works best."}</p>`;
    else if (ty === "list") f += `<label for="f_${k}">${l}</label><input type="text" id="f_${k}" value="${esc((v || []).join ? (v || []).join(", ") : v)}">`;
    else f += `<label for="f_${k}">${l}</label><input type="${ty === "num" ? "number" : "text"}" id="f_${k}" value="${esc(v)}" ${req ? "required" : ""}>`;
  });
  f += `<div class="row"><button class="p" type="submit">${cur ? "Save changes" : "Save"}</button>${cur ? '<button class="s" type="button" id="cn">Cancel</button>' : ""}</div></form></div>`;
  f += `<h2 style="margin-top:26px">Saved (${rows.length})</h2>` + (rows.length ? rows.sort((a, b) => (Number(a.order) || 999) - (Number(b.order) || 999)).map(r =>
    `<div class="it"><span>${r.photo ? `<img src="${esc(r.photo)}" alt="">` : ""}<b>${esc(T.name(r))}</b>${tab === "articles" && r.published === false ? " (hidden)" : ""}</span><span><button class="s" data-e="${r.id}">Edit</button> <button class="s d" data-x="${r.id}">Delete</button></span></div>`).join("") : '<p class="hint">Nothing saved yet.</p>');
  $("body").innerHTML = f;
  $("fm").onsubmit = save;
  if ($("cn")) $("cn").onclick = () => { editId = null; draw(); };
  $("body").querySelectorAll("[data-e]").forEach(b => b.onclick = () => { editId = b.dataset.e; msg = ""; draw(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  $("body").querySelectorAll("[data-x]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this for good?")) return;
    try { await deleteDoc(doc(db, T.col, b.dataset.x)); msg = "Deleted."; await show(tab); $("mm").textContent = "Deleted."; $("mm").className = "ok"; } catch (e) { say("Error: " + (e.code || e.message)); }
  });
}
function say(t) { $("mm").textContent = t; $("mm").className = /^Could|Error/.test(t) ? "er" : "ok"; }

// Shrink a chosen photo to 320 px so it stays small
function shrink(file) {
  return new Promise((res, rej) => {
    const im = new Image(), r = new FileReader();
    r.onload = () => { im.onload = () => {
      const s = 320, c = document.createElement("canvas"); c.width = c.height = s;
      const m = Math.min(im.width, im.height), sx = (im.width - m) / 2, sy = (im.height - m) / 2;
      c.getContext("2d").drawImage(im, sx, sy, m, m, 0, 0, s, s);
      res(c.toDataURL("image/jpeg", 0.82)); }; im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

async function save(e) {
  e.preventDefault();
  const T = TABS[tab], cur = editId ? rows.find(r => r.id === editId) : null, o = {};
  try {
    for (const [k, , ty] of T.fields) {
      const el = $("f_" + k);
      if (ty === "bool") o[k] = el.checked;
      else if (ty === "num") o[k] = el.value === "" ? 999 : Number(el.value);
      else if (ty === "list") o[k] = el.value.split(",").map(x => x.trim()).filter(Boolean);
      else if (ty === "photo") { if (el.files[0]) o[k] = await shrink(el.files[0]); else if (cur && cur.photo) o[k] = cur.photo; }
      else o[k] = el.value.trim();
    }
    if (tab === "articles") o.createdAt = cur && cur.createdAt ? cur.createdAt : serverTimestamp();
    if (cur) await setDoc(doc(db, T.col, cur.id), o); else await addDoc(collection(db, T.col), o);
    await show(tab); say("Saved. It is now on the website.");
  } catch (err) { say("Error: " + (err.code || err.message)); }
}

async function drawSite() {
  let s = {};
  try { const d = await getDoc(doc(db, "publicInfo", "site")); if (d.exists()) s = d.data(); } catch (e) {}
  const ta = (k, l) => `<label for="s_${k}">${l}</label><textarea id="s_${k}">${esc(s[k] || "")}</textarea>`;
  $("body").innerHTML = `<form id="sf" class="cdp"><h3>Vision, mission and about</h3><p class="hint">Shown on the Vision &amp; Mission page. Leave a box empty to hide it.</p>
    ${ta("vision", "Our vision")}${ta("mission", "Our mission")}${ta("values", "Our values")}${ta("profile", "About the institute (a short profile)")}
    <h3 style="margin-top:22px">Social links in the footer</h3><p class="hint">Paste the full link starting with https://. Leave empty to hide.</p>
    ${SOC.map(([k, l]) => `<label for="s_${k}">${l}</label><input type="text" id="s_${k}" value="${esc(s[k] || "")}" inputmode="url">`).join("")}
    <div class="row"><button class="p" type="submit">Save</button></div></form>`;
  $("sf").onsubmit = async e => {
    e.preventDefault();
    const o = {};
    for (const k of ["vision", "mission", "values", "profile"]) o[k] = $("s_" + k).value.trim();
    for (const [k] of SOC) { const v = $("s_" + k).value.trim(); if (v && !/^https:\/\//i.test(v)) return say("Error: the " + k + " link must start with https://"); o[k] = v; }
    try { await setDoc(doc(db, "publicInfo", "site"), o); say("Saved."); } catch (err) { say("Error: " + (err.code || err.message)); }
  };
}
</script>
</body></html>
