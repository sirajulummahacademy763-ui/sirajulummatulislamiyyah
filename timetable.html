<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Timetable | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.tt{max-width:960px}
.tt h1 small{font-family:Figtree,sans-serif;font-size:.42em;font-weight:500;color:#cfe0d6;display:block}
.lk{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.lk a{font-weight:700;text-decoration:none;color:var(--night);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px}
.lk a:hover{background:#fff4dc;border-color:#f0be4d}
.md{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.md button{font:inherit;font-weight:700;padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--night);cursor:pointer}
.md button.on{background:var(--night);color:#fff;border-color:var(--night)}
.dp{background:#fff;border:1.5px solid var(--line);border-top:5px solid #f0be4d;border-radius:18px;box-shadow:var(--sh);margin:0 0 22px;overflow:hidden}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,var(--night),var(--deep));color:#fff;padding:16px 18px}
main.page .dh h2{margin:0;color:#fff;font-size:1.35rem}
.dh .sec{margin:2px 0 0;color:#ffe9a6;font-size:.9rem}
.dh .ar{font-family:Amiri,serif;font-size:1.6rem;color:#f0be4d;line-height:1.2}
.dp .bd{padding:6px 16px 16px}
.nt{color:#4b6358;font-size:.85rem;margin:12px 0 4px}
.dy{border:1.5px solid var(--line);border-radius:14px;margin:12px 0 0;overflow:hidden}
.dy>h3{margin:0;padding:10px 14px;background:#eef6f1;font-size:1rem;color:var(--night);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dy>h3 span{font-family:Amiri,serif;color:#9a6b10;font-size:1.15rem}
.dy.today{border-color:#f0be4d;box-shadow:0 0 0 3px rgba(240,190,77,.35)}
.dy.today>h3{background:linear-gradient(#ffe08a,#f0be4d)}
.dy.today>h3::after{content:"Today";margin-left:auto;font-size:.72rem;font-weight:800;background:var(--night);color:#ffe9a6;border-radius:999px;padding:3px 11px}
.sl{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.sl .tm{flex:none;min-width:150px;font-weight:700;color:var(--night);background:#fff4dc;border-radius:10px;padding:7px 10px;text-align:center;font-size:.92rem}
.sl .tx{flex:1;min-width:150px}
.sl .tx b{font-size:1.02rem;color:var(--night)}
.sl small{color:#4b6358;display:block;margin-top:2px}
.jn{display:inline-block;font-weight:800;font-size:.92rem;text-decoration:none;background:linear-gradient(#ffe08a,#f0be4d);color:var(--night);border-radius:10px;padding:10px 16px;white-space:nowrap}
.tag{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:6px;background:#e3f1e9;color:#1e4a3b;vertical-align:middle}
.no{color:#555;margin:12px 0 0}
.er{color:#b3261e;font-weight:500}
.emp{background:#fff;border:1.5px dashed #f0be4d;border-radius:16px;padding:22px;text-align:center}
@media(max-width:520px){.sl{flex-direction:column;align-items:stretch;gap:8px}.sl .tm{min-width:0}.jn{text-align:center}}
</style></head><body>
<main class="page tt" id="app"><p>Loading...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const SECS = [["islamic", "Arabic and Islamic Studies", "العلوم العربية والإسلامية"], ["western", "Western Studies", "الدراسات الغربية"], ["tech", "Technology", "التقنية"]];
const DAYS = [[1, "Monday", "الاثنين"], [2, "Tuesday", "الثلاثاء"], [3, "Wednesday", "الأربعاء"], [4, "Thursday", "الخميس"], [5, "Friday", "الجمعة"], [6, "Saturday", "السبت"], [0, "Sunday", "الأحد"]];
const planId = (sec, lvl) => sec + "__" + lvl.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
const t12 = t => { const [h, m] = String(t || "").split(":").map(Number); if (isNaN(h)) return esc(t); return ((h % 12) || 12) + ":" + String(m || 0).padStart(2, "0") + " " + (h < 12 ? "AM" : "PM"); };
const mode = "online";   // the institute teaches online, so only online lessons are shown
let plans = [];

onAuthStateChanged(auth, async u => {
  if (!u) return $("app").innerHTML = '<h1>My Timetable</h1><p>Please <a href="login.html">log in</a> first.</p>';
  let classes = null, failed = "";
  try { const s = await getDoc(doc(db, "students", u.uid)); if (s.exists()) classes = s.data().classes || null; } catch (e) { failed = e.code || e.message; }
  if (classes) for (const [sec, name, ar] of SECS) {
    const lvl = classes[sec]; if (!lvl) continue;
    let p = null;
    try { const d = await getDoc(doc(db, "classPlans", planId(sec, lvl))); if (d.exists()) p = d.data(); } catch (e) {}
    plans.push({ sec, name, ar, lvl, p });
  }
  draw(!classes, failed);
});

function draw(noClasses, failed) {
  const today = new Date().getDay();
  let h = `<h1>الجدول · My Timetable<small>Your weekly lessons</small></h1>
    <div class="lk"><a href="subjects.html">📖 My subjects and books</a><a href="classroom.html">🎧 Classroom</a></div>`;
  if (failed) h += `<p class="er">Some data could not be loaded (${esc(failed)}). Please refresh.</p>`;
  if (noClasses) h += '<div class="emp"><p class="no" style="margin:0">You have not chosen your classes yet.</p><p style="margin:8px 0 0"><a href="index.html">Open the Home page</a> and choose them, then come back here.</p></div>';
  plans.forEach(({ name, ar, lvl, p }) => {
    const slots = ((p && p.slots) || []).filter(s => mode === "all" || (s.mode || "both") === "both" || s.mode === "online");
    let body = "";
    if (!slots.length) body = `<p class="no">${p && (p.slots || []).length ? "No online lessons yet." : "The timetable for this class will be added soon."}</p>`;
    else {
      if (p.tz) body += `<p class="nt">Times are in ${esc(p.tz)}.</p>`;
      DAYS.forEach(([d, en, a]) => {
        const ds = slots.filter(s => Number(s.day) === d).sort((x, y) => String(x.start).localeCompare(String(y.start)));
        if (!ds.length) return;
        body += `<div class="dy${d === today ? " today" : ""}"><h3>${en} · <span dir="rtl" lang="ar">${a}</span></h3>` + ds.map(s => {
          const w = String(s.where || "");
          const where = /^https?:\/\//i.test(w) ? `<a class="jn" href="${esc(w)}" target="_blank" rel="noopener">Join class</a>` : (w ? esc(w) : "");
          return `<div class="sl"><span class="tm">${t12(s.start)} – ${t12(s.end)}</span><span class="tx"><b>${esc(s.subject)}</b>` +
            `${s.teacher ? `<small>👤 ${esc(s.teacher)}</small>` : ""}${where && !/^https?:\/\//i.test(w) ? `<small>📍 ${where}</small>` : ""}</span>${where && /^https?:\/\//i.test(w) ? where : ""}</div>`;
        }).join("") + "</div>";
      });
    }
    h += `<section class="dp"><div class="dh"><div><h2>${esc(lvl)}</h2><p class="sec">${esc(name)}</p></div><div class="ar" dir="rtl" lang="ar">${ar}</div></div><div class="bd">${body}</div></section>`;
  });
  $("app").innerHTML = h;
}
</script>
</body></html>
