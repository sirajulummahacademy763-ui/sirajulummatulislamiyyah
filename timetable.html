<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Timetable | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.tt{max-width:900px}
.tt h1 small{font-family:Figtree,sans-serif;font-size:.5em;font-weight:500;color:#555;display:block}
.cd{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.cd h2{margin:0 0 2px;font-size:1.2rem}
.cd .sec{color:#555;font-size:.9rem;margin:0 0 10px}
.dy{border-top:1px solid var(--line);padding:10px 0}
.dy h3{margin:0 0 6px;font-size:1rem;color:#12163a}
.dy.today h3::after{content:"Today";margin-left:8px;font-size:.72rem;font-weight:700;background:#f5b94a;color:#12163a;border-radius:20px;padding:2px 9px}
.sl{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.sl .tm{flex:none;min-width:128px;font-weight:700;color:#12163a}
.sl .tx{flex:1;min-width:0}
.sl small{color:#555;display:block}
.sl a{font-weight:700}
.no{color:#555;margin:0}
.nt{color:#555;font-size:.85rem;margin:0 0 12px}
.er{color:#b3261e;font-weight:500}
@media(max-width:520px){.sl{flex-direction:column;gap:2px}.sl .tm{min-width:0}}
</style></head><body>
<main class="page tt" id="app"><p>Loading...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const SECS = [["islamic", "Arabic and Islamic Studies", "العلوم العربية والإسلامية"], ["western", "Western Studies", "الدراسات الغربية"], ["tech", "Technology", "التقنية"]];
const DAYS = [[1, "Monday", "الاثنين"], [2, "Tuesday", "الثلاثاء"], [3, "Wednesday", "الأربعاء"], [4, "Thursday", "الخميس"], [5, "Friday", "الجمعة"], [6, "Saturday", "السبت"], [0, "Sunday", "الأحد"]];
const planId = (sec, lvl) => sec + "__" + lvl.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
const t12 = t => { const [h, m] = String(t || "").split(":").map(Number); if (isNaN(h)) return esc(t); return ((h % 12) || 12) + ":" + String(m || 0).padStart(2, "0") + " " + (h < 12 ? "AM" : "PM"); };
let plans = [];
const MY = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return ""; } })();
const tzName = z => String(z || "").split("/").pop().replace(/_/g, " ");
const parts = (ms, tz, o) => Object.fromEntries(new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: tz, hourCycle: "h23" }, o)).formatToParts(new Date(ms)).map(p => [p.type, p.value]));
const offMs = (ms, tz) => { const p = parts(ms, tz, { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }); return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000; };
// the next time this weekday/hour happens in zone tz, as a real moment; then shown in the student's own zone
function mine(day, hhmm, tz) {
  try {
    const [h, mi] = hhmm.split(":").map(Number), now = Date.now();
    const p = parts(now, tz, { year: "numeric", month: "2-digit", day: "2-digit" });
    const wd = new Date(Date.UTC(+p.year, +p.month - 1, +p.day)).getUTCDay();
    const d = new Date(Date.UTC(+p.year, +p.month - 1, +p.day + ((day - wd + 7) % 7)));
    const g = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), h, mi);
    const ms = g - offMs(g, tz);
    const f = parts(ms, MY, { weekday: "short", hour: "numeric", minute: "2-digit", hour12: true });
    return { wd: f.weekday, t: f.hour + ":" + f.minute + " " + f.dayPeriod };
  } catch (e) { return null; }
}
const dfmt = s => s ? new Date(s + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";

onAuthStateChanged(auth, async u => {
  if (!u) return $("app").innerHTML = '<h1>My Timetable</h1><p>Please <a href="login.html">log in</a> first.</p>';
  let classes = null, failed = "";
  try { const s = await getDoc(doc(db, "students", u.uid)); if (s.exists()) classes = s.data().classes || null; } catch (e) { failed = e.code || e.message; }
  if (classes) for (const [sec, name, ar] of SECS) {
    const lvl = classes[sec]; if (!lvl) continue;
    let p = null;
    try { const d = await getDoc(doc(db, "classPlans", planId(sec, lvl))); if (d.exists()) p = d.data(); } catch (e) {}
    plans.push({ sec, name, ar, lvl, p });
  }
  draw(!classes, failed);
});

function draw(noClasses, failed) {
  const today = new Date().getDay();
  let h = `<h1>الجدول · My Timetable<small>Your online lessons for the term</small></h1>
    <p><a href="subjects.html">See my subjects and books</a></p>`;
  if (failed) h += `<p class="er">Some data could not be loaded (${esc(failed)}). Please refresh.</p>`;
  if (noClasses) h += '<div class="cd"><p class="no">You have not chosen your classes yet. Open the Home page and choose them, then come back here.</p></div>';
  plans.forEach(({ name, ar, lvl, p }) => {
    const slots = (p && p.slots) || [];
    let body = "";
    if (!slots.length) body = `<p class="no">The timetable for this class will be added soon.</p>`;
    else {
      const tm = p.term || {}, td = new Date().toISOString().slice(0, 10);
      if (tm.name) body += `<p class="nt"><b>${esc(tm.name)}</b>${tm.start || tm.end ? " · " + esc(dfmt(tm.start)) + " – " + esc(dfmt(tm.end)) : ""}</p>`;
      if (tm.end && td > tm.end) body += `<p class="er">This term has ended. The timetable for the next term will be added soon.</p>`;
      else if (tm.start && td < tm.start) body += `<p class="nt">This term starts on ${esc(dfmt(tm.start))}.</p>`;
      body += `<p class="nt">These lessons repeat every week of the term. Each time is shown in its own country time${MY ? ", and in your time (" + esc(tzName(MY)) + ")" : ""}.</p>`;
      DAYS.forEach(([d, en, a]) => {
        const ds = slots.filter(s => Number(s.day) === d).sort((x, y) => String(x.start).localeCompare(String(y.start)));
        if (!ds.length) return;
        body += `<div class="dy${d === today ? " today" : ""}"><h3>${en} · <span dir="rtl" lang="ar">${a}</span></h3>` + ds.map(s => {
          const w = String(s.where || "");
          const where = /^https?:\/\//i.test(w) ? `<a href="${esc(w)}" target="_blank" rel="noopener">Join class</a>` : (w ? esc(w) : "");
          const z = s.tz || p.tzId || "Africa/Lagos", a1 = MY && MY !== z ? mine(d, s.start, z) : null, a2 = MY && MY !== z ? mine(d, s.end, z) : null;
          const you = a1 && a2 && (a1.wd + a1.t !== en.slice(0, 3) + t12(s.start)) ? `<small>Your time: ${a1.wd} ${a1.t} – ${a2.t}</small>` : "";
          return `<div class="sl"><span class="tm">${t12(s.start)} – ${t12(s.end)}<small>${esc(tzName(z))} time</small>${you}</span><span class="tx"><b>${esc(s.subject)}</b>` +
            `${s.teacher ? `<small>Teacher: ${esc(s.teacher)}</small>` : ""}${where ? `<small>${where}</small>` : ""}</span></div>`;
        }).join("") + "</div>";
      });
    }
    h += `<div class="cd"><h2>${esc(lvl)}</h2><p class="sec">${esc(name)} · <span dir="rtl" lang="ar">${ar}</span></p>${body}</div>`;
  });
  $("app").innerHTML = h;
}
</script>
</body></html>
