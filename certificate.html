<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.cw{max-width:1040px}
.ls2{background:#fff;border:1.5px solid #cfd3e8;border-left:5px solid #f5b94a;border-radius:14px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.ls2 small{display:block;color:#4b5072}
.bt{display:inline-block;font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:#12163a;color:#f5b94a;cursor:pointer;text-decoration:none}
.ac2{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.hint{font-size:.85rem;color:#4b5072;margin:0 0 8px}

/* Certificate: every size is in cqw, so it scales exactly like a printed A4 landscape page */
#wrap{overflow-x:auto}
#box{container-type:inline-size;min-width:760px}
#cert{aspect-ratio:297/210;display:grid;grid-template-columns:27% 1fr;background:#fffdf6;color:#171a33;border:.8cqw solid #12163a;box-sizing:border-box;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#cert .sd{background:radial-gradient(circle at 50% 76%,rgba(245,185,74,.42),transparent 55%),repeating-linear-gradient(45deg,rgba(245,185,74,.09) 0 .2cqw,transparent .2cqw 1.7cqw),repeating-linear-gradient(-45deg,rgba(245,185,74,.09) 0 .2cqw,transparent .2cqw 1.7cqw),#12163a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:3cqw 1.6cqw}
#cert .sd img.lg{width:9cqw;height:9cqw}
#cert .ar{font-family:Amiri,serif;font-size:2.1cqw;line-height:1.4;margin:.6cqw 0 0}
#cert .en{font-size:1cqw;letter-spacing:.14em;text-transform:uppercase;color:#cfd3e8}
#cert .md{width:12.5cqw;height:12.5cqw;border-radius:50%;border:.45cqw solid #f5b94a;box-shadow:0 0 3cqw rgba(245,185,74,.55),inset 0 0 0 .5cqw #12163a,inset 0 0 0 .7cqw rgba(245,185,74,.6);display:flex;flex-direction:column;align-items:center;justify-content:center}
#cert .md b{font-family:Amiri,serif;font-size:3.8cqw;line-height:1;color:#f5b94a}
#cert .md span{font-size:1.05cqw;letter-spacing:.12em;text-transform:uppercase;margin-top:.4cqw}
#cert .vq{font-size:1cqw;color:#cfd3e8;line-height:1.5}
#cert #qr{width:9.5cqw;background:#fff;padding:.7cqw;border-radius:.5cqw;margin:0 auto .6cqw}
#cert #qr img,#cert #qr canvas{width:100%!important;height:auto!important;display:block}
#cert #qr canvas{display:none}
#cert .mn{margin:1.3cqw;padding:3cqw 4cqw 2.4cqw;box-shadow:inset 0 0 0 .15cqw #c78a14,inset 0 0 0 .55cqw #fffdf6,inset 0 0 0 .7cqw #f5b94a;display:flex;flex-direction:column;text-align:left}
#cert .kk{font-size:1.2cqw;letter-spacing:.34em;text-transform:uppercase;color:#8a5d00;font-weight:700}
#cert h1{font-family:Amiri,serif;font-size:7.2cqw;line-height:1.05;margin:.3cqw 0 1.4cqw;color:#12163a}
#cert .sm{font-size:1.5cqw;color:#4b5072;margin:0}
#cert .nm{font-family:Amiri,serif;font-size:4.1cqw;line-height:1.2;border-bottom:.2cqw solid #c78a14;padding:.4cqw 0 .7cqw;margin:.6cqw 0 1.5cqw;color:#8a5d00}
#cert .tx{font-size:1.7cqw;line-height:1.7;margin:0}
#cert .ex{display:block;font-size:1.4cqw;color:#4b5072;margin-top:.3cqw}
#cert .dt{font-size:1.5cqw;margin:1.2cqw 0 0;color:#4b5072}
#cert .sg{display:flex;gap:5cqw;margin-top:auto;padding-top:2cqw}
#cert .sg div{width:20cqw;border-top:.14cqw solid #171a33;padding-top:.5cqw;font-size:1.25cqw;color:#4b5072}
#cert .fp{font-size:.95cqw;color:#6b7094;margin:1.6cqw 0 0;overflow-wrap:anywhere;line-height:1.5}
@page{size:A4 landscape;margin:0}
@media print{
  body *{visibility:hidden}
  #wrap,#wrap *{visibility:visible}
  #wrap{position:absolute;left:0;top:0;width:297mm;overflow:visible}
  #box{min-width:0;width:297mm}
}
</style></head><body>
<main class="page cw">
<div id="app"><p>Loading...</p></div>
</main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const day = t => t && t.toDate ? t.toDate().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "";
const id = new URLSearchParams(location.search).get("id") || "";

onAuthStateChanged(auth, async u => {
  if (!u) return;
  try {
    if (id) {
      const s = await getDoc(doc(db, "certificates", id));
      if (!s.exists()) return $("app").innerHTML = '<h1>Certificate</h1><p>This certificate was not found. <a href="certificate.html">My certificates</a></p>';
      const c = s.data(), pct = Math.round(c.score / c.maxScore * 100);
      const link = location.origin + location.pathname + "?id=" + encodeURIComponent(id);
      const no = "SUI-" + String(id).slice(0, 8).toUpperCase();
      const sameTitle = !c.examTitle || String(c.examTitle).trim().toLowerCase() === String(c.courseTitle || "").trim().toLowerCase();
      $("app").innerHTML = `<div class="ac2"><button class="bt" id="pr">Print or save as PDF</button><a class="bt" href="certificate.html">All my certificates</a></div>
      <p class="hint">Tip: on a phone, swipe sideways to see the whole certificate.</p>
      <div id="wrap"><div id="box"><div id="cert">
        <div class="sd">
          <div><img class="lg" src="logo.svg" alt="" width="90" height="90">
            <p class="ar" dir="rtl" lang="ar">معهد سراج الأمة الإسلامية</p>
            <div class="en">Sirajul Ummah<br>Islamic Institute</div></div>
          <div class="md"><b>${pct}%</b><span>${esc(c.grade)}</span></div>
          <div><div id="qr"></div><div class="vq">Scan to verify<br><b>${esc(no)}</b></div></div>
        </div>
        <div class="mn">
          <div class="kk">Certificate of</div>
          <h1>Achievement</h1>
          <p class="sm">This is to certify that</p>
          <div class="nm">${esc(c.studentName)}</div>
          <p class="tx">has successfully completed the course <b>${esc(c.courseTitle)}</b>,<br>with a score of <b>${c.score} / ${c.maxScore} (${pct}%)</b>.${sameTitle ? "" : `<span class="ex" dir="auto">Assessment: ${esc(c.examTitle)}</span>`}</p>
          <p class="dt">Issued on ${day(c.issuedAt)}</p>
          <div class="sg"><div>Teacher</div><div>Director</div></div>
          <p class="fp">Certificate no. ${esc(no)} &middot; Verify at ${esc(link)}</p>
        </div>
      </div></div></div>`;
      $("pr").onclick = () => window.print();
      if (window.QRCode) new QRCode($("qr"), { text: link, width: 160, height: 160, colorDark: "#12163a", colorLight: "#ffffff" });
      return;
    }
    const s = await getDocs(query(collection(db, "certificates"), where("uid", "==", u.uid)));
    $("app").innerHTML = "<h1>My certificates</h1>" + (s.empty ? "<p>You have no certificates yet. Pass a test or exam and your teacher will issue one.</p>" :
      s.docs.map(d => { const c = d.data(); return `<div class="ls2"><div><b>${esc(c.courseTitle)}</b><small>${esc(c.examTitle)} · ${c.score} / ${c.maxScore} · ${esc(c.grade)} · ${day(c.issuedAt)}</small></div><a class="bt" href="certificate.html?id=${encodeURIComponent(d.id)}">View</a></div>`; }).join(""));
  } catch (e) { $("app").innerHTML = "<p>Could not load: " + esc(e.code || e.message) + "</p>"; }
});
</script>
</body></html>
