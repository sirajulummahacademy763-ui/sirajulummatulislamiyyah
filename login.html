<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Sirajul Ummah Islamic Institute</title>
<link rel="icon" href="logo.svg">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#12163a;--deep:#1c2150;--lamp:#f5b94a;--mist:#eef0f8;--ink:#171a33;--line:#cfd3e8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 0,rgba(245,185,74,.35),transparent 45%),var(--night)}
.box{background:var(--mist);width:100%;max-width:420px;border-radius:14px;padding:32px 28px}
.lamp{font-family:Amiri,serif;font-size:64px;line-height:1;text-align:center;color:#c78a14;margin-bottom:6px}
h1{font-family:Amiri,serif;font-size:2rem;margin:0 0 20px;text-align:center}
label{display:block;font-size:.9rem;font-weight:500;margin:14px 0 4px}
input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus,button:focus-visible{outline:3px solid var(--lamp);outline-offset:1px}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:var(--night);color:#fff;font:700 1.05rem Figtree,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
.link{background:none;color:var(--deep);text-decoration:underline;font:500 .9rem Figtree;margin-top:12px;padding:4px}
#msg{margin-top:14px;padding:11px 13px;border-radius:8px;display:none;font-weight:500}
#msg.err{display:block;background:#fdecea;color:#b3261e}#msg.ok{display:block;background:#e6f4ec;color:#1c7a4d}
p{text-align:center;margin:18px 0 0}
</style>
</head>
<body>
<div class="box">
  <div style="text-align:center"><img src="logo.svg" alt="Sirajul Ummah Islamic Institute" width="84" height="84"></div>
  <h1>Welcome back</h1>
  <form id="f" novalidate>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <div id="msg" role="alert"></div>
    <button id="btn" type="submit">Log in</button>
    <button id="reset" class="link" type="button">Forgot your password?</button>
  </form>
  <p>New here? <a href="register.html">Create an account</a></p>
</div>
<script type="module">
import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { auth } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const msg = (t, c) => { $("msg").textContent = t; $("msg").className = c; };
const errors = {
  "auth/invalid-credential": "Email or password is wrong.",
  "auth/user-not-found": "No account with this email. Create one first.",
  "auth/wrong-password": "Email or password is wrong.",
  "auth/invalid-email": "Enter a valid email address.",
  "auth/too-many-requests": "Too many tries. Wait a few minutes and try again.",
  "auth/network-request-failed": "No internet connection. Try again."
};
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("email").value.trim(), pw = $("pw").value;
  if (!email || !pw) return msg("Enter your email and password.", "err");
  $("btn").disabled = true; msg("Logging in...", "ok");
  try { await signInWithEmailAndPassword(auth, email, pw); location.href = "index.html"; }
  catch (err) { console.error(err); msg(errors[err.code] || "Could not log in: " + err.code, "err"); $("btn").disabled = false; }
});
$("reset").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) return msg("Type your email above first, then tap Forgot your password.", "err");
  try { await sendPasswordResetEmail(auth, email); msg("Reset link sent. Check your email (and spam).", "ok"); }
  catch (err) { msg(errors[err.code] || "Could not send the reset link.", "err"); }
});
</script>
</body>
</html>
