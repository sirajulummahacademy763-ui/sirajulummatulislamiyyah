<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Subjects | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.sj{max-width:960px}
.sj h1 small{font-family:Figtree,sans-serif;font-size:.42em;font-weight:500;color:#cfe0d6;display:block}
.lk{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.lk a{font-weight:700;text-decoration:none;color:var(--night);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;min-height:20px}
.lk a:hover{background:#fff4dc;border-color:#f0be4d}
.dp{background:#fff;border:1.5px solid var(--line);border-top:5px solid #f0be4d;border-radius:18px;box-shadow:var(--sh);padding:0;margin:0 0 22px;overflow:hidden}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,var(--night),var(--deep));color:#fff;padding:16px 18px}
main.page .dh h2{margin:0;color:#fff;font-size:1.35rem}
.dh .sec{margin:2px 0 0;color:#ffe9a6;font-size:.9rem}
.dh .ar{font-family:Amiri,serif;font-size:1.7rem;color:#f0be4d;line-height:1.2}
.dh .n{font-size:.8rem;font-weight:700;background:rgba(240,190,77,.18);border:1px solid rgba(240,190,77,.5);color:#ffe9a6;border-radius:999px;padding:4px 12px}
.dp .bd{padding:16px 18px 18px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.sb{border:1.5px solid var(--line);border-left:5px solid #f0be4d;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:5px;background:#fbfdfb}
.sb b{font-size:1.05rem;color:var(--night)}
.sb .ar{font-family:Amiri,serif;font-size:1.35rem;color:#9a6b10;line-height:1.3}
.sb .tc{display:inline-block;align-self:flex-start;font-size:.82rem;font-weight:600;background:#eef6f1;color:#1e4a3b;border-radius:999px;padding:4px 11px}
.sb small{color:#555}
.sb .bk{margin-top:auto;padding-top:6px}
.bt{display:inline-block;font:inherit;font-weight:700;font-size:.9rem;padding:10px 14px;border-radius:10px;background:linear-gradient(#ffe08a,#f0be4d);color:var(--night);text-decoration:none;text-align:center;min-height:20px}
.bt.alt{background:#fff;border:1.5px solid var(--line);color:var(--night)}
.no{color:#555;margin:0}
.er{color:#b3261e;font-weight:500}
.emp{background:#fff;border:1.5px dashed #f0be4d;border-radius:16px;padding:22px;text-align:center}
.emp a{font-weight:700}
</style></head><body>
<main class="page sj" id="app"><p>Loading...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const SECS = [["islamic", "Arabic and Islamic Studies", "العلوم العربية والإسلامية"], ["western", "Western Studies", "الدراسات الغربية"], ["tech", "Technology", "التقنية"]];
const planId = (sec, lvl) => sec + "__" + lvl.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");

onAuthStateChanged(auth, async u => {
  if (!u) return $("app").innerHTML = '<h1>My Subjects</h1><p>Please <a href="login.html">log in</a> first.</p>';
  let classes = null, mine = new Set(), failed = "";
  try {
    const s = await getDoc(doc(db, "students", u.uid));
    if (s.exists()) classes = s.data().classes || null;
    const e = await getDocs(query(collection(db, "enrollments"), where("uid", "==", u.uid)));
    mine = new Set(e.docs.map(d => d.data().courseId));
  } catch (e) { failed = e.code || e.message; }
  let h = `<h1>المواد · My Subjects<small>Your subjects, teachers and books for each of your classes</small></h1>
    <div class="lk"><a href="timetable.html">📅 My timetable</a><a href="classroom.html">🎧 Classroom</a><a href="library.html">📚 Library</a><a href="revision.html">Hifz &amp; Revision</a><a href="courses.html">Extra courses</a></div>`;
  if (failed) h += `<p class="er">Some data could not be loaded (${esc(failed)}). Please refresh.</p>`;
  if (!classes) { $("app").innerHTML = h + '<div class="emp"><p class="no">You have not chosen your classes yet.</p><p style="margin:8px 0 0"><a href="index.html">Open the Home page</a> and choose them, then come back here.</p></div>'; return; }
  for (const [sec, name, ar] of SECS) {
    const lvl = classes[sec];
    if (!lvl) continue;
    let plan = null;
    try { const p = await getDoc(doc(db, "classPlans", planId(sec, lvl))); if (p.exists()) plan = p.data(); } catch (e) {}
    let body;
    if (!plan || !(plan.subjects || []).length) body = '<p class="no">The subjects for this class will be added soon.</p>';
    else {
      const cards = await Promise.all(plan.subjects.map(async s => {
        let btn = "", book = null;
        if (s.bookId) { try { const b = await getDoc(doc(db, "courses", s.bookId)); if (b.exists() && b.data().published !== false) book = b.data(); } catch (e) {} }
        if (book) {
          const cat = book.section || sec, p = Number(book.price) || 0;
          btn = mine.has(s.bookId)
            ? `<a class="bt" href="pdf.html?id=${encodeURIComponent(s.bookId)}&c=${encodeURIComponent(cat)}">Open book</a>`
            : `<a class="bt alt" href="library.html?category=${encodeURIComponent(cat)}">Get book${p ? " · " + p + " coins" : ""}</a>`;
        } else if (s.bookId) btn = '<small>Book coming soon</small>';
        return `<div class="sb"><b>${esc(s.name)}</b>${s.nameAr ? `<span class="ar" dir="rtl" lang="ar">${esc(s.nameAr)}</span>` : ""}${s.teacher ? `<span class="tc">👤 ${esc(s.teacher)}</span>` : ""}${btn ? `<div class="bk">${btn}</div>` : ""}</div>`;
      }));
      body = `<div class="gr">${cards.join("")}</div>`;
    }
    const cnt = plan && (plan.subjects || []).length ? `<span class="n">${plan.subjects.length} subject${plan.subjects.length > 1 ? "s" : ""}</span>` : "";
    h += `<section class="dp"><div class="dh"><div><h2>${esc(lvl)}</h2><p class="sec">${esc(name)}</p></div><div style="text-align:right"><div class="ar" dir="rtl" lang="ar">${ar}</div>${cnt}</div></div><div class="bd">${body}</div></section>`;
  }
  $("app").innerHTML = h;
});
</script>
</body></html>
