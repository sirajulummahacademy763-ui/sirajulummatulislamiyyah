<!DOCTYPE html>
<html lang="en"><head>
<!-- sec-v1 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://js.paystack.co https://checkout.flutterwave.com https://meet.jit.si https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://*.workers.dev https://api.alquran.cloud https://cdn.mp3quran.net https://archive.org https://*.archive.org https://*.flutterwave.com https://api.paystack.co https://meet.jit.si wss://meet.jit.si; frame-src https://www.youtube-nocookie.com https://drive.google.com https://meet.jit.si https://checkout.flutterwave.com https://checkout.paystack.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">

<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today (admin) | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.ca{max-width:900px}
.hi{background:linear-gradient(135deg,#12163a,#2b2f55);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px}
.hi h1{margin:0;font-size:1.3rem;color:#fff}.hi p{margin:4px 0 0;color:#dfe2f5;font-size:.92rem}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.st div{background:#fff;border:1.5px solid #cfd3e8;border-radius:12px;padding:10px;text-align:center}
.st b{display:block;font-size:1.5rem;color:#12163a}.st span{font-size:.78rem;color:#4b5072}
h2.sec{font-size:1.05rem;margin:18px 0 8px;color:#12163a}
.tk{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #cfd3e8;border-left:6px solid #f4b942;border-radius:12px;padding:12px;margin-bottom:8px;text-decoration:none;color:#12163a}
.tk.g{border-left-color:#1c7a4d}.tk.r{border-left-color:#b3261e}
.tk .n{min-width:44px;text-align:center;font-size:1.4rem;font-weight:700}
.tk small{display:block;color:#4b5072;font-weight:400}
.tk b{font-size:.98rem}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gr a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:#fff;border:1.5px solid #cfd3e8;border-radius:14px;padding:14px 6px;text-decoration:none;color:#12163a;font-weight:700;font-size:.9rem;min-height:84px}
.gr a i{font-style:normal;font-size:1.7rem}
.er{color:#b3261e}
.mn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mn>div{background:#fff;border:1.5px solid #cfd3e8;border-radius:12px;padding:10px 12px}
.mn h3{margin:0 0 6px;font-size:.88rem;color:#4b5072}
.pl{background:#fff;border:1.5px solid #cfd3e8;border-radius:12px;padding:4px 12px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #e1e4f3}
.pr:last-child{border-bottom:0}.pr small{display:block;color:#4b5072}
.tb{font:inherit;font-size:.75rem;font-weight:700;border:1.5px solid #cfd3e8;background:#fff;color:#12163a;border-radius:999px;padding:3px 10px;cursor:pointer;margin-left:8px}
.pr .am{font-weight:700;color:#1c7a4d;white-space:nowrap}
.mr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #e1e4f3;font-size:.95rem}
@media(max-width:560px){.mn{grid-template-columns:1fr}.st{grid-template-columns:1fr 1fr}.gr{grid-template-columns:1fr 1fr}}
.gsub{font-family:Figtree,system-ui,sans-serif;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#6a6f92;margin:16px 2px 6px}
</style></head><body>
<main class="page ca" id="app"><p>Loading...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const lvl = k => String(k || "").split("|").slice(1).join("|") || k;
const SHORT = [
  ["👩‍🎓", "Students & Teachers", "countries-admin.html"], ["🧑‍🏫", "Assign Teachers", "teacher-assign-admin.html"], ["🏫", "Classes & Timetable", "classes-admin.html"],
  ["📝", "Homework & Reports", "homework-admin.html"], ["📊", "Overview", "overview-admin.html"], ["📖", "Hifz & Revision", "revision-admin.html"],
  ["✍️", "Signature & Stamp", "signatures.html"], ["👁️", "Supervisors", "supervisors-admin.html"], ["💬", "Messages", "messages-admin.html"], ["🕌", "Quran Classroom", "quran-classroom.html"], ["⚙️", "Terms, notices, library", "admin.html"], ["🕌", "Home page", "index.html?home=1"]
];
onAuthStateChanged(auth, async u => {
  if (!u) { location.replace("login.html"); return; }
  let adm = false;
  try { adm = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch (e) {}
  if (!adm) { $("app").innerHTML = "<h1>Today</h1><p>This page is only for the admin.</p>"; return; }
  try {
    const g = async n => { try { return (await getDocs(collection(db, n))).docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) { return []; } };
    let [M, W, S, R, T, ST, TC, PAY, AM] = await Promise.all([g("classMembers"), g("classWork"), g("classWorkSubs"), g("reportCards"), g("terms"), g("students"), g("teachers"), g("payments"), g("adminMsgs")]);
    T.sort((a, b) => String(a.startDate).localeCompare(String(b.startDate)));
    const t = today();
    const cur = T.find(x => t >= x.startDate && t <= x.endDate) || T.filter(x => t > x.endDate).pop() || T[0];
    const tasks = [];
    // 1. answers waiting to be marked
    const wait = S.filter(x => x.status === "submitted");
    const wk = {}; wait.forEach(x => wk[x.classKey] = (wk[x.classKey] || 0) + 1);
    Object.keys(wk).forEach(k => tasks.push({ c: "", n: wk[k], t: "answers to mark", s: lvl(k), h: "homework-admin.html" }));
    // 2. homework past its date with students who have not answered
    const members = {}; M.forEach(x => (members[x.classKey] = members[x.classKey] || []).push(x));
    W.filter(p => p.kind === "homework" && p.due && p.due < t).forEach(p => {
      const done = new Set(S.filter(x => x.workId === p.id).map(x => x.uid));
      const miss = (members[p.classKey] || []).filter(s => !done.has(s.uid));
      if (miss.length) tasks.push({ c: "r", n: miss.length, t: "students missed “" + esc(p.title) + "”", s: lvl(p.classKey) + " · was due " + esc(p.due), h: "homework-admin.html" });
    });
    // 3. report cards not issued for the current term
    if (cur) Object.keys(members).forEach(k => {
      const issued = new Set(R.filter(x => x.classKey === k && x.termId === cur.id && x.status === "issued").map(x => x.uid));
      const left = members[k].filter(s => !issued.has(s.uid)).length;
      if (left) tasks.push({ c: "", n: left, t: "report cards not issued", s: lvl(k) + " · " + esc(cur.name || ""), h: "homework-admin.html" });
    });
    // unread messages for the director
    let seen = 0; try { seen = +localStorage.getItem("msgSeen_" + u.uid) || 0; } catch (e) {}
    const unread = AM.filter(x => x.from === "user" && (x.createdAt && x.createdAt.seconds ? x.createdAt.seconds * 1000 : Date.now()) > seen).length;
    if (unread) tasks.unshift({ c: "r", n: unread, t: "new messages", s: "From supervisors and teachers", h: "messages-admin.html" });
    // 4. setup problems
    if (!T.length) tasks.push({ c: "r", n: "!", t: "No term is set", s: "Add the session and dates in Admin → Terms", h: "admin.html" });
    else if (cur && !T.some(x => x.startDate > cur.endDate)) tasks.push({ c: "r", n: "!", t: "Add the next term", s: "So “Next term begins” shows on report sheets", h: "admin.html" });
    // coins and money
    PAY.forEach(x => { if (x.mode === "test" && x.ignored == null) x.ignored = true; });
    PAY.forEach(x => { if (x.currency == null && x.naira != null) { x.currency = "NGN"; x.amount = Number(x.naira) || 0; } else if (x.amount == null && x.naira != null) { x.amount = Number(x.naira) || 0; } });
    const ALLP = PAY.slice(); PAY = PAY.filter(x => x.ignored !== true);
    const walletCoins = ST.reduce((a, x) => a + (Number(x.coins) || 0), 0);
    const sold = PAY.reduce((a, x) => a + (Number(x.coins) || 0), 0);
    const nowD = new Date(), mStart = new Date(nowD.getFullYear(), nowD.getMonth(), 1).getTime();
    const byCur = {}, byCurM = {}; let soldM = 0, nM = 0;
    PAY.forEach(x => { const c = String(x.currency || "?"), a = Number(x.amount) || 0, tm = x.createdAt && x.createdAt.seconds ? x.createdAt.seconds * 1000 : 0;
      byCur[c] = (byCur[c] || 0) + a; if (tm >= mStart) { byCurM[c] = (byCurM[c] || 0) + a; soldM += Number(x.coins) || 0; nM++; } });
    const fm = o => Object.keys(o).sort().map(c => `<div class="mr"><span>${esc(c)}</span><b>${o[c].toLocaleString("en-US", { maximumFractionDigits: 2 })}</b></div>`).join("") || '<div class="mr"><span>No payments yet</span><b>0</b></div>';
    const money = `<h2 class="sec">Coins and money</h2><div class="st"><div><b>${walletCoins.toLocaleString("en-US")}</b><span>Coins in student wallets</span></div><div><b>${sold.toLocaleString("en-US")}</b><span>Coins bought (all time)</span></div><div><b>${PAY.length}</b><span>Real payments${ALLP.length > PAY.length ? " (" + (ALLP.length - PAY.length) + " test ignored)" : ""}</span></div><div><b>${soldM.toLocaleString("en-US")}</b><span>Coins bought this month (${nM})</span></div></div>
      <div class="mn"><div><h3>Money received, all time</h3>${fm(byCur)}</div><div><h3>Money received, this month</h3>${fm(byCurM)}</div></div>`;
    const nm = {}; ST.forEach(x => nm[x.id] = x.name || x.email || "Student");
    const tms = x => (x.createdAt && x.createdAt.seconds ? x.createdAt.seconds * 1000 : 0);
    const plist = ALLP.slice().sort((a, b) => tms(b) - tms(a));
    const prow = x => `<div class="pr" style="${x.ignored === true ? "opacity:.5" : ""}"><div><b>${esc(nm[x.uid] || "Student")}</b><small>${x.mode === "test" ? "<b style=\"color:#b3261e\">TEST MODE</b> · " : x.mode === "live" ? "<b style=\"color:#1c7a4d\">LIVE</b> · " : "Old record · "}${x.email ? esc(x.email) + " · " : ""}${tms(x) ? new Date(tms(x)).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " · " : ""}${Number(x.coins) || 0} coins</small></div>${x.currency && Number(x.amount) ? `<div class="am">${esc(x.currency)} ${Number(x.amount).toLocaleString("en-US", { maximumFractionDigits: 2 })}</div>` : `<div class="am" style="color:#8a8fa8;font-weight:400;font-size:.8rem;text-align:right">Amount not<br>recorded${x.provider ? " · " + esc(x.provider) : ""}</div>`}<button type="button" class="tb" data-t="${esc(x.id)}" data-v="${x.ignored === true ? "0" : "1"}">${x.ignored === true ? "Count it" : "Test"}</button></div>`;
    const pays = `<h2 class="sec">Payments (currency and amount paid)</h2><div class="pl" id="pl">${plist.slice(0, 10).map(prow).join("") || '<p class="hint" style="margin:6px">No payments yet.</p>'}</div>${plist.length > 10 ? '<button class="b" id="pall" type="button" style="font:inherit;font-weight:700;padding:8px 14px;border:0;border-radius:10px;background:#12163a;color:#fff;margin-top:8px">Show all ' + plist.length + "</button>" : ""}`;
    const names = new Date().getHours() < 12 ? "Good morning" : new Date().getHours() < 17 ? "Good afternoon" : "Good evening";
    let h = `<div class="hi"><h1>${names}, Director</h1><p>${cur ? esc(cur.name || "") + " " + esc(cur.session || "") + " · " : ""}${new Date().toDateString()}</p></div>
      <div class="st"><div><b>${ST.length}</b><span>Students</span></div><div><b>${TC.length}</b><span>Teachers</span></div><div><b>${W.filter(x => x.kind === "homework").length}</b><span>Homework posted</span></div><div><b>${R.filter(x => x.status === "issued" && (!cur || x.termId === cur.id)).length}</b><span>Reports issued</span></div></div>
      <h2 class="sec">Needs your attention</h2>`;
    h += tasks.length ? tasks.map(k => `<a class="tk ${k.c}" href="${k.h}"><span class="n">${esc(k.n)}</span><span><b>${k.t}</b><small>${k.s}</small></span></a>`).join("") : '<a class="tk g" href="homework-admin.html"><span class="n">✓</span><span><b>All clear today</b><small>Nothing is waiting for you.</small></span></a>';
    h += money + pays;
    const SG = [["People and messages", ["countries-admin.html", "teacher-assign-admin.html", "supervisors-admin.html", "messages-admin.html"]], ["Classes", ["classes-admin.html", "quran-classroom.html", "revision-admin.html"]], ["Results and reports", ["homework-admin.html", "overview-admin.html", "signatures.html"]], ["Settings", ["admin.html", "index.html?home=1"]]];
    h += `<h2 class="sec">Go to</h2>` + SG.map(g => `<h3 class="gsub">${g[0]}</h3><div class="gr">${g[1].map(u => { const x = SHORT.find(s => s[2] === u); return x ? `<a href="${x[2]}"><i>${x[0]}</i>${x[1]}</a>` : ""; }).join("")}</div>`).join("");
    $("app").innerHTML = h;
    $("app").onclick = async e => {
      const b = e.target.closest && e.target.closest("[data-t]"); if (!b) return;
      b.disabled = true;
      try { await updateDoc(doc(db, "payments", b.dataset.t), { ignored: b.dataset.v === "1" }); location.reload(); }
      catch (er) { b.disabled = false; alert("Could not save: " + (er.code || er.message)); }
    };
    if ($("pall")) $("pall").onclick = () => { $("pl").innerHTML = plist.map(prow).join(""); $("pall").remove(); };
  } catch (e) { $("app").innerHTML = '<h1>Today</h1><p class="er">Could not load: ' + esc(e.code || e.message) + "</p>"; }
});
</script></body></html>
