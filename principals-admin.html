<!DOCTYPE html>
<html lang="en"><head>
<!-- sec-v1 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://www.recaptcha.net https://js.paystack.co https://checkout.flutterwave.com https://meet.jit.si https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://www.google.com https://www.recaptcha.net https://*.googleapis.com https://www.gstatic.com https://*.workers.dev https://api.alquran.cloud https://cdn.mp3quran.net https://archive.org https://*.archive.org https://*.flutterwave.com https://api.paystack.co https://meet.jit.si wss://meet.jit.si; frame-src https://www.google.com https://www.recaptcha.net https://www.youtube-nocookie.com https://drive.google.com https://meet.jit.si https://checkout.flutterwave.com https://checkout.paystack.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">

<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Principals (admin) | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.ca{max-width:760px}
.hint{color:#4b5072;font-size:.9rem;margin:2px 0 10px}
select{width:100%;box-sizing:border-box;padding:10px;border:1.5px solid #cfd3e8;border-radius:8px;font:inherit;background:#fff}
.cd{background:#fff;border:1.5px solid #cfd3e8;border-radius:14px;padding:14px;margin-bottom:12px}
.cd h2{margin:0 0 4px;font-size:1.05rem}
.grp{margin:10px 0 4px;font-weight:700;font-size:.9rem;color:#12163a;display:flex;justify-content:space-between;align-items:center}
.grp button{font:inherit;font-size:.8rem;border:1.5px solid #cfd3e8;background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer}
label.k{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed #e1e4f3;font-size:.95rem}
label.k input{width:20px;height:20px}
.b{font:inherit;font-weight:700;padding:10px 16px;border:0;border-radius:10px;background:#12163a;color:#fff;cursor:pointer;margin:10px 8px 0 0}
.b.o{background:#fff;color:#b3261e;border:1.5px solid #b3261e}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;background:#e8ebf8;color:#12163a;margin:2px 4px 2px 0}
.m{margin-top:8px;font-size:.92rem}.er{color:#b3261e}.ok{color:#1c7a4d}
</style></head><body>
<main class="page ca" id="app"><p>Loading...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, getDocs, doc, getDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const SN = { islamic: "Arabic and Islamic", western: "Western", tech: "Technology", hifz: "Hifz", revision: "Revision", room: "Quran classes (Hifz and Revision)" };
let TE = [], SU = {}, KEYS = [], sel = "", ticks = new Set(), RT = {};
onAuthStateChanged(auth, async u => {
  if (!u) { location.replace("login.html"); return; }
  let adm = false;
  try { adm = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch (e) {}
  if (!adm) { $("app").innerHTML = "<h1>Principals</h1><p>This page is only for the admin.</p>"; return; }
  try {
    const g = async n => (await getDocs(collection(db, n))).docs.map(d => ({ id: d.id, ...d.data() }));
    const [te, su, ta, cm, cw, cr] = await Promise.all([g("teachers"), g("principals"), g("teacherAssign"), g("classMembers"), g("classWork"), g("classrooms")]);
    TE = te.sort((a, b) => String(a.name).localeCompare(String(b.name)));
    su.forEach(x => SU[x.id] = x);
    const ks = new Set();
    ta.forEach(x => (x.classKeys || []).forEach(k => ks.add(k))); cm.forEach(x => x.classKey && ks.add(x.classKey)); cw.forEach(x => x.classKey && ks.add(x.classKey));
    KEYS = [...ks].sort();
    // Hifz and Revision rooms can be supervised too (saved as "room|<room id>")
    cr.filter(x => x.section === "hifz" || x.section === "revision").sort((a, b) => String(a.title).localeCompare(String(b.title))).forEach(x => { RT[x.id] = x.title || x.id; KEYS.push("room|" + x.id); });
    draw();
  } catch (e) { $("app").innerHTML = '<h1>Principals</h1><p class="er">Could not load: ' + esc(e.code || e.message) + "</p>"; }
});
const lab = k => { if (k.indexOf("room|") === 0) return RT[k.slice(5)] || k.slice(5); const [s, ...l] = k.split("|"); return l.join("|") + " (" + (SN[s] || s) + ")"; };
function draw() {
  const cur = Object.keys(SU).length ? `<div class="cd"><h2>Current principals</h2>${Object.values(SU).map(x => `<div style="margin:6px 0"><b>${esc(x.name)}</b> <span class="pill">${(x.classKeys || []).length} classes</span> <button class="b" style="padding:5px 12px;margin:0" data-e="${esc(x.id)}">Edit</button></div>`).join("")}</div>` : "";
  let h = `<h1>Principals</h1><p class="hint">A principal is a teacher you put in charge of the classes you tick. He sits below the supervisors and above the teachers: he can follow attendance in those classes, ask those classes' teachers questions, and answer the supervisors and you. For a Hifz or Revision class, the principal sees its attendance.</p>${cur}
    <div class="cd"><h2>Make or edit a principal</h2><label for="tp"><b>Choose a teacher</b></label>
    <select id="tp"><option value="">Choose...</option>${TE.map(t => `<option value="${esc(t.id)}" ${t.id === sel ? "selected" : ""}>${esc(t.name)}${SU[t.id] ? " (principal)" : ""}</option>`).join("")}</select>`;
  if (sel) {
    const secs = {}; KEYS.forEach(k => (secs[k.split("|")[0]] = secs[k.split("|")[0]] || []).push(k));
    h += `<p class="hint" style="margin-top:12px">Tick the classes this principal oversees.</p>`;
    h += KEYS.length ? Object.keys(secs).map(s => `<div class="grp"><span>${esc(SN[s] || s)}</span><button type="button" data-all="${esc(s)}">Tick all</button></div>${secs[s].map(k => `<label class="k"><input type="checkbox" data-k="${esc(k)}" ${ticks.has(k) ? "checked" : ""}> ${esc(lab(k))}</label>`).join("")}`).join("") : '<p class="hint">No classes found yet. Assign teachers to classes first.</p>';
    h += `<div><button class="b" id="sv">Save principal</button>${SU[sel] ? '<button class="b o" id="rm">Remove principal</button>' : ""}</div><div class="m" id="m"></div>`;
  }
  h += "</div>";
  $("app").innerHTML = h;
  $("tp").onchange = e => { sel = e.target.value; ticks = new Set(SU[sel] ? SU[sel].classKeys || [] : []); draw(); };
  $("app").querySelectorAll("[data-e]").forEach(b => b.onclick = () => { sel = b.dataset.e; ticks = new Set(SU[sel].classKeys || []); draw(); scrollTo(0, 400); });
  $("app").querySelectorAll("[data-k]").forEach(c => c.onchange = () => { c.checked ? ticks.add(c.dataset.k) : ticks.delete(c.dataset.k); });
  $("app").querySelectorAll("[data-all]").forEach(b => b.onclick = () => { KEYS.filter(k => k.split("|")[0] === b.dataset.all).forEach(k => ticks.add(k)); draw(); });
  if (sel) {
    $("sv").onclick = async () => {
      const t = TE.find(x => x.id === sel), m = $("m");
      if (!ticks.size) { m.innerHTML = '<span class="er">Tick at least one class.</span>'; return; }
      try { await setDoc(doc(db, "principals", sel), { name: t ? t.name : "", classKeys: [...ticks], updatedAt: serverTimestamp() }); SU[sel] = { id: sel, name: t ? t.name : "", classKeys: [...ticks] }; draw(); $("m").innerHTML = '<span class="ok">Saved. They will see the Principal page in their menu.</span>'; }
      catch (e) { m.innerHTML = '<span class="er">Could not save: ' + esc(e.code || e.message) + "</span>"; }
    };
    if ($("rm")) $("rm").onclick = async () => {
      if (!confirm("Remove this principal? They stay a teacher.")) return;
      try { await deleteDoc(doc(db, "principals", sel)); delete SU[sel]; sel = ""; ticks = new Set(); draw(); } catch (e) { $("m").innerHTML = '<span class="er">Could not remove: ' + esc(e.code || e.message) + "</span>"; }
    };
  }
}
</script></body></html>
