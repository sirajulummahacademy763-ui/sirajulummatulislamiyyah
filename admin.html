<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.ad{max-width:900px}
.cd{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px}
.cd h2{margin-top:0}
.cd label{display:block;font-size:.88rem;font-weight:500;margin:10px 0 3px}
.cd input,.cd select,.cd textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font:inherit}
.cd .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:var(--night);color:#fff;cursor:pointer;margin-top:14px}
.cd button.sm{padding:5px 10px;font-size:.82rem;margin:0 4px 0 0;background:#fff;color:var(--night);border:1.5px solid var(--line)}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ok{color:#1c7a4d;font-weight:500}.er{color:#b3261e;font-weight:500}
@media(max-width:600px){.cd .row{grid-template-columns:1fr}}
</style></head><body>
<main class="page ad" id="app"><p>Checking access...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc, addDoc, setDoc, updateDoc, deleteDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const say = (id, t, ok) => { $(id).textContent = t; $(id).className = ok ? "ok" : "er"; };
const LEVELS = ["Rawdatul Atfal", "Ibtidai", "I'dadi", "Thanawi", "Kindergarten (KG)", "Primary 1", "Primary 2", "Primary 3", "Primary 4", "Primary 5", "Primary 6", "JSS 1", "JSS 2", "JSS 3", "SSS 1", "SSS 2", "SSS 3", "Beginner", "Intermediate", "Advanced"];
let courses = [], sel = "", teachers = [];

onAuthStateChanged(auth, async u => {
  if (!u) return;
  let ok = false;
  try { ok = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch (e) {}
  if (!ok) return $("app").innerHTML = "<h1>Admin</h1><p>You do not have access to this page.</p>";
  build(); await loadTeachers(); loadCourses(); libInit(); loadLib();
});

function build() {
  $("app").innerHTML = `<h1>Admin</h1>
  <div class="cd"><h2>Add coins to a student</h2>
    <label>Student email</label><input id="ce" type="email"><label>Coins to add</label><input id="ca" type="number" min="1">
    <button id="cb" type="button">Add coins</button> <span id="cm"></span></div>
  <div class="cd"><h2>New course</h2>
    <label>Title</label><input id="nt">
    <div class="row"><div><label>Section</label><select id="ns"><option value="islamic">Qur'an and Islamic</option><option value="western">Western studies</option><option value="tech">Technology</option></select></div>
    <div><label>Level</label><input id="nl" list="lv"><datalist id="lv">${LEVELS.map(l => `<option value="${l}">`).join("")}</datalist></div></div>
    <label>Description</label><textarea id="nd" rows="3"></textarea>
    <div class="row"><div><label>Price in coins (0 = free)</label><input id="np" type="number" min="0" value="0"></div><div><label>Order (1, 2, 3...)</label><input id="no" type="number" value="1"></div></div>
    <label><input id="npub" type="checkbox" style="width:auto"> Publish now (students can see it)</label>
    <button id="nb" type="button">Create course</button> <span id="nm"></span></div>
  <div class="cd"><h2>Your courses</h2><div id="cl">Loading...</div></div>
  <div class="cd"><h2>Teachers</h2>
    <p style="margin-top:0">The teacher must first register on the site. Then enter the email they registered with.</p>
    <label>Teacher email</label><input id="te" type="email">
    <button id="tab" type="button">Add teacher</button> <span id="tam"></span>
    <div id="tl" style="margin-top:14px"></div></div>
  <div class="cd"><h2>Assign a teacher to a course</h2>
    <label>Course</label><select id="tc"></select>
    <label>Teacher</label><select id="tt"></select>
    <button id="tb" type="button">Assign teacher</button> <span id="tm"></span></div>
  <div class="cd"><h2>Library</h2>
    <label>Section</label><select id="bs"><option value="quran">Qur'an recitation</option><option value="hadith">Hadith recitation</option><option value="islamic">Islamic and Arabic books</option><option value="western">Western books</option><option value="tech">Technology books</option><option value="free">World books (free)</option></select>
    <label id="bgl">Group</label><select id="bg"></select><input id="bgt" hidden placeholder="Category, for example Health, Business, History">
    <label>Title</label><input id="bt">
    <label>Author or reciter (optional)</label><input id="ba">
    <div class="row"><div><label>Type</label><select id="by"><option value="audio">Audio</option><option value="pdf">PDF book</option><option value="video">Video</option></select></div><div><label>Price in coins (0 = free)</label><input id="bp" type="number" min="0" value="0"></div></div>
    <label>Link (Google Drive, YouTube or a direct file link)</label><input id="bu" placeholder="https://...">
    <label>Order (1, 2, 3...)</label><input id="bo" type="number" value="1">
    <button id="bb" type="button">Add to library</button> <span id="bm"></span>
    <div id="bl" style="margin-top:14px"></div></div>
  <div class="cd"><h2>Certificates</h2>
    <p style="margin-top:0">Choose a course and a test or exam. Students who passed appear here, and you issue their certificates.</p>
    <label>Course</label><select id="kc"></select>
    <label>Test or exam</label><select id="kx"></select>
    <div id="kr" style="margin-top:14px"></div></div>
  <div class="cd"><h2>Lessons</h2><label>Course</label><select id="ls"></select>
    <label>Lesson title</label><input id="lt">
    <div class="row"><div><label>Type</label><select id="ly"><option value="video">Video (YouTube link)</option><option value="text">Written lesson</option><option value="jitsi">Live class on the website (Jitsi)</option><option value="live">Live class (Zoom or Meet link)</option></select></div><div><label>Order (1, 2, 3...)</label><input id="lo" type="number" value="1"></div></div>
    <label id="lcl">YouTube link</label><textarea id="lc" rows="4"></textarea>
    <div id="lwb" hidden><label>Date and time (for live class)</label><input id="lw" placeholder="Saturday 5:00 PM"></div>
    <button id="lb" type="button">Add lesson</button> <span id="lm"></span>
    <div id="ll" style="margin-top:14px"></div></div>`;
  $("cb").onclick = addCoins; $("nb").onclick = addCourse; $("lb").onclick = addLesson; $("tb").onclick = assignTeacher; $("tab").onclick = addTeacher; $("kc").onchange = certExams; $("kx").onchange = certList;
  $("ls").onchange = () => { sel = $("ls").value; loadLessons(); };
  $("ly").onchange = () => { const t = $("ly").value; $("lcl").textContent = t === "video" ? "YouTube link" : t === "live" ? "Meeting link (Zoom, Google Meet...)" : t === "jitsi" ? "Room name (leave empty to create a secret one automatically)" : "Lesson text"; $("lwb").hidden = !(t === "live" || t === "jitsi"); };
}

const BG = {
  quran: [["male", "Male reciters"], ["female", "Female reciters"]],
  hadith: [["arabic", "Arabic reciters"], ["english", "English reciters"]],
  islamic: ["Rawdatul Atfal", "Ibtidai", "I'dadi", "Thanawi"],
  western: ["Kindergarten (KG)", "Primary 1", "Primary 2", "Primary 3", "Primary 4", "Primary 5", "Primary 6", "JSS 1", "JSS 2", "JSS 3", "SSS 1", "SSS 2", "SSS 3"],
  tech: ["Beginner", "Intermediate", "Advanced"]
};
let libItems = [];

function libInit() {
  const set = () => {
    const s = $("bs").value, free = s === "free";
    $("bg").hidden = free; $("bgt").hidden = !free;
    $("bgl").textContent = free ? "Category" : s === "quran" || s === "hadith" ? "Group" : "Class";
    if (!free) $("bg").innerHTML = BG[s].map(g => Array.isArray(g) ? `<option value="${g[0]}">${g[1]}</option>` : `<option value="${esc(g)}">${esc(g)}</option>`).join("");
    $("by").value = s === "quran" || s === "hadith" ? "audio" : "pdf";
    $("bp").value = s === "islamic" || s === "western" || s === "tech" ? 2 : 0;
  };
  $("bs").onchange = set; set();
  $("bb").onclick = addLib;
}

async function addLib() {
  const s = $("bs").value, title = $("bt").value.trim(), url = $("bu").value.trim();
  const group = s === "free" ? $("bgt").value.trim() : $("bg").value;
  if (!title || !group || !/^https?:\/\//i.test(url)) return say("bm", "Enter the title, the group or class, and a link starting with https://");
  const price = s === "free" ? 0 : Math.max(0, parseInt($("bp").value, 10) || 0);
  try {
    const r = await addDoc(collection(db, "library"), { section: s, group, title, author: $("ba").value.trim(), type: $("by").value, price, order: parseInt($("bo").value, 10) || 1, createdAt: serverTimestamp() });
    await setDoc(doc(db, "libraryFiles", r.id), { url });
    say("bm", "Added to the library.", true); $("bt").value = ""; $("bu").value = ""; $("ba").value = ""; $("bo").value = (parseInt($("bo").value, 10) || 1) + 1; loadLib();
  } catch (e) { say("bm", "Failed: " + (e.code || e.message)); }
}

async function loadLib() {
  const s = await getDocs(collection(db, "library"));
  libItems = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.section).localeCompare(String(b.section)) || String(a.group).localeCompare(String(b.group)) || (a.order || 0) - (b.order || 0));
  $("bl").innerHTML = libItems.length ? libItems.map(i => `<div class="it"><span><b>${esc(i.title)}</b><br><small>${esc(i.section)} · ${esc(i.group)} · ${i.price || 0} coins</small></span><span><button class="sm" data-lp="${i.id}">Price</button><button class="sm" data-ld="${i.id}">Delete</button></span></div>`).join("") : "<p>Nothing in the library yet.</p>";
  $("bl").querySelectorAll("[data-lp]").forEach(b => b.onclick = async () => { const v = prompt("New price in coins:"); if (v === null) return; await updateDoc(doc(db, "library", b.dataset.lp), { price: Math.max(0, parseInt(v, 10) || 0) }); loadLib(); });
  $("bl").querySelectorAll("[data-ld]").forEach(b => b.onclick = async () => { if (!confirm("Delete this item?")) return; try { await deleteDoc(doc(db, "libraryFiles", b.dataset.ld)); } catch (e) {} await deleteDoc(doc(db, "library", b.dataset.ld)); loadLib(); });
}

let certEx = [];

async function certExams() {
  const cid = $("kc").value;
  if (!cid) { $("kx").innerHTML = ""; $("kr").innerHTML = ""; return; }
  const s = await getDocs(collection(db, "courses", cid, "exams"));
  certEx = s.docs.map(d => ({ id: d.id, ...d.data() }));
  $("kx").innerHTML = certEx.length ? certEx.map(x => `<option value="${x.id}">${esc(x.title)}</option>`).join("") : '<option value="">No tests or exams yet</option>';
  certList();
}

async function issueCert(cid, x, r) {
  const pct = Math.round(r.score / x.maxScore * 100), grade = pct >= 80 ? "Distinction" : pct >= 65 ? "Merit" : "Pass";
  const c = courses.find(k => k.id === cid);
  await setDoc(doc(db, "certificates", r.id), { uid: r.uid, studentName: r.studentName || "Student", courseId: cid, courseTitle: c ? c.title : "", examId: x.id, examTitle: x.title, score: r.score, maxScore: x.maxScore, grade, issuedAt: serverTimestamp(), issuedBy: "admin" });
}

async function certList() {
  const cid = $("kc").value, x = certEx.find(e => e.id === $("kx").value);
  if (!x) { $("kr").innerHTML = "<p>Nothing here yet.</p>"; return; }
  const s = await getDocs(query(collection(db, "courses", cid, "examResults"), where("examId", "==", x.id)));
  const rs = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.status === "graded");
  const issued = {};
  await Promise.all(rs.map(async r => { try { issued[r.id] = (await getDoc(doc(db, "certificates", r.id))).exists(); } catch (e) {} }));
  const pass = rs.filter(r => r.score >= x.passMark);
  $("kr").innerHTML = (pass.some(r => !issued[r.id]) ? '<button id="kall" type="button">Issue certificates to all who passed</button> <span id="kmsg"></span>' : '<span id="kmsg"></span>') +
    (rs.length ? rs.map(r => `<div class="it"><span><b>${esc(r.studentName || "Student")}</b><br><small>${r.score} / ${x.maxScore} · ${r.score >= x.passMark ? "Passed" : "Not passed"}${issued[r.id] ? " · Certificate issued" : ""}</small></span>
      <span>${issued[r.id] ? `<button class="sm" data-kd="${r.id}">Remove certificate</button>` : r.score >= x.passMark ? `<button class="sm" data-ki="${r.id}">Issue certificate</button>` : ""}</span></div>`).join("") : "<p>No marked results yet. Teachers must mark the exam first.</p>");
  $("kr").querySelectorAll("[data-ki]").forEach(b => b.onclick = async () => {
    try { await issueCert(cid, x, rs.find(r => r.id === b.dataset.ki)); certList(); } catch (e) { say("kmsg", "Failed: " + (e.code || e.message)); }
  });
  $("kr").querySelectorAll("[data-kd]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this certificate?")) return;
    try { await deleteDoc(doc(db, "certificates", b.dataset.kd)); certList(); } catch (e) { say("kmsg", "Failed: " + (e.code || e.message)); }
  });
  if ($("kall")) $("kall").onclick = async () => {
    try { for (const r of pass) if (!issued[r.id]) await issueCert(cid, x, r); certList(); } catch (e) { say("kmsg", "Failed: " + (e.code || e.message)); }
  };
}

async function loadTeachers() {
  try {
    const s = await getDocs(collection(db, "teachers"));
    teachers = s.docs.map(d => ({ id: d.id, name: d.data().name || d.id }));
  } catch (e) { teachers = []; }
  $("tt").innerHTML = teachers.length ? teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("") : '<option value="">No teachers added yet</option>';
  $("tl").innerHTML = teachers.length ? teachers.map(t => `<div class="it"><span>${esc(t.name)}</span><button class="sm" data-rt="${t.id}">Remove</button></div>`).join("") : "<p>No teachers yet.</p>";
  $("tl").querySelectorAll("[data-rt]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this teacher?")) return;
    await deleteDoc(doc(db, "teachers", b.dataset.rt)); loadTeachers();
  });
}

async function addTeacher() {
  const email = $("te").value.trim();
  if (!email) return say("tam", "Enter the teacher's email.");
  try {
    const s = await getDocs(query(collection(db, "students"), where("email", "==", email)));
    if (s.empty) return say("tam", "No registered user with that email. They must register first.");
    const d = s.docs[0];
    await setDoc(doc(db, "teachers", d.id), { name: d.data().name || email, email });
    say("tam", "Teacher added.", true); $("te").value = ""; loadTeachers();
  } catch (e) { say("tam", "Failed: " + (e.code || e.message)); }
}

async function assignTeacher() {
  const cid = $("tc").value, tid = $("tt").value, t = teachers.find(x => x.id === tid);
  if (!cid || !t) return say("tm", "Choose a course and a teacher.");
  try {
    await updateDoc(doc(db, "courses", cid), { teacherId: t.id, teacherName: t.name });
    say("tm", "Teacher assigned.", true); loadCourses();
  } catch (e) { say("tm", "Failed: " + (e.code || e.message)); }
}

async function addCoins() {
  const email = $("ce").value.trim().toLowerCase(), n = parseInt($("ca").value, 10);
  if (!email || !(n > 0)) return say("cm", "Enter the email and a number above 0.");
  try {
    const s = await getDocs(query(collection(db, "students"), where("email", "==", $("ce").value.trim())));
    if (s.empty) return say("cm", "No student with that email.");
    await updateDoc(s.docs[0].ref, { coins: increment(n) });
    const now = (await getDoc(s.docs[0].ref)).data().coins;
    say("cm", `Done. ${s.docs[0].data().name} now has ${now} coins.`, true);
  } catch (e) { say("cm", "Failed: " + (e.code || e.message)); }
}

async function addCourse() {
  const title = $("nt").value.trim();
  if (!title) return say("nm", "Enter a title.");
  try {
    await addDoc(collection(db, "courses"), { title, section: $("ns").value, level: $("nl").value.trim(), description: $("nd").value.trim(), price: Math.max(0, parseInt($("np").value, 10) || 0), order: parseInt($("no").value, 10) || 1, published: $("npub").checked, createdAt: serverTimestamp() });
    say("nm", "Course created.", true); $("nt").value = ""; $("nd").value = ""; loadCourses();
  } catch (e) { say("nm", "Failed: " + (e.code || e.message)); }
}

async function loadCourses() {
  const s = await getDocs(collection(db, "courses"));
  courses = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
  $("cl").innerHTML = courses.length ? courses.map(c => `<div class="it"><div><b>${esc(c.title)}</b><br><small>${esc(c.level || "")} · ${c.price || 0} coins · ${c.published ? "Published" : "Hidden"} · Teacher: ${esc(c.teacherName || "none")}</small></div>
    <div><button class="sm" data-p="${c.id}">${c.published ? "Hide" : "Publish"}</button><button class="sm" data-e="${c.id}">Price</button><button class="sm" data-d="${c.id}">Delete</button></div></div>`).join("") : "<p>No courses yet.</p>";
  $("cl").querySelectorAll("[data-p]").forEach(b => b.onclick = async () => { const c = courses.find(x => x.id === b.dataset.p); await updateDoc(doc(db, "courses", c.id), { published: !c.published }); loadCourses(); });
  $("cl").querySelectorAll("[data-e]").forEach(b => b.onclick = async () => { const v = prompt("New price in coins:"); if (v === null) return; await updateDoc(doc(db, "courses", b.dataset.e), { price: Math.max(0, parseInt(v, 10) || 0) }); loadCourses(); });
  $("cl").querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { if (!confirm("Delete this course and its lessons?")) return; const ls = await getDocs(collection(db, "courses", b.dataset.d, "lessons")); for (const l of ls.docs) await deleteDoc(l.ref); await deleteDoc(doc(db, "courses", b.dataset.d)); loadCourses(); });
  const opts = courses.map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join("");
  $("ls").innerHTML = opts; $("tc").innerHTML = opts;
  const prevK = $("kc").value; $("kc").innerHTML = opts; if (prevK) $("kc").value = prevK; certExams();
  if (!courses.find(c => c.id === sel)) sel = courses[0] ? courses[0].id : "";
  $("ls").value = sel; loadLessons();
}

async function addLesson() {
  const title = $("lt").value.trim();
  let content = $("lc").value.trim();
  if ($("ly").value === "jitsi" && !content) content = "siraj-" + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 8);
  if (!sel || !title || !content) return say("lm", "Choose a course, then enter the title and content.");
  try {
    await addDoc(collection(db, "courses", sel, "lessons"), { title, type: $("ly").value, content, when: $("lw").value.trim(), order: parseInt($("lo").value, 10) || 1 });
    say("lm", "Lesson added.", true); $("lt").value = ""; $("lc").value = ""; $("lo").value = (parseInt($("lo").value, 10) || 1) + 1; loadLessons();
  } catch (e) { say("lm", "Failed: " + (e.code || e.message)); }
}

async function loadLessons() {
  if (!sel) return $("ll").innerHTML = "";
  const s = await getDocs(collection(db, "courses", sel, "lessons"));
  const ls = s.docs.map(d => ({ ref: d.ref, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
  $("ll").innerHTML = ls.length ? ls.map((l, i) => `<div class="it"><span>${l.order}. ${esc(l.title)} <small>(${esc(l.type)})</small></span><button class="sm" data-x="${i}">Delete</button></div>`).join("") : "<p>No lessons in this course yet.</p>";
  $("ll").querySelectorAll("[data-x]").forEach(b => b.onclick = async () => { if (confirm("Delete this lesson?")) { await deleteDoc(ls[+b.dataset.x].ref); loadLessons(); } });
}
</script>
</body></html>
