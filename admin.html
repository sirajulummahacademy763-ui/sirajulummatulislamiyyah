const say = (id, t, ok) => { $(id).textContent = t; $(id).className = ok ? "ok" : "er"; };

onAuthStateChanged(auth, async u => {
  if (!u) return;
  let ok = false;
  try { ok = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch (e) {}
  if (!ok) return $("app").innerHTML = "<h1>Admin</h1><p>You do not have access to this page.</p>";
  build(); await loadTeachers(); await loadCourses(); loadPeople(); loadTerms(); loadAnns();
});

  $("cb").onclick = addCoins; $("nb").onclick = addCourse; $("lb").onclick = addLesson; $("tb").onclick = assignTeacher; $("tab").onclick = addTeacher; $("kc").onchange = certExams; $("kx").onchange = certList;
  const fillC = (id, a) => { $(id).innerHTML = a.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("") + '<option value="none">None</option>'; };
  fillC("si", BC.islamic); fillC("sw", BC.western); fillC("stl", BC.tech);

const pad2 = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
const fdate = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s);

async function addTerm() {
  const name = $("mn").value, session = $("ms").value.trim(), a = $("md1").value, b = $("md2").value;
  if (!session || !a || !b) return say("mm", "Enter the session (for example 2026/2027) and both dates.");
  if (b < a) return say("mm", "The end date must come after the start date.");
  try {
    await addDoc(collection(db, "terms"), { name, session, startDate: a, endDate: b, createdAt: serverTimestamp() });
    say("mm", "Term saved.", true); loadTerms();
  } catch (e) { say("mm", "Failed: " + (e.code || e.message)); }
}

async function loadTerms() {
  let ts = [];
  try { ts = (await getDocs(collection(db, "terms"))).docs.map(d => ({ id: d.id, ...d.data() })).sort((x, y) => String(x.startDate).localeCompare(String(y.startDate))); }
  catch (e) { $("ml").innerHTML = '<p class="er">Could not load: ' + esc(e.code || e.message) + "</p>"; return; }
  const t = todayStr();
  $("ml").innerHTML = ts.length ? ts.map(x => {
    const st = t < x.startDate ? "Upcoming" : t > x.endDate ? "Ended" : "Current term";
    return `<div class="it"><span><b>${esc(x.name)}</b> · ${esc(x.session)} <small>(${st})</small><br><small>${fdate(x.startDate)} to ${fdate(x.endDate)}</small></span>
      <span><button class="sm" data-me="${x.id}">Change dates</button><button class="sm" data-md="${x.id}">Delete</button></span></div>`;
  }).join("") : "<p>No terms yet.</p>";
  $("ml").querySelectorAll("[data-md]").forEach(b => b.onclick = async () => { if (!confirm("Delete this term?")) return; await deleteDoc(doc(db, "terms", b.dataset.md)); loadTerms(); });
  $("ml").querySelectorAll("[data-me]").forEach(b => b.onclick = async () => {
    const x = ts.find(k => k.id === b.dataset.me);
    const a = prompt("Begin date (year-month-day, for example 2026-09-14):", x.startDate); if (a === null) return;
    const e = prompt("End date (year-month-day, for example 2026-12-18):", x.endDate); if (e === null) return;
    if (!isDate(a) || !isDate(e) || e < a) return alert("Please use the format 2026-09-14 and make sure the end is after the begin date.");
    await updateDoc(doc(db, "terms", x.id), { startDate: a, endDate: e }); loadTerms();
  });
}

// English to Arabic (free online translation). Each line is translated on its own so the layout stays the same.
async function toArabic(text) {
  const lines = String(text).split("\n");
  const out = await Promise.all(lines.map(async ln => {
    if (!ln.trim()) return ln;
    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=" + encodeURIComponent(ln));
    if (!r.ok) throw new Error("translation error " + r.status);
    const j = await r.json();
    return (j[0] || []).map(x => x[0] || "").join("");
  }));
  return out.join("\n");
}
async function doTranslate() {
  const t = $("gt").value.trim(), m = $("gm").value.trim();
  if (!t && !m) return say("gs", "Write the English title and message first.");
  say("gs", "Translating...", true);
  try {
    if (t) $("gta").value = await toArabic(t);
    if (m) $("gma").value = await toArabic(m);
    say("gs", "Done. Read the Arabic and correct it if needed, then tap Send notice.", true);
  } catch (e) { say("gs", "Could not translate now (" + (e.message || e) + "). Check the internet, or type the Arabic yourself."); }
}

async function addAnn() {
  const t = $("gt").value.trim(), m = $("gm").value.trim();
  if (!t || !m) return say("gs", "Enter a title and a message.");
  let ta = $("gta").value.trim(), ma = $("gma").value.trim();
  if (!ta || !ma) {
    say("gs", "Translating to Arabic...", true);
    try { if (!ta) ta = await toArabic(t); if (!ma) ma = await toArabic(m); $("gta").value = ta; $("gma").value = ma; }
    catch (e) { if (!confirm("The Arabic translation did not work. Send the notice in English only?")) return say("gs", "Not sent. Tap Translate again, or type the Arabic yourself."); ta = ""; ma = ""; }
  }
  try {
    const wantEmail = $("ge").checked;
    const ref = await addDoc(collection(db, "announcements"), { title: t, body: m, ...(ta && ma ? { titleAr: ta, bodyAr: ma } : {}), pinned: $("gp").checked, createdAt: serverTimestamp() });
    $("gt").value = ""; $("gm").value = ""; $("gta").value = ""; $("gma").value = ""; $("gp").checked = false; loadAnns();
    say("gs", "Sent. Students on the site see it now. Sending phone alerts...", true);
    let msg = "Sent. Students on the site see it now", bad = [];
    try { const n = await pushAll(ref.id, t, m); msg += ", " + n + " phone" + (n === 1 ? "" : "s") + " alerted"; }
    catch (e) { bad.push("phone alerts failed: " + (e.message || e)); }
    if (wantEmail) {
      try { const n = await mailAll(t, ta ? m + "\n\n━━━━━━━━━━\n\n" + ta + "\n\n" + ma : m); msg += ", " + n + " email" + (n === 1 ? "" : "s") + " sent"; }
      catch (e) { bad.push("emails failed: " + (e.message || e)); }
    }
    say("gs", msg + "." + (bad.length ? " But " + bad.join("; ") + "." : ""), !bad.length);
  } catch (e) { say("gs", "Failed: " + (e.code || e.message)); }
}

// Ask the notice-push Worker to alert students' phones (it does 20 phones per call)
async function pushAll(id, title, body) {
  if (!WORKER_URL || WORKER_URL.indexOf("YOUR-NAME") > -1) throw new Error("Worker address not set yet");
  const tok = await auth.currentUser.getIdToken();
  let cursor = null, sent = 0;
  do {
    const r = await fetch(WORKER_URL + "/notify", { method: "POST", headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" }, body: JSON.stringify({ id, title, body: body.slice(0, 160), cursor }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("error " + r.status));
    sent += j.sent || 0; cursor = j.next || null;
    say("gs", "Sending phone alerts... " + sent + " so far.", true);
  } while (cursor);
  return sent;
}

// Ask the Worker to email every registered student (100 per call)
async function mailAll(title, body) {
  if (!WORKER_URL || WORKER_URL.indexOf("YOUR-NAME") > -1) throw new Error("Worker address not set yet");
  const tok = await auth.currentUser.getIdToken();
  let cursor = null, sent = 0;
  do {
    const r = await fetch(WORKER_URL + "/email", { method: "POST", headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" }, body: JSON.stringify({ title, body, cursor }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("error " + r.status));
    sent += j.sent || 0; cursor = j.next || null;
    say("gs", "Sending emails... " + sent + " so far.", true);
  } while (cursor);
  return sent;
}

async function loadAnns() {
  let as = [];
  try { as = (await getDocs(collection(db, "announcements"))).docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt ? b.createdAt.seconds : 0) - (a.createdAt ? a.createdAt.seconds : 0)); }
  catch (e) { $("gl").innerHTML = '<p class="er">Could not load: ' + esc(e.code || e.message) + "</p>"; return; }
  $("gl").innerHTML = as.length ? as.map(a => `<div class="it"><span><b>${esc(a.title)}</b>${a.pinned ? " · pinned" : ""}<br><small>${a.createdAt ? a.createdAt.toDate().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : ""}</small></span>
    <span><button class="sm" data-gp="${a.id}">${a.pinned ? "Unpin" : "Pin"}</button><button class="sm" data-gd="${a.id}">Delete</button></span></div>`).join("") : "<p>No notices sent yet.</p>";
  $("gl").querySelectorAll("[data-gd]").forEach(b => b.onclick = async () => { if (!confirm("Delete this notice?")) return; await deleteDoc(doc(db, "announcements", b.dataset.gd)); loadAnns(); });
  $("gl").querySelectorAll("[data-gp]").forEach(b => b.onclick = async () => { const a = as.find(k => k.id === b.dataset.gp); await updateDoc(doc(db, "announcements", a.id), { pinned: !a.pinned }); loadAnns(); });
}

let people = [];

async function loadPeople() {
  try { people = (await getDocs(collection(db, "students"))).docs.map(d => ({ id: d.id, ...d.data() })); }
  catch (e) { $("pl").innerHTML = '<p class="er">Could not load the students: ' + esc(e.code || e.message) + "</p>"; return; }
  drawPeople();
}

function drawPeople() {
  const tids = new Set(teachers.map(t => t.id));
  const studs = people.filter(p => !tids.has(p.id));
  const sec = $("pv").value, groups = {};
  BC[sec].forEach(c => groups[c] = []);
  const skipped = [], pending = [];
  studs.forEach(p => {
    if (!p.classes) pending.push(p);
    else if (groups[p.classes[sec]]) groups[p.classes[sec]].push(p);
    else skipped.push(p);
  });
  const byName = (a, b) => String(a.name || "").localeCompare(String(b.name || ""));
  const nm = p => `${esc(p.name || "Student")} <small>(${esc(p.email || "")})</small>`;
  const blk = (title, arr) => `<div style="margin-bottom:14px"><b>${esc(title)}</b> <small>· ${arr.length} student${arr.length === 1 ? "" : "s"}</small>${arr.length ? "<ol style='margin:6px 0 0 20px;padding:0'>" + arr.slice().sort(byName).map(p => `<li>${nm(p)}</li>`).join("") + "</ol>" : ""}</div>`;
  $("pc").textContent = studs.length + " students and " + teachers.length + " teachers in total.";
  $("pl").innerHTML = BC[sec].map(c => blk(c, groups[c])).join("") + blk("Not in this section", skipped) + blk("Has not chosen classes yet", pending);
  $("pt").innerHTML = teachers.length ? teachers.map(t => {
    const em = (people.find(p => p.id === t.id) || {}).email || "";
    const cs = courses.filter(c => c.teacherId === t.id).map(c => c.title);
    return `<div class="it"><span><b>${esc(t.name)}</b> <small>${esc(em)}</small><br><small>${cs.length ? "Courses: " + cs.map(esc).join(", ") : "No course assigned yet"}</small></span></div>`;
  }).join("") : "<p>No teachers yet.</p>";
}

async function setClasses() {
  const email = $("se").value.trim();
  if (!email) return say("smg", "Enter the student's email.");
  try {
    const s = await getDocs(query(collection(db, "students"), where("email", "==", email)));
    if (s.empty) return say("smg", "No student with that email.");
    await updateDoc(s.docs[0].ref, { classes: { islamic: $("si").value, western: $("sw").value, tech: $("stl").value } });
    say("smg", "Saved.", true); loadPeople();
  } catch (e) { say("smg", "Failed: " + (e.code || e.message)); }
}

async function addBook() {
  const title = $("bt").value.trim(), url = $("bu").value.trim(), f = $("bf").files[0];
  if (!title || (!url && !f)) return say("bm", "Enter the book title and choose a PDF file (or paste a link).");
  if (f) {
    if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf") return say("bm", "Please choose a PDF file.");
    if (f.size > 15 * 1024 * 1024) return say("bm", "The file is too big. The limit is 15 MB.");
  }
  $("bb").disabled = true;
  try {
    const ref = await addDoc(collection(db, "courses"), { title, kind: "book", section: $("bs").value, level: $("bc").value, description: "", price: Math.max(0, parseInt($("bp").value, 10) || 0), order: parseInt($("bo").value, 10) || 1, published: false, createdAt: serverTimestamp() });
    let content = url;
    if (f) {
      say("bm", "Reading the file...", true);
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("Could not read the file")); r.readAsDataURL(f); });
      const SZ = 700000, n = Math.ceil(data.length / SZ);
      for (let k = 0; k < n; k++) {
        say("bm", "Uploading " + (k + 1) + " of " + n + "...", true);
        await setDoc(doc(db, "courses", ref.id, "pdfParts", String(k).padStart(4, "0")), { i: k, data: data.slice(k * SZ, (k + 1) * SZ) });
      }
      content = "firestore:" + ref.id + ":" + n;
    }
    await addDoc(collection(db, "courses", ref.id, "lessons"), { title: "PDF", type: "pdf", content, when: "", order: 1 });
    await updateDoc(ref, { published: true });
    say("bm", "Book added.", true); $("bt").value = ""; $("bu").value = ""; $("bf").value = ""; loadCourses();
  } catch (e) { say("bm", "Failed: " + (e.code || e.message)); }
  $("bb").disabled = false;
}

let certEx = [];

async function certExams() {
  const cid = $("kc").value;
  if (!cid) { $("kx").innerHTML = ""; $("kr").innerHTML = ""; return; }
  const s = await getDocs(collection(db, "courses", cid, "exams"));
  certEx = s.docs.map(d => ({ id: d.id, ...d.data() }));
  $("kx").innerHTML = certEx.length ? certEx.map(x => `<option value="${x.id}">${esc(x.title)}</option>`).join("") : '<option value="">No tests or exams yet</option>';
  certList();
}

async function issueCert(cid, x, r) {
  const pct = Math.round(r.score / x.maxScore * 100), grade = pct >= 80 ? "Distinction" : pct >= 65 ? "Merit" : "Pass";
  const c = courses.find(k => k.id === cid);
  await setDoc(doc(db, "certificates", r.id), { uid: r.uid, studentName: r.studentName || "Student", courseId: cid, courseTitle: c ? c.title : "", examId: x.id, examTitle: x.title, score: r.score, maxScore: x.maxScore, grade, issuedAt: serverTimestamp(), issuedBy: "admin", price: Math.max(0, parseInt($("kp").value, 10) || 0) });
}

async function certList() {
  const cid = $("kc").value, x = certEx.find(e => e.id === $("kx").value);
  if (!x) { $("kr").innerHTML = "<p>Nothing here yet.</p>"; return; }
  const s = await getDocs(query(collection(db, "courses", cid, "examResults"), where("examId", "==", x.id)));
  const rs = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.status === "graded");
  const issued = {};
  await Promise.all(rs.map(async r => { try { const cs = await getDoc(doc(db, "certificates", r.id)); if (cs.exists()) issued[r.id] = cs.data(); } catch (e) {} }));
  const pass = rs.filter(r => r.score >= x.passMark);
  $("kr").innerHTML = (pass.some(r => !issued[r.id]) ? '<button id="kall" type="button">Issue certificates to all who passed</button> <span id="kmsg"></span>' : '<span id="kmsg"></span>') +
    (rs.length ? rs.map(r => `<div class="it"><span><b>${esc(r.studentName || "Student")}</b><br><small>${r.score} / ${x.maxScore} · ${r.score >= x.passMark ? "Passed" : "Not passed"}${issued[r.id] ? " · Certificate issued · " + (issued[r.id].price ? issued[r.id].price + " coins to view" : "free to view") : ""}</small></span>
      <span>${issued[r.id] ? `<button class="sm" data-kc="${r.id}">Price</button><button class="sm" data-kd="${r.id}">Remove</button>` : r.score >= x.passMark ? `<button class="sm" data-ki="${r.id}">Issue certificate</button>` : ""}</span></div>`).join("") : "<p>No marked results yet. Teachers must mark the exam first.</p>");
  $("kr").querySelectorAll("[data-ki]").forEach(b => b.onclick = async () => {
    try { await issueCert(cid, x, rs.find(r => r.id === b.dataset.ki)); certList(); } catch (e) { say("kmsg", "Failed: " + (e.code || e.message)); }
  });
  $("kr").querySelectorAll("[data-kc]").forEach(b => b.onclick = async () => {
    const v = prompt("Coins a student pays to view this certificate (0 = free):", issued[b.dataset.kc].price || 0); if (v === null) return;
    try { await updateDoc(doc(db, "certificates", b.dataset.kc), { price: Math.max(0, parseInt(v, 10) || 0) }); certList(); } catch (e) { say("kmsg", "Failed: " + (e.code || e.message)); }
  });
  $("kr").querySelectorAll("[data-kd]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this certificate?")) return;
    try { await deleteDoc(doc(db, "certificates", b.dataset.kd)); certList(); } catch (e) { say("kmsg", "Failed: " + (e.code || e.message)); }
  });
  if ($("kall")) $("kall").onclick = async () => {
    try { for (const r of pass) if (!issued[r.id]) await issueCert(cid, x, r); certList(); } catch (e) { say("kmsg", "Failed: " + (e.code || e.message)); }
  };
}

async function loadTeachers() {
  try {
    const s = await getDocs(collection(db, "teachers"));
    teachers = s.docs.map(d => ({ id: d.id, name: d.data().name || d.id }));
  } catch (e) { teachers = []; }
  $("tt").innerHTML = teachers.length ? teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("") : '<option value="">No teachers added yet</option>';
  if (people.length) drawPeople();
  $("tl").innerHTML = teachers.length ? teachers.map(t => `<div class="it"><span>${esc(t.name)}</span><button class="sm" data-rt="${t.id}">Remove</button></div>`).join("") : "<p>No teachers yet.</p>";
  $("tl").querySelectorAll("[data-rt]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this teacher?")) return;
    await deleteDoc(doc(db, "teachers", b.dataset.rt)); loadTeachers();
  });
}

async function addTeacher() {
  const email = $("te").value.trim();
  if (!email) return say("tam", "Enter the teacher's email.");
  try {
    const s = await getDocs(query(collection(db, "students"), where("email", "==", email)));
    if (s.empty) return say("tam", "No registered user with that email. They must register first.");
    const d = s.docs[0];
    await setDoc(doc(db, "teachers", d.id), { name: d.data().name || email, email });
    say("tam", "Teacher added.", true); $("te").value = ""; loadTeachers();
  } catch (e) { say("tam", "Failed: " + (e.code || e.message)); }
}

async function assignTeacher() {
  const cid = $("tc").value, tid = $("tt").value, t = teachers.find(x => x.id === tid);
  if (!cid || !t) return say("tm", "Choose a course and a teacher.");
  try {
    await updateDoc(doc(db, "courses", cid), { teacherId: t.id, teacherName: t.name });
    say("tm", "Teacher assigned.", true); loadCourses();
  } catch (e) { say("tm", "Failed: " + (e.code || e.message)); }
}

async function addCoins() {
  const email = $("ce").value.trim().toLowerCase(), n = parseInt($("ca").value, 10);
  if (!email || !(n > 0)) return say("cm", "Enter the email and a number above 0.");
  try {
    const s = await getDocs(query(collection(db, "students"), where("email", "==", $("ce").value.trim())));
    if (s.empty) return say("cm", "No student with that email.");
    await updateDoc(s.docs[0].ref, { coins: increment(n) });
    const now = (await getDoc(s.docs[0].ref)).data().coins;
    say("cm", `Done. ${s.docs[0].data().name} now has ${now} coins.`, true);
  } catch (e) { say("cm", "Failed: " + (e.code || e.message)); }
}

async function addCourse() {
  const title = $("nt").value.trim();
  if (!title) return say("nm", "Enter a title.");
  try {
    await addDoc(collection(db, "courses"), { title, section: $("ns").value, level: $("nl").value.trim(), description: $("nd").value.trim(), price: Math.max(0, parseInt($("np").value, 10) || 0), order: parseInt($("no").value, 10) || 1, published: $("npub").checked, createdAt: serverTimestamp() });
    say("nm", "Course created.", true); $("nt").value = ""; $("nd").value = ""; loadCourses();
  } catch (e) { say("nm", "Failed: " + (e.code || e.message)); }
}

async function loadCourses() {
  const s = await getDocs(collection(db, "courses"));
  courses = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
  $("cl").innerHTML = courses.length ? courses.map(c => `<div class="it"><div><b>${esc(c.title)}</b><br><small>${c.kind === "book" ? "BOOK · " : ""}${esc(c.level || "")} · ${c.price || 0} coins · ${c.published ? "Published" : "Hidden"} · Teacher: ${esc(c.teacherName || "none")}</small></div>
    <div><button class="sm" data-p="${c.id}">${c.published ? "Hide" : "Publish"}</button><button class="sm" data-e="${c.id}">Price</button><button class="sm" data-l="${c.id}">Class</button><button class="sm" data-d="${c.id}">Delete</button></div></div>`).join("") : "<p>No courses yet.</p>";
  $("cl").querySelectorAll("[data-p]").forEach(b => b.onclick = async () => { const c = courses.find(x => x.id === b.dataset.p); await updateDoc(doc(db, "courses", c.id), { published: !c.published }); loadCourses(); });
  $("cl").querySelectorAll("[data-e]").forEach(b => b.onclick = async () => { const v = prompt("New price in coins:"); if (v === null) return; await updateDoc(doc(db, "courses", b.dataset.e), { price: Math.max(0, parseInt(v, 10) || 0) }); loadCourses(); });
  $("cl").querySelectorAll("[data-l]").forEach(b => b.onclick = async () => { const c = courses.find(x => x.id === b.dataset.l); const v = prompt("Class or level for this one (exactly as in the list, for example Ibtidai 2, or All classes):", c.level || ""); if (v === null) return; await updateDoc(doc(db, "courses", c.id), { level: v.trim() }); loadCourses(); });
  $("cl").querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { if (!confirm("Delete this course and its lessons?")) return; const ls = await getDocs(collection(db, "courses", b.dataset.d, "lessons")); for (const l of ls.docs) await deleteDoc(l.ref); const ps = await getDocs(collection(db, "courses", b.dataset.d, "pdfParts")); for (const p of ps.docs) await deleteDoc(p.ref); await deleteDoc(doc(db, "courses", b.dataset.d)); loadCourses(); });
  const opts = courses.map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join("");
  $("ls").innerHTML = opts; $("tc").innerHTML = opts;
  const prevK = $("kc").value; $("kc").innerHTML = opts; if (prevK) $("kc").value = prevK; certExams();
  if (!courses.find(c => c.id === sel)) sel = courses[0] ? courses[0].id : "";
  $("ls").value = sel; loadLessons();
  if (people.length) drawPeople();
}

async function addLesson() {
  const title = $("lt").value.trim();
  let content = $("lc").value.trim();
  if ($("ly").value === "jitsi" && !content) content = "siraj-" + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 8);
  if (!sel || !title || !content) return say("lm", "Choose a course, then enter the title and content.");
  try {
    await addDoc(collection(db, "courses", sel, "lessons"), { title, type: $("ly").value, content, when: $("lw").value.trim(), order: parseInt($("lo").value, 10) || 1 });
    say("lm", "Lesson added.", true); $("lt").value = ""; $("lc").value = ""; $("lo").value = (parseInt($("lo").value, 10) || 1) + 1; loadLessons();
  } catch (e) { say("lm", "Failed: " + (e.code || e.message)); }
}

async function loadLessons() {
  if (!sel) return $("ll").innerHTML = "";
  const s = await getDocs(collection(db, "courses", sel, "lessons"));
  const ls = s.docs.map(d => ({ ref: d.ref, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
  $("ll").innerHTML = ls.length ? ls.map((l, i) => `<div class="it"><span>${l.order}. ${esc(l.title)} <small>(${esc(l.type)})</small></span><button class="sm" data-x="${i}">Delete</button></div>`).join("") : "<p>No lessons in this course yet.</p>";
  $("ll").querySelectorAll("[data-x]").forEach(b => b.onclick = async () => { if (confirm("Delete this lesson?")) { await deleteDoc(ls[+b.dataset.x].ref); loadLessons(); } });
}
</script>
