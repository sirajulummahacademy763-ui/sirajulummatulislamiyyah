<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.ca{max-width:820px}
.hint{color:#4b5072;font-size:.92rem}
.cl{font-family:Amiri,serif;font-size:1.5rem;margin:22px 0 6px}
.cl small{font-family:Figtree,sans-serif;font-size:.6em;color:#4b5072;font-weight:500}
.seg{display:inline-flex;border:1.5px solid #12163a;border-radius:999px;overflow:hidden;margin:6px 0 4px}
.seg button{font:inherit;font-weight:700;padding:9px 16px;border:0;background:#fff;color:#12163a;cursor:pointer}
.seg button.on{background:#12163a;color:#fff}
.po{background:#fff;border:1.5px solid #cfd3e8;border-left:5px solid #f5b94a;border-radius:12px;padding:12px 14px;margin-top:10px}
.po.note{border-left-color:#12163a}
.po b{font-size:1.05rem}
.po .mt{color:#4b5072;font-size:.85rem;margin:2px 0 6px}
.po .tx{white-space:pre-wrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;background:#fdf1d4;color:#8a5a00;margin-right:6px}
.pill.n{background:#e8ebf8;color:#12163a}
.pill.d{background:#fde4e1;color:#b3261e}
.er{color:#b3261e}
</style></head><body>
<main class="page ca" id="app"><p>Loading...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const SN = { islamic: "Arabic and Islamic", western: "Western", tech: "Technology" };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
let data = [], filt = "all";
onAuthStateChanged(auth, async u => {
  if (!u) return $("app").innerHTML = '<h1>Homework</h1><p>Please <a href="login.html">log in</a> first.</p>';
  try {
    const s = await getDoc(doc(db, "students", u.uid));
    const classes = s.exists() ? (s.data().classes || {}) : {};
    for (const sec of Object.keys(SN)) {
      const lv = classes[sec]; if (!lv || lv === "none") continue;
      const q = await getDocs(query(collection(db, "classWork"), where("classKey", "==", sec + "|" + lv)));
      data.push({ sec, lv, posts: q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ((b.createdAt && b.createdAt.seconds) || 9e9) - ((a.createdAt && a.createdAt.seconds) || 9e9)) });
    }
    draw();
  } catch (e) { $("app").innerHTML = '<h1>Homework</h1><p class="er">Could not load: ' + esc(e.code || e.message) + "</p>"; }
});
function draw() {
  let h = `<h1>Homework and Notes · الواجبات</h1><div class="seg" id="sg"><button data-f="all" class="${filt === "all" ? "on" : ""}">All</button><button data-f="homework" class="${filt === "homework" ? "on" : ""}">Homework</button><button data-f="note" class="${filt === "note" ? "on" : ""}">Class notes</button></div>`;
  if (!data.length) h += '<p class="hint">You have not chosen your classes yet. Open the Home page and choose them.</p>';
  data.forEach(g => {
    const ps = g.posts.filter(p => filt === "all" || p.kind === filt);
    h += `<div class="cl">${esc(g.lv)} <small>${SN[g.sec]}</small></div>`;
    h += ps.length ? ps.map(p => {
      const late = p.kind === "homework" && p.due && p.due < today();
      return `<div class="po ${p.kind === "note" ? "note" : ""}"><span class="pill ${p.kind === "note" ? "n" : ""}">${p.kind === "note" ? "Note" : "Homework"}</span><b>${esc(p.title)}</b>
        <div class="mt">${esc(p.subject || "General")}${p.due ? ` · <span class="${late ? "pill d" : ""}">due ${esc(p.due)}${late ? " (past)" : ""}</span>` : ""}${p.teacherName ? " · " + esc(p.teacherName) : ""}</div>
        ${p.body ? `<div class="tx">${esc(p.body)}</div>` : ""}</div>`;
    }).join("") : '<p class="hint">Nothing here yet.</p>';
  });
  $("app").innerHTML = h;
  $("app").querySelectorAll("#sg button").forEach(b => b.onclick = () => { filt = b.dataset.f; draw(); });
}
</script></body></html>
