<!DOCTYPE html>
<html lang="en"><head>
<!-- sec-v1 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://www.recaptcha.net https://js.paystack.co https://checkout.flutterwave.com https://meet.jit.si https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://www.google.com https://www.recaptcha.net https://*.googleapis.com https://www.gstatic.com https://*.workers.dev https://api.alquran.cloud https://cdn.mp3quran.net https://archive.org https://*.archive.org https://*.flutterwave.com https://api.paystack.co https://meet.jit.si wss://meet.jit.si; frame-src https://www.google.com https://www.recaptcha.net https://www.youtube-nocookie.com https://drive.google.com https://meet.jit.si https://checkout.flutterwave.com https://checkout.paystack.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">

<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.ca{max-width:820px}
.hint{color:#4b5072;font-size:.92rem}
.cl{font-family:Amiri,serif;font-size:1.5rem;margin:22px 0 6px}
.cl small{font-family:Figtree,sans-serif;font-size:.6em;color:#4b5072;font-weight:500}
.seg{display:inline-flex;border:1.5px solid #12163a;border-radius:999px;overflow:hidden;margin:6px 0 4px}
.seg button{font:inherit;font-weight:700;padding:9px 16px;border:0;background:#fff;color:#12163a;cursor:pointer}
.seg button.on{background:#12163a;color:#fff}
.po{background:#fff;border:1.5px solid #cfd3e8;border-left:5px solid #f5b94a;border-radius:12px;padding:12px 14px;margin-top:10px}
.po.note{border-left-color:#12163a}
.po b{font-size:1.05rem}
.po .mt{color:#4b5072;font-size:.85rem;margin:2px 0 6px}
.po .tx{white-space:pre-wrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;background:#fdf1d4;color:#8a5a00;margin-right:6px}
.pill.n{background:#e8ebf8;color:#12163a}
.pill.d{background:#fde4e1;color:#b3261e}
.er{color:#b3261e}.ok{color:#1c7a4d}
.sub{margin-top:10px;border-top:1px dashed #cfd3e8;padding-top:10px}
.sub textarea{width:100%;box-sizing:border-box;padding:10px;border:1.5px solid #cfd3e8;border-radius:8px;font:inherit;background:#fff;min-height:90px}
.sub .bt{font:inherit;font-weight:700;padding:9px 16px;border:0;border-radius:10px;background:#12163a;color:#fff;cursor:pointer;margin-top:8px}
.sub .bt.l{background:#fff;color:#12163a;border:1.5px solid #12163a}
.sub .ans{background:#f4f6fc;border-radius:8px;padding:8px 10px;white-space:pre-wrap;margin:6px 0}
.pill.g{background:#dff3e7;color:#1c7a4d}
.sub .bt.r{background:#b3261e}
.sub .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.sub .tools label{font:inherit;font-weight:700;padding:9px 16px;border:1.5px solid #12163a;border-radius:10px;background:#fff;color:#12163a;cursor:pointer}
.sub .tools input[type=file]{display:none}
.sub audio{width:100%;margin:6px 0}
.sub img.ph{max-width:100%;max-height:300px;border-radius:8px;display:block;margin:6px 0}
.sub .rm{background:none;border:0;color:#b3261e;font:inherit;font-weight:700;cursor:pointer;padding:0;margin-left:8px}
.recdot{display:inline-block;background:#fde4e1;color:#b3261e;border-radius:999px;padding:3px 12px;font-weight:700}
</style></head><body>
<main class="page ca" id="app"><p>Loading...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc, setDoc, updateDoc, deleteField, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const SN = { islamic: "Arabic and Islamic", western: "Western", tech: "Technology" };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
let data = [], filt = "all", me = null, myName = "", subs = {}, editing = null, msgs = {};
onAuthStateChanged(auth, async u => {
  if (!u) return $("app").innerHTML = '<h1>Homework</h1><p>Please <a href="login.html">log in</a> first.</p>';
  try {
    const s = await getDoc(doc(db, "students", u.uid));
    me = u; myName = s.exists() ? (s.data().name || u.email || "Student") : "Student";
    const classes = s.exists() ? (s.data().classes || {}) : {};
    for (const sec of Object.keys(SN)) {
      const lv = classes[sec]; if (!lv || lv === "none") continue;
      const q = await getDocs(query(collection(db, "classWork"), where("classKey", "==", sec + "|" + lv)));
      data.push({ sec, lv, posts: q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ((b.createdAt && b.createdAt.seconds) || 9e9) - ((a.createdAt && a.createdAt.seconds) || 9e9)) });
    }
    try { (await getDocs(query(collection(db, "classWorkSubs"), where("uid", "==", u.uid)))).docs.forEach(d => { subs[d.data().workId] = d.data(); }); } catch (e) {}
    draw();
  } catch (e) { $("app").innerHTML = '<h1>Homework</h1><p class="er">Could not load: ' + esc(e.code || e.message) + "</p>"; }
});
const draft = {};
const dr = id => draft[id] || (draft[id] = { text: null, audio: null, photo: null });
const okAudio = u => /^data:audio\//.test(u || "");
const okImg = u => /^data:image\//.test(u || "");
let rec = null, recId = null;
const keep = id => { const t = $("a_" + id); if (t) dr(id).text = t.value; };
const blobUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function startRec(id) {
  keep(id);
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mt = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(st, mt ? { mimeType: mt, audioBitsPerSecond: 20000 } : { audioBitsPerSecond: 20000 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      st.getTracks().forEach(t => t.stop());
      const url = await blobUrl(new Blob(chunks, { type: (rec && rec.mimeType) || mt || "audio/webm" }));
      if (url.length > 560000) msgs[id] = { t: "The recording is too long. Please keep it under 90 seconds." };
      else if (!okAudio(url)) msgs[id] = { t: "This phone could not make a voice recording." };
      else { dr(id).audio = url; msgs[id] = null; }
      recId = null; rec = null; draw();
    };
    rec.start(); recId = id; msgs[id] = null; draw();
    setTimeout(() => { if (recId === id && rec && rec.state === "recording") rec.stop(); }, 90000);
  } catch (e) { msgs[id] = { t: "Could not use the microphone. Please allow microphone access and try again." }; draw(); }
}
function stopRec() { if (rec && rec.state === "recording") rec.stop(); }
function shrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      for (const [w, q] of [[900, .6], [700, .5], [520, .45]]) {
        const k = Math.min(1, w / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const cx = c.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, c.width, c.height); cx.drawImage(im, 0, 0, c.width, c.height);
        const u = c.toDataURL("image/jpeg", q); if (u.length < 380000) return res(u);
      }
      rej(new Error("The picture is too big."));
    }; im.onerror = () => rej(new Error("That file is not a picture.")); im.src = r.result; };
    r.onerror = () => rej(new Error("Could not read the picture."));
    r.readAsDataURL(file);
  });
}
async function pickPhoto(id, file) {
  keep(id);
  try { dr(id).photo = await shrink(file); msgs[id] = null; } catch (e) { msgs[id] = { t: e.message }; }
  draw();
}
function media(a, ph) {
  return (okAudio(a) ? `<audio controls preload="none" src="${a}"></audio>` : "") + (okImg(ph) ? `<img class="ph" src="${ph}" alt="Photo of the answer">` : "");
}
function subBox(p) {
  const m = msgs[p.id] ? `<div class="${msgs[p.id].g ? "ok" : "er"}">${esc(msgs[p.id].t)}</div>` : "";
  const sb = subs[p.id];
  if (sb && editing !== p.id) {
    const graded = sb.status === "graded";
    return `<div class="sub"><span class="pill ${graded ? "g" : ""}">${graded ? "Marked" : "Submitted"}</span>Your answer:${sb.text ? `<div class="ans">${esc(sb.text)}</div>` : ""}${media(sb.audio, sb.photo)}
      ${graded ? `<div><b>Mark:</b> ${esc(sb.score || "-")}${sb.feedback ? `<br><b>Teacher:</b> ${esc(sb.feedback)}` : ""}</div>` : `<button class="bt l" data-edit="${p.id}" type="button">Change my answer</button>`}${m}</div>`;
  }
  const d = dr(p.id);
  if (d.text === null) { d.text = sb ? sb.text || "" : ""; if (sb && !d.audio && sb.audio) d.audio = sb.audio; if (sb && !d.photo && sb.photo) d.photo = sb.photo; }
  const recording = recId === p.id;
  return `<div class="sub"><label for="a_${p.id}"><b>Your answer</b></label><textarea id="a_${p.id}" placeholder="Write your answer here, or record your voice, or add a photo">${esc(d.text)}</textarea>
    <div class="tools">${recording ? `<span class="recdot">● Recording...</span><button class="bt r" data-stop="1" type="button">Stop</button>` : `<button class="bt l" data-rec="${p.id}" type="button">🎤 Record my voice</button>`}
    <label>📷 Add a photo<input type="file" accept="image/*" data-ph="${p.id}"></label></div>
    ${d.audio ? `<div>${media(d.audio, null)}<button class="rm" data-rma="${p.id}" type="button">Remove voice</button></div>` : ""}
    ${d.photo ? `<div>${media(null, d.photo)}<button class="rm" data-rmp="${p.id}" type="button">Remove photo</button></div>` : ""}
    <button class="bt" data-send="${p.id}" type="button">${sb ? "Save answer" : "Submit homework"}</button>${m}</div>`;
}
async function send(id) {
  const d = dr(id), el = $("a_" + id), t = ((el ? el.value : d.text) || "").trim();
  if (!t && !d.audio && !d.photo) { msgs[id] = { t: "Write your answer, record your voice, or add a photo first." }; return draw(); }
  const p = data.flatMap(g => g.posts).find(x => x.id === id);
  try {
    const ref = doc(db, "classWorkSubs", id + "_" + me.uid);
    if (subs[id]) {
      const u = { text: t, updatedAt: serverTimestamp(), audio: d.audio || deleteField(), photo: d.photo || deleteField() };
      await updateDoc(ref, u);
      subs[id].text = t; subs[id].audio = d.audio || null; subs[id].photo = d.photo || null;
    } else {
      const v = { workId: id, uid: me.uid, studentName: myName, classKey: p.classKey, text: t, status: "submitted", createdAt: serverTimestamp() };
      if (d.audio) v.audio = d.audio; if (d.photo) v.photo = d.photo;
      await setDoc(ref, v); subs[id] = v;
    }
    delete draft[id]; editing = null; msgs[id] = { t: "Submitted. Your teacher can see it now.", g: true };
  } catch (e) { msgs[id] = { t: "Could not submit: " + (e.code || e.message) }; }
  draw();
}
function draw() {
  document.querySelectorAll('textarea[id^="a_"]').forEach(t => { dr(t.id.slice(2)).text = t.value; });
  let h = `<h1>Homework and Notes · الواجبات</h1><div class="seg" id="sg"><button data-f="all" class="${filt === "all" ? "on" : ""}">All</button><button data-f="homework" class="${filt === "homework" ? "on" : ""}">Homework</button><button data-f="note" class="${filt === "note" ? "on" : ""}">Class notes</button></div>`;
  if (!data.length) h += '<p class="hint">You have not chosen your classes yet. Open the Home page and choose them.</p>';
  data.forEach(g => {
    const ps = g.posts.filter(p => filt === "all" || p.kind === filt);
    h += `<div class="cl">${esc(g.lv)} <small>${SN[g.sec]}</small></div>`;
    h += ps.length ? ps.map(p => {
      const late = p.kind === "homework" && p.due && p.due < today();
      return `<div class="po ${p.kind === "note" ? "note" : ""}"><span class="pill ${p.kind === "note" ? "n" : ""}">${p.kind === "note" ? "Note" : "Homework"}</span><b>${esc(p.title)}</b>
        <div class="mt">${esc(p.subject || "General")}${p.due ? ` · <span class="${late ? "pill d" : ""}">due ${esc(p.due)}${late ? " (past)" : ""}</span>` : ""}${p.teacherName ? " · " + esc(p.teacherName) : ""}</div>
        ${p.body ? `<div class="tx">${esc(p.body)}</div>` : ""}${p.kind === "homework" ? subBox(p) : ""}</div>`;
    }).join("") : '<p class="hint">Nothing here yet.</p>';
  });
  $("app").innerHTML = h;
  $("app").querySelectorAll("[data-send]").forEach(b => b.onclick = () => send(b.dataset.send));
  $("app").querySelectorAll("[data-rec]").forEach(b => b.onclick = () => startRec(b.dataset.rec));
  $("app").querySelectorAll("[data-stop]").forEach(b => b.onclick = stopRec);
  $("app").querySelectorAll("[data-ph]").forEach(i => i.onchange = () => { if (i.files[0]) pickPhoto(i.dataset.ph, i.files[0]); });
  $("app").querySelectorAll("[data-rma]").forEach(b => b.onclick = () => { keep(b.dataset.rma); dr(b.dataset.rma).audio = null; draw(); });
  $("app").querySelectorAll("[data-rmp]").forEach(b => b.onclick = () => { keep(b.dataset.rmp); dr(b.dataset.rmp).photo = null; draw(); });
  $("app").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { editing = b.dataset.edit; delete draft[b.dataset.edit]; draw(); });
  $("app").querySelectorAll("#sg button").forEach(b => b.onclick = () => { filt = b.dataset.f; draw(); });
}
</script></body></html>
