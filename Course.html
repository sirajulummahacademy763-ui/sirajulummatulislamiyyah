<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.pg{max-width:1000px}
.cl{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
.ls{list-style:none;margin:0;padding:0;border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.ls li button{width:100%;text-align:left;font:inherit;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;cursor:pointer}
.ls li button.on{background:#fff3d6;font-weight:700}
.ls small{display:block;color:#4b5072}
.vw{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:18px;min-height:240px}
.vw iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}
.vw .tx{white-space:pre-wrap;line-height:1.8;font-size:1.05rem}
.nv{display:flex;gap:10px;margin-top:14px}
.nv button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:var(--night);color:#fff;cursor:pointer}
@media(max-width:760px){.cl{grid-template-columns:1fr}}
</style></head><body>
<main class="page pg">
<a href="courses.html">&larr; All courses</a>
<h1 id="ttl">Course</h1>
<p class="lead" id="dsc"></p>
<div id="box"><p>Loading...</p></div>
</main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const id = new URLSearchParams(location.search).get("id") || "";
let lessons = [], cur = 0;

function embed(u) {
  const m = String(u).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  if (m) return "https://www.youtube-nocookie.com/embed/" + m[1];
  return /^https:\/\/player\.vimeo\.com\//.test(u) ? u : "";
}

onAuthStateChanged(auth, async user => {
  if (!user) return;
  try {
    const c = await getDoc(doc(db, "courses", id));
    if (!c.exists()) return $("box").innerHTML = "<p>This course was not found.</p>";
    $("ttl").textContent = c.data().title; $("dsc").textContent = c.data().description || "";
    document.title = c.data().title + " | Sirajul Ummah Islamic Institute";
    let snap;
    try { snap = await getDocs(collection(db, "courses", id, "lessons")); }
    catch (e) { return $("box").innerHTML = '<p>You need to unlock this course first. <a href="courses.html">Go to courses</a></p>'; }
    lessons = snap.docs.map(d => d.data()).sort((a, b) => (a.order || 0) - (b.order || 0));
    if (!lessons.length) return $("box").innerHTML = "<p>Lessons are coming soon.</p>";
    show(0);
  } catch (e) { console.error(e); $("box").innerHTML = `<p>Could not load this course (${esc(e.code || e.message)}).</p>`; }
});

function show(i) {
  cur = i; const l = lessons[i];
  let body = "";
  if (l.type === "video") { const e = embed(l.content); body = e ? `<iframe src="${esc(e)}" allowfullscreen title="${esc(l.title)}"></iframe>` : "<p>This video link is not supported.</p>"; }
  else if (l.type === "live") body = `<h3>Live class</h3><p>${esc(l.when || "Time to be announced")}</p><p><a class="btn" href="${esc(l.content)}" target="_blank" rel="noopener">Join the live class</a></p>`;
  else body = `<div class="tx">${esc(l.content)}</div>`;
  $("box").innerHTML = `<div class="cl"><ul class="ls">${lessons.map((x, k) => `<li><button type="button" data-i="${k}" class="${k === i ? "on" : ""}">${k + 1}. ${esc(x.title)}<small>${esc(x.type)}</small></button></li>`).join("")}</ul>
    <div><div class="vw"><h2 style="margin-top:0">${esc(l.title)}</h2>${body}</div>
    <div class="nv"><button type="button" id="pv" ${i === 0 ? "disabled" : ""}>Previous</button><button type="button" id="nx" ${i === lessons.length - 1 ? "disabled" : ""}>Next lesson</button></div></div></div>`;
  $("box").querySelectorAll("[data-i]").forEach(b => b.onclick = () => show(+b.dataset.i));
  $("pv").onclick = () => show(cur - 1); $("nx").onclick = () => show(cur + 1);
}
</script>
</body></html>
