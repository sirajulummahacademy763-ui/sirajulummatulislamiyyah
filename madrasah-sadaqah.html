<html lang="en"><head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://www.recaptcha.net https://js.paystack.co https://checkout.flutterwave.com https://meet.jit.si https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://www.google.com https://www.recaptcha.net https://*.googleapis.com https://www.gstatic.com https://*.workers.dev https://api.alquran.cloud https://cdn.mp3quran.net https://archive.org https://*.archive.org https://*.flutterwave.com https://api.paystack.co https://meet.jit.si wss://meet.jit.si; frame-src https://www.google.com https://www.recaptcha.net https://www.youtube-nocookie.com https://drive.google.com https://meet.jit.si https://checkout.flutterwave.com https://checkout.paystack.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sadaqah Jariyah | Sirajul Ummah Madrasah</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#f1f3fa;color:#12163a}
header{background:linear-gradient(160deg,#12163a,#2a3170);color:#fff;text-align:center;padding:26px 16px 30px}
header .ar{font-family:Amiri,serif;font-size:2.2rem;color:#e6c55a}
header h1{margin:2px 0 0;font-size:1.2rem}
main{max-width:640px;margin:-14px auto 40px;padding:0 14px}
.cd{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(18,22,58,.08)}
.q{font-family:Amiri,serif;font-size:1.15rem;line-height:1.6;color:#2a3170}
.hint{color:#4b5072;font-size:.92rem}
h2{margin:0 0 6px;font-size:1.1rem}
.bar{height:12px;border-radius:7px;background:#e5534b;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#1c9a5d}
.nm{display:flex;justify-content:space-between;font-weight:800;font-size:.95rem}.gr{color:#1c7a4d}.rd{color:#d03a32}
.acc{background:#f6f7fc;border-radius:12px;padding:12px;margin-top:8px}
.acc b{font-size:1.3rem;letter-spacing:1px}
.b{display:block;text-align:center;text-decoration:none;width:100%;margin-top:10px;font:inherit;font-weight:800;padding:13px;border:0;border-radius:10px;background:#12163a;color:#fff;cursor:pointer}
.b.g{background:#fff;color:#12163a;border:1.5px solid #12163a}.b.w{background:#1fa855}
</style></head><body>
<header><div class="ar">الصدقة الجارية</div><h1>Sadaqah Jariyah &mdash; ongoing charity</h1></header>
<main id="app"><div class="cd"><p>Loading...</p></div></main>
<script type="module">
import { WORKER_URL } from "./notice-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const N = x => "₦" + Number(x || 0).toLocaleString();
(async () => {
  let s = {};
  try { const r = await fetch(WORKER_URL + "/mad/sadaqah", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); s = (await r.json()).settings || {}; } catch (e) {}
  const wa = String(s.contact || "").replace(/\D/g, "").replace(/^0/, "234");
  let h = `<div class="cd"><div class="q">The Prophet &#65018; said: when a person dies, his deeds come to an end except three: ongoing charity (sadaqah jariyah), knowledge that benefits others, and a righteous child who prays for him. (Muslim)</div></div>`;
  if (s.intro) h += `<div class="cd"><p style="margin:0;white-space:pre-line">${esc(s.intro)}</p></div>`;
  (s.projects || []).forEach(p => {
    const t = Number(p.target || 0), r = Number(p.raised || 0), pct = t ? Math.min(100, r / t * 100) : 0;
    h += `<div class="cd"><h2>${esc(p.title)}</h2>${p.desc ? `<p class="hint" style="margin:0 0 6px;white-space:pre-line">${esc(p.desc)}</p>` : ""}${t ? `<div class="bar"><i style="width:${pct}%"></i></div><div class="nm"><span class="gr">Raised ${N(r)}</span><span class="rd">Remaining ${N(Math.max(0, t - r))}</span></div><div class="hint">Target ${N(t)}${r >= t ? " &middot; <b class='gr'>Completed, Alhamdulillah &#10003;</b>" : ""}</div>` : ""}</div>`;
  });
  if (s.accNo) h += `<div class="cd"><h2>How to give</h2><div class="acc"><div class="hint">${esc(s.bankName || "Bank")}</div><b id="an">${esc(s.accNo)}</b><div>${esc(s.accName || "")}</div></div><button class="b g" id="cp">Copy account number</button></div>`;
  if (wa) h += `<div class="cd"><h2>Send your proof of payment</h2><p class="hint" style="margin:0">After giving, send a short message so we can record it.</p><a class="b w" href="https://wa.me/${wa}?text=${encodeURIComponent("Assalamu alaikum, I gave Sadaqah Jariyah.")}">Message us on WhatsApp</a></div>`;
  if (!s.intro && !(s.projects || []).length && !s.accNo) h += `<div class="cd"><p class="hint">Details will be added soon, in shaa Allah.</p></div>`;
  h += `<p class="hint" style="text-align:center">May Allah accept from you and make it a reward that never ends.</p><a class="b g" href="madrasah.html">Back to parents' page</a>`;
  $("app").innerHTML = h;
  const cp = $("cp"); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(String(s.accNo)); cp.textContent = "Copied ✓"; } catch (e) { cp.textContent = "Copy it by hand: " + s.accNo; } };
})();
</script></body></html>
