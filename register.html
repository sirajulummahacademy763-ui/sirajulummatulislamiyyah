<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account | Sirajul Ummah Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#12163a;--deep:#1c2150;--lamp:#f5b94a;--mist:#eef0f8;--ink:#171a33;--line:#cfd3e8;--err:#b3261e;--ok:#1c7a4d}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--mist);line-height:1.5}
.wrap{display:grid;grid-template-columns:minmax(280px,5fr) 7fr;min-height:100vh}
aside{background:radial-gradient(circle at 50% 38%,rgba(245,185,74,.38),transparent 55%),var(--night);color:#fff;padding:48px 36px;display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:0;height:100vh}
aside a{color:#fff;text-decoration:none;font-weight:700}
.big{font-family:Amiri,serif;font-size:clamp(96px,14vw,190px);line-height:1;text-align:center;color:var(--lamp);text-shadow:0 0 50px rgba(245,185,74,.55);animation:glow 3.2s ease-in-out infinite alternate}
@keyframes glow{to{text-shadow:0 0 90px rgba(245,185,74,.85)}}
aside p{font-family:Amiri,serif;font-size:1.35rem;margin:0;max-width:26ch}
aside small{opacity:.75}
main{padding:48px clamp(20px,5vw,72px);max-width:760px}
h1{font-family:Amiri,serif;font-size:2.4rem;margin:0 0 4px}
.sub{margin:0 0 28px;color:#4b5072}
fieldset{border:0;border-top:2px solid var(--line);margin:0 0 24px;padding:18px 0 0}
legend{font-weight:700;padding-right:12px;color:var(--deep)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{display:block;font-size:.9rem;font-weight:500;margin-bottom:4px}
input[type=text],input[type=email],input[type=tel],input[type=password],select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--lamp);outline-offset:1px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;margin:0;cursor:pointer}
.terms{display:flex;gap:8px;align-items:flex-start}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--night);color:#fff;font:700 1.05rem Figtree,sans-serif;cursor:pointer}
button:hover{background:var(--deep)}button:disabled{opacity:.6;cursor:wait}
#msg{margin:14px 0;padding:12px 14px;border-radius:8px;display:none;font-weight:500}
#msg.err{display:block;background:#fdecea;color:var(--err)}#msg.ok{display:block;background:#e6f4ec;color:var(--ok)}
.foot{margin-top:16px;text-align:center}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto;padding:28px 24px;gap:8px}.big{font-size:84px}aside p,aside small{display:none}.grid,.checks{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.big{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<aside>
  <a href="index.html">Sirajul Ummah Al-Islamiyyah Academy</a>
  <div class="big" aria-hidden="true">سراج</div>
  <div><p>Siraj means lamp. Light one for your learning.</p><small>Qur'an, Hadith, Arabic and Islamic studies.</small></div>
</aside>
<main>
  <h1>Create your student account</h1>
  <p class="sub">Free to join. Fields marked * are required.</p>
  <form id="f" novalidate>
    <fieldset><legend>About you</legend>
      <div class="grid">
        <div class="full"><label for="name">Full name *</label><input id="name" type="text" autocomplete="name"></div>
        <div><label for="email">Email *</label><input id="email" type="email" autocomplete="email"></div>
        <div><label for="phone">Phone number *</label><input id="phone" type="tel" autocomplete="tel"></div>
        <div><label for="country">Country</label><input id="country" type="text" autocomplete="country-name"></div>
        <div><label for="level">Education level</label>
          <select id="level"><option value="">Select</option><option>Child</option><option>Primary school</option><option>Secondary school</option><option>University</option><option>Adult learner</option></select></div>
      </div>
    </fieldset>
    <fieldset><legend>What do you want to learn?</legend>
      <div class="checks" id="interests">
        <label><input type="checkbox" value="Qur'an & Tajweed"> Qur'an &amp; Tajweed</label>
        <label><input type="checkbox" value="Hadith & Sunnah"> Hadith &amp; Sunnah</label>
        <label><input type="checkbox" value="Arabic"> Arabic</label>
        <label><input type="checkbox" value="Tafsir"> Tafsir</label>
        <label><input type="checkbox" value="Fiqh"> Fiqh</label>
        <label><input type="checkbox" value="Islamic studies for children"> Children's studies</label>
      </div>
    </fieldset>
    <fieldset><legend>Password</legend>
      <div class="grid">
        <div><label for="pw">Password * (8+ characters)</label><input id="pw" type="password" autocomplete="new-password"></div>
        <div><label for="pw2">Confirm password *</label><input id="pw2" type="password" autocomplete="new-password"></div>
      </div>
    </fieldset>
    <label class="terms"><input id="terms" type="checkbox"> <span>I confirm my details are correct and I agree to the <a href="terms.html">terms</a> and <a href="privacy.html">privacy policy</a>.</span></label>
    <div id="msg" role="alert"></div>
    <button id="btn" type="submit">Create my account</button>
    <p class="foot">Already registered? <a href="login.html">Log in</a></p>
  </form>
</main>
</div>

<script type="module">
import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";

const $ = id => document.getElementById(id);
const msg = (t, c) => { $("msg").textContent = t; $("msg").className = c; };

const errors = {
  "auth/email-already-in-use": "This email already has an account. Try logging in.",
  "auth/invalid-email": "Enter a valid email address.",
  "auth/weak-password": "Password is too weak. Use at least 8 characters.",
  "auth/network-request-failed": "No internet connection. Check it and try again.",
  "auth/operation-not-allowed": "Email/Password sign-in is not enabled in Firebase yet.",
  "auth/invalid-api-key": "The Firebase config is missing or wrong in firebase-config.js.",
  "permission-denied": "Database rules blocked saving. Check Firestore rules."
};

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("name").value.trim(), email = $("email").value.trim(), phone = $("phone").value.trim();
  const pw = $("pw").value;
  if (!name) return msg("Enter your full name.", "err");
  if (!/^\S+@\S+\.\S+$/.test(email)) return msg("Enter a valid email address.", "err");
  if (phone.length < 7) return msg("Enter your phone number.", "err");
  if (pw.length < 8) return msg("Password must be at least 8 characters.", "err");
  if (pw !== $("pw2").value) return msg("The two passwords do not match.", "err");
  if (!$("terms").checked) return msg("Tick the box to accept the terms.", "err");

  $("btn").disabled = true; msg("Creating your account...", "ok");
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, "students", cred.user.uid), {
      name, email, phone,
      country: $("country").value.trim(),
      level: $("level").value,
      interests: [...document.querySelectorAll("#interests input:checked")].map(i => i.value),
      coins: 0,
      createdAt: serverTimestamp()
    });
    msg("Account created. Taking you to your wallet...", "ok");
    setTimeout(() => location.href = "wallet.html", 1200);
  } catch (err) {
    console.error(err);
    msg(errors[err.code] || ("Could not create account: " + (err.code || err.message)), "err");
    $("btn").disabled = false;
  }
});
</script>
</body>
</html>
