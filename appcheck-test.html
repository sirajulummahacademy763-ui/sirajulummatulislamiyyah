<body><h2>App Check test</h2><p>Wait about 10 seconds. Send me a screenshot of this page.</p><pre id="o">Starting...</pre>
<script type="module">

 const ac=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js");

 const app=initializeApp({apiKey:"AIzaSyAk15eZoNwGaX1YsXeXq33kALfm-sgBx8A",authDomain:"sirajul-ummah-academy.firebaseapp.com",projectId:"sirajul-ummah-academy",appId:"1:767042103810:web:881e896d8b7bf78a9b951b"},"actest");
 const c=ac.initializeAppCheck(app,{provider:new ac.ReCaptchaEnterpriseProvider("6Ld-MQluAAAAAPfPV7_oLFWRv6XapjnACmh2Inzo"),isTokenAutoRefreshEnabled:false});
 say("3. App Check started on "+location.hostname+", asking Google for a token...");
