<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Classes | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.ca{max-width:860px}
.cd{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.cd h2{margin:0 0 8px;font-size:1.2rem}
.hint{color:#555;font-size:.9rem;margin:2px 0 8px}
.sb{border-top:1px solid var(--line);padding:10px 0}
.sb b{font-size:1.02rem}.sb .ar{font-family:Amiri,serif;color:#b87d0c;margin-left:8px;font-size:1.15rem}
.ls{list-style:none;margin:6px 0 0;padding:0;color:#4b5072;font-size:.92rem}
.ls li{padding:2px 0}
.er{color:#b3261e}.ok{color:#1c7a4d}
.hw{margin-top:14px;border-top:2px solid #f5b94a;padding-top:12px}
.hw h3{margin:0 0 6px;font-size:1.05rem}
.hw label{display:block;font-size:.85rem;font-weight:700;margin:8px 0 3px}
.hw input,.hw select,.hw textarea{width:100%;box-sizing:border-box;padding:10px;border:1.5px solid #cfd3e8;border-radius:8px;font:inherit;background:#fff}
.hw .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hw .pb{font:inherit;font-weight:700;padding:10px 16px;border:0;border-radius:10px;background:#12163a;color:#fff;cursor:pointer;margin-top:10px}
.hw .po{border:1px solid #cfd3e8;border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.hw .po b{display:block}.hw .po small{color:#4b5072}
.hw .po button{font:inherit;font-size:.85rem;padding:6px 10px;border:1.5px solid #e8c4c1;border-radius:8px;background:#fff;color:#b3261e;cursor:pointer}
.hw .po button.ab{border-color:#cfd3e8;color:#12163a;margin-top:6px}
.hw .po button.pb{background:#12163a;color:#fff;border:0;padding:8px 14px;margin-top:8px}
.hw .sa{border-top:1px dashed #cfd3e8;margin-top:8px;padding-top:8px}.hw .sa small{margin-left:6px}
@media(max-width:560px){.hw .g2{grid-template-columns:1fr}}
</style></head><body>
<main class="page ca" id="app"><p>Loading...</p></main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc, addDoc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const SN = { islamic: "Arabic and Islamic", western: "Western", tech: "Technology" };
const DN = { 0: "Sunday", 1: "Monday", 2: "Tuesday", 3: "Wednesday", 4: "Thursday", 5: "Friday", 6: "Saturday" };
const planId = (sec, lvl) => sec + "__" + lvl.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
onAuthStateChanged(auth, async u => {
  if (!u) return $("app").innerHTML = '<h1>My Classes</h1><p>Please <a href="login.html">log in</a> first.</p>';
  try {
    const t = await getDoc(doc(db, "teachers", u.uid));
    if (!t.exists()) return $("app").innerHTML = "<h1>My Classes</h1><p>This page is for teachers.</p>";
    const a = await getDoc(doc(db, "teacherAssign", u.uid));
    const items = a.exists() ? (a.data().items || []) : [];
    let h = `<h1>My Classes · فصولي</h1>`;
    if (!items.length) return $("app").innerHTML = h + '<p class="hint">No class has been assigned to you yet. The admin will assign you soon.</p>';
    h += `<p class="hint">The classes and subjects the admin assigned to you.</p>`;
    const boxes = [];
    let idx = 0;
    for (const i of items) {
      const p = await getDoc(doc(db, "classPlans", planId(i.section, i.level)));
      const d = p.exists() ? p.data() : {};
      const mine = i.subjects && i.subjects.length ? i.subjects : null;
      const subs = (d.subjects || []).filter(s => !mine || mine.includes(s.name));
      const names = mine || subs.map(s => s.name);
      h += `<div class="cd"><h2>${esc(SN[i.section] || i.section)} · ${esc(i.level)}</h2>`;
      if (d.term && d.term.name) h += `<p class="hint">${esc(d.term.name)}${d.term.start ? " · " + esc(d.term.start) + " to " + esc(d.term.end || "") : ""}</p>`;
      h += `<p><a class="b" style="text-decoration:none;display:inline-block;background:#12163a;color:#fff;padding:9px 16px;border-radius:10px;font-weight:700" href="classroom.html?id=${encodeURIComponent(i.section + "__" + i.level.replace(/[^A-Za-z0-9]+/g, "-"))}">Open classroom</a></p>`;
      if (!names.length) h += `<p class="hint">No subjects have been set for this class yet.</p>`;
      names.forEach(n => {
        const s = (d.subjects || []).find(x => x.name === n) || { name: n };
        const sl = (d.slots || []).filter(x => x.subject === n).sort((x, y) => ((x.day + 6) % 7) - ((y.day + 6) % 7) || String(x.start).localeCompare(String(y.start)));
        h += `<div class="sb"><b>${esc(n)}</b>${s.nameAr ? `<span class="ar" dir="rtl">${esc(s.nameAr)}</span>` : ""}`;
        h += sl.length ? `<ul class="ls">${sl.map(x => `<li>${esc(DN[x.day])} · ${esc(x.start)}–${esc(x.end)} (${esc((x.tz || d.tzId || "Africa/Lagos").replace(/_/g, " "))})${x.where ? " · " + esc(x.where) : ""}</li>`).join("")}</ul>` : `<ul class="ls"><li>No lesson time set yet.</li></ul>`;
        h += `</div>`;
      });
      const n = idx++; boxes.push({ n, i, names });
      h += `<div class="hw" id="hw${n}"></div></div>`;
    }
    $("app").innerHTML = h;
    const tname = (t.data() && t.data().name) || u.email || "Teacher";
    boxes.forEach(b => homework(b.n, b.i, b.names, u.uid, tname));
  } catch (e) { $("app").innerHTML = '<h1>My Classes</h1><p class="er">Could not load: ' + esc(e.code || e.message) + "</p>"; }
});

const fmt = s => s ? new Date(s.seconds * 1000).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
async function homework(n, i, names, uid, tname) {
  const box = $("hw" + n), key = i.section + "|" + i.level;
  let open = null;
  const answers = (p, all) => {
    const sl = all.filter(s => s.workId === p.id);
    let h = `<button class="ab" type="button" data-ans="${p.id}">Answers (${sl.length})</button>`;
    if (open === p.id) h += sl.length ? sl.map(s => `<div class="sa"><b>${esc(s.studentName || "Student")}</b><small>${s.status === "graded" ? "Marked" : "Not marked"}</small><span style="white-space:pre-wrap;display:block;margin:4px 0">${esc(s.text)}</span>${/^data:audio\//.test(s.audio || "") ? `<audio controls preload="none" style="width:100%;margin:6px 0" src="${s.audio}"></audio>` : ""}${/^data:image\//.test(s.photo || "") ? `<img src="${s.photo}" alt="Photo of the answer" style="max-width:100%;max-height:340px;border-radius:8px;display:block;margin:6px 0;cursor:zoom-in" onclick="window.open(this.src)">` : ""}<div class="g2"><input id="sc_${s.id}" placeholder="Mark (for example 8/10)" value="${esc(s.score || "")}"><input id="fb_${s.id}" placeholder="Feedback" value="${esc(s.feedback || "")}"></div><button class="pb" type="button" data-grade="${s.id}">Save mark</button></div>`).join("") : '<p class="hint">No answers yet.</p>';
    return h;
  };
  const list = async () => {
    let ps = [], subsAll = [];
    try { subsAll = (await getDocs(query(collection(db, "classWorkSubs"), where("classKey", "==", key)))).docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) {}
    try { ps = (await getDocs(query(collection(db, "classWork"), where("classKey", "==", key)))).docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ((b.createdAt && b.createdAt.seconds) || 9e9) - ((a.createdAt && a.createdAt.seconds) || 9e9)).slice(0, 15); } catch (e) { return '<p class="er">Could not load posts.</p>'; }
    return ps.length ? ps.map(p => `<div class="po"><span><b>${esc(p.title)}</b><small>${p.kind === "homework" ? "Homework" : "Note"} · ${esc(p.subject || "General")}${p.due ? " · due " + esc(p.due) : ""} · ${fmt(p.createdAt)}${p.teacherName ? " · " + esc(p.teacherName) : ""}</small><span style="white-space:pre-wrap;display:block;margin-top:4px">${esc(p.body)}</span>${p.kind === "homework" ? answers(p, subsAll) : ""}</span><button data-del="${p.id}" type="button">Delete</button></div>`).join("") : '<p class="hint" style="color:#4b5072">Nothing posted yet.</p>';
  };
  const draw = async (msg, good) => {
    box.innerHTML = `<h3>Homework and notes for students</h3>
      <div class="g2"><div><label>Subject</label><select id="hs${n}"><option value="">General (whole class)</option>${names.map(x => `<option>${esc(x)}</option>`).join("")}</select></div>
      <div><label>Type</label><select id="hk${n}"><option value="homework">Homework</option><option value="note">Class note</option></select></div></div>
      <label>Title</label><input id="ht${n}" placeholder="For example: Exercise 3 on page 12">
      <label>Details</label><textarea id="hb${n}" rows="3"></textarea>
      <label>Due date (optional)</label><input id="hd${n}" type="date">
      <button class="pb" id="hp${n}" type="button">Post to students</button> <span id="hm${n}" class="${good ? "ok" : "er"}">${esc(msg || "")}</span>
      <div id="hl${n}">${await list()}</div>`;
    $("hp" + n).onclick = async () => {
      const title = $("ht" + n).value.trim(), body = $("hb" + n).value.trim();
      if (!title) return draw("Enter a title.");
      try {
        await addDoc(collection(db, "classWork"), { classKey: key, section: i.section, level: i.level, subject: $("hs" + n).value, kind: $("hk" + n).value, title, body, due: $("hd" + n).value, teacherId: uid, teacherName: tname, createdAt: serverTimestamp() });
        draw("Posted. Students of this class can see it now.", true);
      } catch (e) { draw("Could not post: " + (e.code || e.message)); }
    };
    box.querySelectorAll("[data-ans]").forEach(b => b.onclick = () => { open = open === b.dataset.ans ? null : b.dataset.ans; draw(); });
    box.querySelectorAll("[data-grade]").forEach(b => b.onclick = async () => { const id = b.dataset.grade; try { await updateDoc(doc(db, "classWorkSubs", id), { score: $("sc_" + id).value.trim(), feedback: $("fb_" + id).value.trim(), status: "graded", gradedAt: serverTimestamp() }); draw("Mark saved.", true); } catch (e) { draw("Could not save: " + (e.code || e.message)); } });
    box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (!confirm("Delete this post?")) return; try { await deleteDoc(doc(db, "classWork", b.dataset.del)); draw("Deleted.", true); } catch (e) { draw("Could not delete: " + (e.code || e.message)); } });
  };
  draw();
}
</script></body></html>
