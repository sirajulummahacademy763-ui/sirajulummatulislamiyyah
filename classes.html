<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your classes | Sirajul Ummah Islamic Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><script src="site.js" defer></script>
<style>
.cx{max-width:640px}
.bx{background:#fff;border:1.5px solid #cfd3e8;border-top:5px solid #f5b94a;border-radius:16px;padding:26px}
.bx label{display:block;font-weight:700;margin:18px 0 6px}
.bx select{width:100%;padding:12px;border:1.5px solid #cfd3e8;border-radius:10px;font:inherit;background:#fff}
.bx button,.bx a.bt{display:inline-block;margin-top:22px;width:100%;padding:14px;border:0;border-radius:10px;background:#12163a;color:#f5b94a;font:700 1.05rem Figtree,sans-serif;cursor:pointer;text-align:center;text-decoration:none}
.nt{color:#4b5072;font-size:.92rem;margin-top:14px}
.er{color:#b3261e;font-weight:500;margin-top:10px}
</style></head><body>
<main class="page cx">
<h1>Choose your classes</h1>
<p class="lead">We will show you only the courses and books for your classes.</p>
<div class="bx" id="app"><p>Loading...</p></div>
</main>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const L = {
  islamic: ["Rawdatul Atfal 1", "Rawdatul Atfal 2", "Ibtidai 1", "Ibtidai 2", "Ibtidai 3", "I'dadi 1", "I'dadi 2", "I'dadi 3", "Thanawi 1", "Thanawi 2", "Thanawi 3"],
  western: ["Kindergarten (KG)", "Primary 1", "Primary 2", "Primary 3", "Primary 4", "Primary 5", "Primary 6", "JSS 1", "JSS 2", "JSS 3", "SSS 1", "SSS 2", "SSS 3"],
  tech: ["Beginner", "Intermediate", "Advanced"]
};
const opts = a => '<option value="">Select...</option>' + a.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("") + '<option value="none">I do not want this section</option>';

onAuthStateChanged(auth, async u => {
  if (!u) return;
  let s = null;
  try { const d = await getDoc(doc(db, "students", u.uid)); if (d.exists()) s = d.data(); } catch (e) {}
  if (!s) return $("app").innerHTML = "<p>Your student account was not found.</p>";
  if (s.classes) {
    const c = s.classes, n = v => !v || v === "none" ? "None" : esc(v);
    return $("app").innerHTML = `<p><b>Your classes are already set.</b></p><p>Arabic and Islamic: <b>${n(c.islamic)}</b><br>Western: <b>${n(c.western)}</b><br>Technology: <b>${n(c.tech)}</b></p><p class="nt">To change them, please contact the institute.</p><a class="bt" href="index.html">Continue</a>`;
  }
  $("app").innerHTML = `<label for="i">Arabic and Islamic class</label><select id="i">${opts(L.islamic)}</select>
    <label for="w">Western class</label><select id="w">${opts(L.western)}</select>
    <label for="t">Technology level</label><select id="t">${opts(L.tech)}</select>
    <p class="nt">Choose carefully. You cannot change this yourself later. The institute can change it for you.</p>
    <button id="sv" type="button">Save my classes</button><div class="er" id="er"></div>`;
  $("sv").onclick = async () => {
    const i = $("i").value, w = $("w").value, t = $("t").value;
    if (!i || !w || !t) return $("er").textContent = "Please choose an option in all three boxes.";
    if (!confirm("Save these classes? You cannot change them yourself later.")) return;
    try { await updateDoc(doc(db, "students", u.uid), { classes: { islamic: i, western: w, tech: t } }); location.href = "index.html"; }
    catch (e) { $("er").textContent = "Could not save: " + (e.code || e.message); }
  };
});
</script>
</body></html>
